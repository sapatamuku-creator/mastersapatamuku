<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SapaTamu.ku - Welcome Sign V7.2 (Multi-Client Support)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --gold: #D4AF37; 
            --pure-white: #FFFFFF; 
        }
        body, html { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; background: #000; font-family: 'Montserrat', sans-serif; cursor: none; }

        .master-container { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: grid; grid-template-columns: 1.2fr 2.8fr; z-index: 999;
        }

        /* TIMELINE PANEL */
        #timeline-panel { 
            background: #0a0a0a; padding: 4vh 2.5vw; border-right: 1px solid #222; 
            display: flex; flex-direction: column; position: relative; z-index: 1000;
            overflow: hidden;
        }
        
        .rundown-item { 
            position: relative; padding-left: 30px; margin-bottom: 3vh; 
            opacity: 0.2; transition: all 0.8s ease; color: var(--pure-white);
        }

        .rundown-item::before { 
            content: ''; position: absolute; left: 0; top: 10px; width: 8px; 
            height: 8px; border-radius: 50%; background: #333; z-index: 2;
            transition: all 0.5s ease;
        }
        
        .event-time { font-size: clamp(0.8rem, 1.2vw, 1.1rem); font-weight: 600; opacity: 0.8; }
        .event-name { font-size: clamp(1rem, 1.8vw, 1.6rem); font-weight: 700; text-transform: uppercase; letter-spacing: -0.02em; }

        .active-event { 
            opacity: 1 !important; 
            color: var(--gold) !important; 
            transform: translateX(10px);
        }

        .active-event::before { 
            background: var(--gold) !important; 
            box-shadow: 0 0 20px var(--gold);
            transform: scale(1.5);
        }

        .powered-by {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            font-size: 9px; letter-spacing: 3px; color: rgba(255,255,255,0.15);
            text-transform: uppercase; text-align: center; width: 100%;
        }
        .powered-by span { font-weight: 800; color: var(--gold); opacity: 0.8; }

        /* WELCOME PANEL */
        #welcome-panel { 
            position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center;
            overflow: hidden; background: #000;
        }
        #welcome-panel::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.65); z-index: 5; }
        #slideshow-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

        .slide { position: absolute; inset: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0; transition: opacity 2.5s ease; }
        .slide.active { opacity: 1; z-index: 3; }

        .content-wrapper { position: relative; z-index: 10; text-align: center; width: 90%; }
        
        .main-label { font-size: clamp(0.7rem, 1.1vw, 1.2rem); letter-spacing: 0.8vw; margin-bottom: 1vh; }
        .couple-title { 
            font-family: 'Playfair Display', serif; font-style: italic; 
            font-size: clamp(2.5rem, 5vw, 5.5rem); 
            color: var(--gold); line-height: 1.1; text-shadow: 0 4px 30px rgba(0,0,0,0.8);
        }
        .wedding-date { font-size: clamp(0.8rem, 1.2vw, 1.4rem); letter-spacing: 0.5vw; margin-top: 2vh; }

        /* Guest Box */
        .guest-label { font-size: clamp(0.8rem, 1vw, 1.2rem); letter-spacing: 0.6vw; margin-bottom: 1vh; color: rgba(255,255,255,0.6); }
        .guest-name { 
            font-weight: 800; 
            font-size: clamp(2rem, 5.5vw, 6rem); 
            color: var(--pure-white); text-transform: uppercase; 
            margin: 1vh 0; line-height: 1.1; 
            word-wrap: break-word; text-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        .guest-info { font-size: clamp(0.9rem, 1.3vw, 1.5rem); }

        .footer { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.9); padding: 2vh 0; border-top: 1px solid var(--gold); z-index: 20; }
        #marquee-log { font-size: clamp(1.2rem, 2.5vw, 2.2rem); }

        /* Clock Style */
        #realtime-clock { font-family: 'Courier New', Courier, monospace; }

        /* Controls */
        #fs-btn { position: fixed; bottom: 120px; right: 40px; z-index: 2000; background: rgba(0,0,0,0.7); border: 1.5px solid var(--gold); color: var(--gold); padding: 18px; border-radius: 50%; cursor: pointer; opacity: 0; transition: 0.5s; visibility: hidden; }
        .show-btn { opacity: 1 !important; visibility: visible !important; }
        .show-cursor { cursor: default !important; }
        
        .animate-in { animation: slideUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }
        /* VENDOR LIST ANIMATION */
        .vendor-display-area {
            position: relative;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .vendor-card {
            position: absolute;
            width: 100%;
            text-align: center;
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .vendor-card .vendor-role {
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 0.5vh;
            font-weight: 600;
        }

        .vendor-card .vendor-name {
            font-weight: 800;
            line-height: 1.2;
        }

        /* MAINSHOW State */
        .vendor-card.mainshow {
            transform: translateY(-2vh) scale(1);
            opacity: 1;
            z-index: 10;
        }
        .vendor-card.mainshow .vendor-role {
            font-size: clamp(0.7rem, 1.1vw, 1.1rem);
            color: rgba(255, 255, 255, 0.7);
        }
        .vendor-card.mainshow .vendor-name {
            font-size: clamp(1.4rem, 2.2vw, 2.2rem);
            color: var(--gold);
            text-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);
        }

        /* SUBSHOW State (film credits style below mainshow) */
        .vendor-card.subshow {
            transform: translateY(12vh) scale(0.65);
            opacity: 0.35;
            z-index: 5;
        }
        .vendor-card.subshow .vendor-role {
            font-size: clamp(0.5rem, 0.8vw, 0.8rem);
            color: rgba(255, 255, 255, 0.4);
        }
        .vendor-card.subshow .vendor-name {
            font-size: clamp(1rem, 1.5vw, 1.5rem);
            color: var(--pure-white);
        }

        /* Enter from top */
        .vendor-card.enter-from-top {
            transform: translateY(-25vh) scale(0.8);
            opacity: 0;
            z-index: 1;
        }

        /* Exit completely to bottom */
        .vendor-card.exit-completely {
            transform: translateY(28vh) scale(0.4);
            opacity: 0;
            z-index: 0;
        }

        /* Character Rotation Style */
        .char-span {
            display: inline-block;
            transform-origin: center bottom;
            animation: charRotateIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }

        @keyframes charRotateIn {
            0% {
                opacity: 0;
                transform: rotateY(-90deg) translateY(5px);
            }
            100% {
                opacity: 1;
                transform: rotateY(0deg) translateY(0);
            }
        }
    </style>
</head>
<body>

<button id="fs-btn" onclick="toggleFS()">
    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
</button>

<div class="master-container">
    <div id="timeline-panel">
        <div class="flex justify-between items-center mb-8 opacity-80">
            <div id="timeline-title" class="text-[10px] font-bold tracking-[4px] text-[#D4AF37] uppercase">Event Timeline</div>
            <div id="realtime-clock" class="text-[14px] font-bold tracking-[2px] text-white">00:00:00</div>
        </div>
        <!-- Rundown View -->
        <div id="rundown-view" class="flex-grow flex flex-col justify-start transition-all duration-1000 opacity-100">
            <div id="rundown-list" class="flex-grow"></div>
        </div>

        <!-- Vendor View -->
        <div id="vendor-view" class="absolute inset-x-0 bottom-[8vh] top-[10vh] px-[2.5vw] flex flex-col transition-all duration-1000 opacity-0 pointer-events-none">
            <div class="vendor-display-area flex-grow"></div>
        </div>
        <div class="powered-by">Powered by <span>SapaTamu.ku</span></div>
    </div>

    <div id="welcome-panel">
        <div id="slideshow-container"></div>
        <div class="content-wrapper">
            <span class="main-label block uppercase text-white/70">Selamat Datang di Pernikahan</span>
            <h1 id="couple-name" class="couple-title">Memuat...</h1>
            <div id="wedding-date" class="wedding-date uppercase text-white/80"></div>
            
            <div id="guest-box" class="mt-12 opacity-0">
                <span class="guest-label block uppercase">Yth. Bapak/Ibu/Sdr/i</span>
                <h1 id="guest-name" class="guest-name">...</h1>
                <div class="guest-info font-medium text-[#F3F4F6] tracking-wide">
                    <span id="g-cat" class="text-[#D4AF37] font-bold"></span> &nbsp;&bull;&nbsp; 
                    <span id="g-addr"></span>
                </div>
            </div>
        </div>
        <div class="footer">
            <marquee id="marquee-log" class="text-white font-bold tracking-wider"></marquee>
        </div>
    </div>
</div>

<script>function getSSID() {
        const urlParams = new URLSearchParams(window.location.search);
        let id = urlParams.get('ssId');
        if (id) {
            sessionStorage.setItem('active_ssId', id);
            return id;
        }
        const savedId = sessionStorage.getItem('active_ssId') || (localStorage.getItem('sapatamu_db') ? JSON.parse(localStorage.getItem('sapatamu_db')).ssId : null);
        if (savedId) {
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?ssId=' + savedId;
            window.history.replaceState({path:newUrl}, '', newUrl);
            return savedId;
        }
        return "1l4NNvzl-9GpVqoVWlIha9POQLKGzSA8ByF1dTLp6SYc";
    }

    const ssId = getSSID();
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzy244BM3lYzw0ix7jD-_1Qvxu3deKukqHDJbr4RcJQn-K7k5Dgzw1sEBclT2w8jIys/exec"; 

    
    function updateInternalLinks() {
        if (!ssId) return;
        const links = document.querySelectorAll('a');
        links.forEach(link => {
            const href = link.getAttribute('href');
            if (href && !href.startsWith('http') && !href.startsWith('#') && !href.startsWith('mailto')) {
                const separator = href.includes('?') ? '&' : '?';
                if (!href.includes('ssId=')) {
                    link.setAttribute('href', href + separator + 'ssId=' + ssId);
                }
            }
        });
    }

    let localVendors = [];
    let currentView = 'rundown';
    let rotationTimer = null;
    let activeVendorTimeout = null;
    let loopTimeout = null;
    let rotationStarted = false;

    // Helper: wrap characters in spans for wave rotation animation
    function wrapCharacters(text, delayStart = 0) {
        if (!text) return '';
        return text.toString().split('').map((char, i) => {
            if (char === ' ') return '<span>&nbsp;</span>';
            const delay = delayStart + (i * 0.03); // 30ms delay per character
            return `<span class="char-span" style="animation-delay: ${delay}s">${char}</span>`;
        }).join('');
    }

    // Main Rotation Loop: Rundown <-> Vendors
    function startRotationLoop() {
        if (rotationStarted) return;
        rotationStarted = true;
        runRotation();
    }

    function runRotation() {
        const rundownView = document.getElementById('rundown-view');
        const vendorView = document.getElementById('vendor-view');
        const titleEl = document.getElementById('timeline-title');

        if (currentView === 'rundown') {
            // Switch to Rundown View
            if (rundownView) {
                rundownView.classList.remove('opacity-0', 'pointer-events-none');
                rundownView.classList.add('opacity-100');
            }
            if (vendorView) {
                vendorView.classList.remove('opacity-100');
                vendorView.classList.add('opacity-0', 'pointer-events-none');
            }
            if (titleEl) titleEl.innerText = "Event Timeline";

            // Show rundown for 10 seconds, then switch to vendors if available
            rotationTimer = setTimeout(() => {
                if (localVendors && localVendors.length > 0) {
                    currentView = 'vendor';
                }
                runRotation();
            }, 10000);
        } else {
            // Switch to Vendor View
            if (rundownView) {
                rundownView.classList.remove('opacity-100');
                rundownView.classList.add('opacity-0', 'pointer-events-none');
            }
            if (vendorView) {
                vendorView.classList.remove('opacity-0', 'pointer-events-none');
                vendorView.classList.add('opacity-100');
            }
            if (titleEl) titleEl.innerText = "Wedding Vendors";

            // Start animating vendors
            animateVendorsSequence(() => {
                // Switch back to rundown when sequence completes
                currentView = 'rundown';
                runRotation();
            });
        }
    }

    function animateVendorsSequence(onComplete) {
        const displayArea = document.querySelector('.vendor-display-area');
        if (!displayArea) {
            onComplete();
            return;
        }

        // Clear previous cards
        displayArea.innerHTML = '';
        clearTimeout(activeVendorTimeout);
        clearTimeout(loopTimeout);

        if (!localVendors || localVendors.length === 0) {
            // Fallback: if no vendors, show empty space for 6 seconds
            loopTimeout = setTimeout(onComplete, 6000);
            return;
        }

        let index = 0;
        let mainCard = null;
        let subCard = null;

        function nextVendor() {
            if (index >= localVendors.length) {
                // All vendors shown. Wait for the last one to be viewed (3 seconds)
                // Then clear cards and finish
                loopTimeout = setTimeout(() => {
                    if (mainCard) mainCard.className = 'vendor-card exit-completely';
                    if (subCard) subCard.className = 'vendor-card exit-completely';
                    
                    // Wait for transition to complete
                    loopTimeout = setTimeout(() => {
                        displayArea.innerHTML = '';
                        onComplete();
                    }, 1200);
                }, 3000);
                return;
            }

            const vendor = localVendors[index];

            // Create new vendor card in entry state
            const card = document.createElement('div');
            card.className = 'vendor-card enter-from-top';
            card.innerHTML = `
                <div class="vendor-role">${wrapCharacters(vendor.role, 0)}</div>
                <div class="vendor-name">${wrapCharacters(vendor.name, 0.2)}</div>
            `;
            displayArea.appendChild(card);

            // Force reflow
            void card.offsetWidth;

            // Move cards down the film credit trail
            if (subCard) {
                const oldSub = subCard;
                oldSub.className = 'vendor-card exit-completely';
                setTimeout(() => oldSub.remove(), 1200);
            }

            if (mainCard) {
                subCard = mainCard;
                subCard.className = 'vendor-card subshow';
            }

            mainCard = card;
            mainCard.className = 'vendor-card mainshow';

            index++;

            // If only 1 vendor exists in total, let it stay for 6 seconds as mainshow
            let delay = 3000;
            if (localVendors.length === 1) {
                delay = 6000;
            }

            activeVendorTimeout = setTimeout(nextVendor, delay);
        }

        nextVendor();
    }

    let currentGuestName = ""; 
    let syncTimer; 
    let btnTimer, cursorTimer;

    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('realtime-clock').innerText = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function handleUIVisibility() {
        const fsBtn = document.getElementById('fs-btn');
        document.body.classList.add('show-cursor');
        fsBtn.classList.add('show-btn');
        clearTimeout(btnTimer);
        btnTimer = setTimeout(() => { fsBtn.classList.remove('show-btn'); }, 3000);
        clearTimeout(cursorTimer);
        cursorTimer = setTimeout(() => { document.body.classList.remove('show-cursor'); }, 10000);
    }
    document.addEventListener('mousemove', handleUIVisibility);

    function convertToTimeValue(input) {
        if (!input) return 0;
        let str = String(input);
        const parts = str.match(/(\d{2}):(\d{2})/);
        return parts ? (parseInt(parts[1]) * 100) + parseInt(parts[2]) : 0;
    }

    async function syncData() {
        try {
            const response = await fetch(`${SCRIPT_URL}?action=getWelcome&ssId=${ssId}&action_sub=getWelcomeData`);
            const data = await response.json();
            if (data.error) throw new Error(data.error);

            document.getElementById('couple-name').innerText = data.weddingName;
            document.getElementById('wedding-date').innerText = data.weddingDate; 

            const guest = data.latestGuest;
            if (guest.nama && guest.nama !== currentGuestName) {
                const box = document.getElementById('guest-box');
                box.classList.remove('animate-in');
                void box.offsetWidth; 
                box.classList.add('animate-in');
                box.style.opacity = "1";
                document.getElementById('guest-name').innerText = guest.nama.toUpperCase();
                document.getElementById('g-cat').innerText = guest.kategori || "";
                document.getElementById('g-addr').innerText = guest.alamat || "";
                currentGuestName = guest.nama;
            }

            document.getElementById('marquee-log').innerText = data.log ? data.log.toUpperCase() : "MENUNGGU TAMU...";

            const now = new Date();
            const nowVal = (now.getHours() * 100) + now.getMinutes();
            let rundownHtml = "";
            (data.rundown || []).forEach((item, i, arr) => {
                const startVal = convertToTimeValue(item.syncTime);
                const nextItem = arr[i + 1];
                let active = nextItem ? (nowVal >= startVal && nowVal < convertToTimeValue(nextItem.syncTime)) : (nowVal >= startVal);
                rundownHtml += `
                    <div class="rundown-item ${active ? 'active-event' : ''}">
                        <div class="event-time">${item.displayTime}</div>
                        <div class="event-name">${item.eventName}</div>
                    </div>`;
            });
            document.getElementById('rundown-list').innerHTML = rundownHtml;

            // Update Vendors data
            if (data.vendors) {
                localVendors = data.vendors;
            }
            // Start rotation loop
            startRotationLoop();

            clearTimeout(syncTimer);
            syncTimer = setTimeout(syncData, data.displayDuration || 12000);
        } catch (e) { 
            console.error("Sync Error:", e);
            clearTimeout(syncTimer);
            syncTimer = setTimeout(syncData, 5000);
        }
    }

    const driveLinks = ['1jBzMvevbhVvuVFTzwiLzmrum5IiEpwwz', '1eKbny1NdR_7sfjqvglG5aQJ_X4zFFB37', '15waCQUlbpYEfMDmp3oPpS-9ZMxJxfqPp', '1vlJ_pl56qxth-WpenNJ2BUTTTBhdtGlQ'];
    let slideIdx = 0;

    function initSlideshow() {
        const container = document.getElementById('slideshow-container');
        driveLinks.forEach((id, i) => {
            const div = document.createElement('div');
            div.className = `slide ${i === 0 ? 'active' : ''}`;
            div.style.backgroundImage = `url('https://drive.google.com/thumbnail?id=${id}&sz=w1920')`;
            container.appendChild(div);
        });
        setInterval(() => {
            const slides = document.querySelectorAll('.slide');
            if(slides.length < 2) return;
            slides[slideIdx].classList.remove('active');
            slideIdx = (slideIdx + 1) % slides.length;
            slides[slideIdx].classList.add('active');
        }, 11000);
    }

    window.toggleFS = function() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    };

    window.addEventListener('DOMContentLoaded', () => {
        initSlideshow();
        handleUIVisibility();
        syncData();
        updateInternalLinks();
        setTimeout(updateInternalLinks, 1500); 
    });
</script>
</body>
</html>
