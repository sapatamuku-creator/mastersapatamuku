<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Loading... SapaTamu.Ku</title>
    <script src="subdomain_resolver.js?v=3.3"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Montserrat:wght@200;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Dynamic CSS will be injected here -->
    <style id="dynamic-style"></style>

    <style>
        /* Global Shell Styles (Loader) */
        #shell-loader {
            position: fixed; inset: 0; z-index: 99999;
            background: #ffffff; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 1s ease;
        }
        .shell-spinner {
            width: 50px; height: 50px; border: 3px solid #f3f3f3;
            border-top: 3px solid #1a1a1a; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body id="dynamic-body">
    <!-- Shell Loader -->
    <div id="shell-loader">
        <div class="shell-spinner"></div>
        <p class="text-xs font-bold text-neutral-400 tracking-widest uppercase">Mempersiapkan Undangan</p>
    </div>

    <!-- Music Player (Global) -->
    <div id="music-btn" class="fixed z-[110] bottom-8 right-8 hidden opacity-0 transition-all duration-500">
        <button onclick="toggleMusic()" class="w-14 h-14 bg-white border shadow-2xl rounded-full flex flex-col items-center justify-center gap-1">
            <div id="visualizer" class="music-bars paused">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <p id="music-txt" class="text-[7px] font-bold uppercase tracking-tighter text-neutral-400">PLAY</p>
        </button>
    </div>
    <audio id="main-audio" loop preload="auto"></audio>

    <!-- Global Logic Script -->
    <script>
        // ─── 1. CORE VARIABLES & SETUP ───
        const urlParams = new URLSearchParams(window.location.search);
        let guestName = urlParams.get('u');
        let guestId = urlParams.get('id');

        // Path fallback (/u/ID/NAMA)
        if (!guestName || !guestId) {
            const pathParts = window.location.pathname.split('/');
            const uIdx = pathParts.indexOf('u');
            if (uIdx !== -1 && pathParts[uIdx + 1]) {
                guestId = pathParts[uIdx + 1];
                guestName = pathParts[uIdx + 2];
            }
        }
        if (guestName) guestName = decodeURIComponent(guestName.replace(/\+/g, ' '));
        else guestName = "Tamu Undangan";
        if (!guestId) guestId = "STK-" + Math.random().toString(36).substr(2, 6).toUpperCase();

        const SB_URL = "https://llrapesaaoliyjrrrsjh.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxscmFwZXNhYW9saXlqcnJyc2poIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxNzU2ODUsImV4cCI6MjA5NDc1MTY4NX0.rZPCxRQmjb3SyimYDokgm1R1u2QSqj3iBv0gGEEteII";

        // ─── 2. DYNAMIC FETCHER ENGINE ───
        async function fetchTemplateEngine(themeId) {
            try {
                // Fetch Layout HTML
                const htmlRes = await fetch(`/assets/templates/${themeId}/layout.html`);
                if (!htmlRes.ok) throw new Error("Template HTML tidak ditemukan.");
                const htmlText = await htmlRes.text();
                
                // Inject Layout (append ke body, hindari hapus audio & loader)
                const templateWrapper = document.createElement('div');
                templateWrapper.id = "template-wrapper";
                templateWrapper.innerHTML = htmlText;
                document.getElementById('dynamic-body').appendChild(templateWrapper);

                // Fetch CSS
                const cssRes = await fetch(`/assets/templates/${themeId}/style.css`);
                if (cssRes.ok) {
                    const cssText = await cssRes.text();
                    document.getElementById('dynamic-style').innerHTML = cssText;
                }

                console.log(`✅ Template [${themeId}] loaded successfully.`);
                return true;
            } catch (e) {
                console.error("Gagal meload template:", e);
                document.getElementById('shell-loader').innerHTML = `<p class="text-red-500">Gagal memuat template: ${themeId}</p>`;
                return false;
            }
        }

        // ─── 3. LOAD DATA FROM SUPABASE ───
        async function loadDynamicConfig() {
            if (!window.SAPATAMU_RESOLVED) { setTimeout(loadDynamicConfig, 100); return; }
            const ssId = window.CURRENT_SS_ID || urlParams.get('ssId');
            if (!ssId) { document.getElementById('shell-loader').innerHTML = "Akses Tidak Valid."; return; }

            try {
                // 1. Dapatkan JSON Konfigurasi dari Supabase
                const sbRes = await fetch(
                    `${SB_URL}/rest/v1/config_invitation?ssid=eq.${ssId}&select=data&limit=1`,
                    { headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY } }
                );
                
                if (sbRes.ok) {
                    const rows = await sbRes.json();
                    if (rows && rows.length > 0 && rows[0].data) {
                        const invData = rows[0].data;
                        const themeId = invData.theme || "standard_clean_minimalis_1";

                        // 2. Fetch Cangkang Template
                        const isLoaded = await fetchTemplateEngine(themeId);
                        
                        // 3. Render Data ke Template
                        if(isLoaded) {
                            window.applyLivePreview(invData);
                            initializeScripts(); // Countdown, dll
                        }
                        return;
                    }
                }
            } catch (e) {
                console.error("Supabase load failed", e);
            }

            // Fallback jika kosong
            document.getElementById('shell-loader').innerHTML = "Konfigurasi belum diset. Silakan buka Control Panel.";
        }

        // ─── 4. MAPPER / RENDERER SCRIPT (The Engine) ───
        window.applyLivePreview = function (data) {
            console.log("Applying Live Preview Data:", data);
            
            function formatDateId(ds) {
                if(!ds) return "";
                const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
                const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
                let d;
                const ddmmyyyy = ds.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
                if (ddmmyyyy) d = new Date(ddmmyyyy[3], ddmmyyyy[2]-1, ddmmyyyy[1]);
                else if (/^\d{4}-\d{2}-\d{2}$/.test(ds)) {
                    const parts = ds.split('-'); d = new Date(parts[0], parts[1]-1, parts[2]);
                } else return ds;
                return days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
            }

            function formatTimeId(ts, zone) {
                if(!ts) return "";
                if(/^\d{2}:\d{2}$/.test(ts)) return ts.replace(':', '.') + (zone ? ' ' + zone : ' WIB');
                return ts;
            }

            if (!data) return;

            // Global Texts
            if (data.headerLabel) document.querySelectorAll('.header-label-text').forEach(el => el.innerText = data.headerLabel);
            if (data.hashtag) document.querySelectorAll('.hashtag-text').forEach(el => el.innerText = data.hashtag);
            if (data.greeting) document.querySelectorAll('.greeting-text').forEach(el => el.innerText = data.greeting);
            
            // Set Guest Name
            const guestDisplay = document.getElementById('guest-name-display');
            if (guestDisplay) guestDisplay.innerText = guestName;

            // Cover & Hero
            if (data.coverBg) document.querySelectorAll('#cover img').forEach(el => el.src = data.coverBg);
            if (data.heroImg) document.querySelectorAll('.hero-image').forEach(el => el.src = data.heroImg);

            // Names
            if (data.groom && data.bride) {
                const gFirst = data.groom.name ? data.groom.name.split(" ")[0] : "Pria";
                const bFirst = data.bride.name ? data.bride.name.split(" ")[0] : "Wanita";
                document.querySelectorAll('.wedding-names-text').forEach(el => el.innerHTML = gFirst + " <br>& " + bFirst);
                document.getElementById('page-title').innerText = `Undangan: ${gFirst} & ${bFirst}`;
            }

            // Mempelai Pria
            if (data.groom) {
                const gSec = document.getElementById('groom-section');
                if (gSec) gSec.style.display = (data.show_groom === "false") ? 'none' : 'block';
                if (data.groom.header) document.querySelectorAll('.groom-header-text').forEach(el => el.innerText = data.groom.header);
                document.querySelectorAll('.groom-name-text').forEach(el => el.innerText = data.groom.name);
                document.querySelectorAll('.groom-desc-text').forEach(el => el.innerHTML = data.groom.desc ? data.groom.desc.replace(/\n/g, '<br>') : "");
                if (data.groom.photo) document.querySelectorAll('.groom-photo-img').forEach(el => el.src = data.groom.photo);
            }

            // Mempelai Wanita
            if (data.bride) {
                const bSec = document.getElementById('bride-section');
                if (bSec) bSec.style.display = (data.show_bride === "false") ? 'none' : 'block';
                if (data.bride.header) document.querySelectorAll('.bride-header-text').forEach(el => el.innerText = data.bride.header);
                document.querySelectorAll('.bride-name-text').forEach(el => el.innerText = data.bride.name);
                document.querySelectorAll('.bride-desc-text').forEach(el => el.innerHTML = data.bride.desc ? data.bride.desc.replace(/\n/g, '<br>') : "");
                if (data.bride.photo) document.querySelectorAll('.bride-photo-img').forEach(el => el.src = data.bride.photo);
            }

            // Events
            const eSec = document.getElementById('events-section');
            if (eSec) eSec.style.display = (data.show_events === "false") ? 'none' : 'block';
            if (data.events_header) document.querySelectorAll('.events-header-text').forEach(el => el.innerText = data.events_header);

            if (data.ev1) {
                document.querySelectorAll('.ev1-name-text').forEach(el => el.innerText = data.ev1.name);
                document.querySelectorAll('.ev1-date-text').forEach(el => el.innerText = formatDateId(data.ev1.date));
                document.querySelectorAll('.ev1-time-text').forEach(el => el.innerText = formatTimeId(data.ev1.time, data.ev1.zone));
                document.querySelectorAll('.ev1-loc-text').forEach(el => el.innerHTML = data.ev1.locName ? data.ev1.locName.replace(/\n/g, '<br>') : "");
                if (data.ev1.photo) document.querySelectorAll('.ev1-photo-img').forEach(el => el.src = data.ev1.photo);
                if (data.ev1.maps) document.querySelectorAll('.ev1-maps-btn').forEach(el => el.href = data.ev1.maps);
                
                // Set Countdown
                let isoDate = data.ev1.date;
                const ddmm = data.ev1.date.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
                if (ddmm) isoDate = ddmm[3] + '-' + ddmm[2] + '-' + ddmm[1];
                let t = data.ev1.time && /^\d{2}:\d{2}$/.test(data.ev1.time) ? data.ev1.time : "08:00";
                window.ACTIVE_COUNTDOWN = isoDate + 'T' + t + ':00';
            }

            if (data.ev2) {
                document.querySelectorAll('.ev2-name-text').forEach(el => el.innerText = data.ev2.name);
                document.querySelectorAll('.ev2-date-text').forEach(el => el.innerText = formatDateId(data.ev2.date));
                document.querySelectorAll('.ev2-time-text').forEach(el => el.innerText = formatTimeId(data.ev2.time, data.ev2.zone));
                document.querySelectorAll('.ev2-loc-text').forEach(el => el.innerHTML = data.ev2.locName ? data.ev2.locName.replace(/\n/g, '<br>') : "");
                if (data.ev2.photo) document.querySelectorAll('.ev2-photo-img').forEach(el => el.src = data.ev2.photo);
                if (data.ev2.maps) document.querySelectorAll('.ev2-maps-btn').forEach(el => el.href = data.ev2.maps);
            }

            // Gifts
            const gfSec = document.getElementById('gift-section');
            if (gfSec) gfSec.style.display = (data.show_gift === "false") ? 'none' : 'block';
            if (data.gift_header) document.querySelectorAll('.gift-header-text').forEach(el => el.innerText = data.gift_header);
            if (data.gifts) {
                if (data.gifts[0]) {
                    document.querySelectorAll('.gift1-acc-text').forEach(el => el.innerText = data.gifts[0].acc);
                    document.querySelectorAll('.gift1-owner-text').forEach(el => el.innerText = "A/n: " + data.gifts[0].owner);
                }
                if (data.gifts[1]) {
                    document.querySelectorAll('.gift2-acc-text').forEach(el => el.innerText = data.gifts[1].acc);
                    document.querySelectorAll('.gift2-owner-text').forEach(el => el.innerText = "A/n: " + data.gifts[1].owner);
                }
                if (data.gifts[2]) {
                    document.querySelectorAll('.gift3-acc-text').forEach(el => el.innerText = data.gifts[2].acc);
                    document.querySelectorAll('.gift3-owner-text').forEach(el => el.innerText = "A/n: " + data.gifts[2].owner);
                }
            }

            // Gallery
            const galSec = document.getElementById('gallery-section');
            if (galSec) galSec.style.display = (data.show_gallery === "false") ? 'none' : 'block';
            if (data.gallery_header) document.querySelectorAll('.gallery-header-text').forEach(el => el.innerText = data.gallery_header);
            if (data.gallery) {
                const galleryImgs = document.querySelectorAll('.carousel-card img');
                data.gallery.forEach((url, i) => {
                    if (url && galleryImgs[i]) galleryImgs[i].src = url;
                    if (url && galleryImgs[i + 6]) galleryImgs[i + 6].src = url;
                });
            }

            // Wishes
            const wSec = document.getElementById('wishes-section');
            if (wSec) wSec.style.display = (data.show_wishes === "false") ? 'none' : 'block';
            if (data.wishes_header) document.querySelectorAll('.wishes-header-text').forEach(el => el.innerText = data.wishes_header);

            // Music
            if (data.musicUrl) setMusicSource(data.musicUrl);

            // Sembunyikan Loader
            const loader = document.getElementById('shell-loader');
            if(loader) {
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 1000);
            }
        };

        // ─── 5. GLOBAL UI FUNCTIONS ───
        function initializeScripts() {
            // Set QR
            const qr = document.getElementById('qr-code');
            if(qr) qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${guestId}`;
            const gIdLbl = document.getElementById('guest-id-label');
            if(gIdLbl) gIdLbl.innerText = `ID: ${guestId}`;

            // Name in Wish
            const wName = document.getElementById('wish-name');
            if(wName) wName.value = guestName !== "Tamu Undangan" ? guestName : "";

            // Init Countdown
            setInterval(updateCountdown, 1000);
            
            // Init Intersection Observer untuk Animasi
            const obs = new IntersectionObserver((entries) => {
                entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('active'); });
            }, { threshold: 0.1 });
            document.querySelectorAll('.reveal, .reveal-left, .reveal-right').forEach(el => obs.observe(el));

            loadWishes();
        }

        window.startInvitation = function () {
            const audio = document.getElementById('main-audio');
            if (audio && audio.src) {
                audio.play().then(() => {
                    window.isPlaying = true;
                    updateMusicUI();
                }).catch(e => console.warn(e));
            }

            document.getElementById('cover').style.transform = 'translateY(-100%)';
            document.getElementById('cover').style.pointerEvents = 'none';
            const content = document.getElementById('content');
            if(content) {
                content.classList.remove('hidden');
                setTimeout(() => {
                    content.style.opacity = '1';
                    document.getElementById('music-btn').classList.remove('hidden');
                    setTimeout(() => document.getElementById('music-btn').style.opacity = '1', 100);
                    const ht = document.getElementById('hero-target');
                    if(ht) ht.scrollIntoView({ behavior: 'smooth' });
                }, 600);
            }
        };

        window.isPlaying = false;
        window.toggleMusic = function () {
            const audio = document.getElementById('main-audio');
            if (!audio) return;
            if (window.isPlaying) {
                audio.pause(); window.isPlaying = false; updateMusicUI();
            } else {
                audio.play().then(() => { window.isPlaying = true; updateMusicUI(); }).catch(e => console.warn(e));
            }
        };

        function updateMusicUI() {
            const visualizer = document.getElementById('visualizer');
            if (visualizer) window.isPlaying ? visualizer.classList.remove('paused') : visualizer.classList.add('paused');
            const musicTxt = document.getElementById('music-txt');
            if (musicTxt) musicTxt.innerText = window.isPlaying ? "PAUSE" : "PLAY";
        }

        function setMusicSource(url) {
            const audio = document.getElementById('main-audio');
            if (!url || !audio) return;
            audio.src = url;
            audio.load();
        }

        function updateCountdown() {
            const rawCountdown = window.ACTIVE_COUNTDOWN || "May 25, 2026 08:00:00";
            const weddingDate = new Date(rawCountdown).getTime();
            const gap = weddingDate - new Date().getTime();
            if (gap > 0) {
                const d = Math.floor(gap / (1000 * 60 * 60 * 24));
                const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((gap % (1000 * 60)) / 1000);
                if(document.getElementById("days")) document.getElementById("days").innerText = d.toString().padStart(2, '0');
                if(document.getElementById("hours")) document.getElementById("hours").innerText = h.toString().padStart(2, '0');
                if(document.getElementById("mins")) document.getElementById("mins").innerText = m.toString().padStart(2, '0');
                if(document.getElementById("secs")) document.getElementById("secs").innerText = s.toString().padStart(2, '0');
            }
        }

        window.copyToClipboard = function(text) {
            navigator.clipboard.writeText(text).then(() => alert("Disalin: " + text));
        }

        window.loadWishes = async function () {
            const ssId = window.CURRENT_SS_ID || urlParams.get('ssId');
            if (!ssId) return;
            try {
                const res = await fetch(`${window.SCRIPT_URL}?action=getWishes&ssId=${ssId}`);
                const result = await res.json();
                if (result.status === "success" && Array.isArray(result.data)) {
                     const container = document.getElementById('wishes-container');
                     if (!container) return;
                     container.innerHTML = ''; 
                     result.data.forEach(wish => {
                         const div = document.createElement('div');
                         div.className = "wish-card";
                         div.innerHTML = `<p class="text-[11px] font-bold text-neutral-800 mb-1">${wish.name || 'Tamu'}</p>
                             <p class="text-[10px] text-neutral-500">${wish.text}</p>`;
                         container.appendChild(div);
                     });
                }
            } catch(e) { console.error(e); }
        };

        window.sendWish = async function () {
            const name = document.getElementById('wish-name').value;
            const text = document.getElementById('wish-text').value;
            const btn = document.getElementById('btn-wish');
            if (!name || !text || !btn) return;

            const ssId = window.CURRENT_SS_ID || urlParams.get('ssId');
            btn.disabled = true; btn.innerText = "Mengirim...";

            try {
                const res = await fetch(window.SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "addWish", ssId: ssId, name: name, text: text })
                });
                const result = await res.json();
                if(result.status === "success") {
                    document.getElementById('wish-text').value = "";
                    btn.innerText = "Terkirim!";
                    window.loadWishes(); 
                } else throw new Error();
            } catch (e) {
                btn.innerText = "Gagal";
            }
            setTimeout(() => { btn.innerText = "Kirim Ucapan"; btn.disabled = false; }, 2000);
        };

        // Mulai eksekusi saat dom siap
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadDynamicConfig, 500);
        });
    </script>
</body>
</html>
