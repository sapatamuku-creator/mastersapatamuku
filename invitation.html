<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#C8962E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Undangan Pernikahan Digital — SapaTamu.Ku</title>
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="SapaTamu.Ku">
    <meta property="og:title" content="Undangan Pernikahan Digital">
    <meta property="og:description" content="Anda diundang untuk menghadiri acara pernikahan. Buka undangan untuk melihat detail acaranya.">
    <meta property="og:image" content="https://sapatamu.id/assets/og-invitation.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://sapatamu.id/assets/og-invitation.png">
    <script src="subdomain_resolver.js?v=3.3"></script>
    <script src="https://cdn.tailwindcss.com" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Alice&family=Montserrat:wght@200;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="rsvp_embed.css">
    
    <!-- Dynamic CSS will be injected here -->
    <style id="dynamic-style"></style>

    <style>
        /* Global Shell Styles (Loader) */
        #shell-loader {
            position: fixed; inset: 0; z-index: 99999;
            background: #ffffff; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            transition: opacity 1s ease;
        }
        .shell-spinner {
            width: 50px; height: 50px; border: 3px solid #f3f3f3;
            border-top: 3px solid #1a1a1a; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Cegah horizontal scroll dari animasi zig-zag (token translateX melebihi layar) */
        html, body { overflow-x: hidden; }
        #template-wrapper { overflow-x: clip; }
    </style>
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body id="dynamic-body">
    <!-- Shell Loader -->
    <div id="shell-loader">
        <div class="shell-spinner"></div>
        <p class="text-xs font-bold text-neutral-400 tracking-widest uppercase">Mempersiapkan Undangan</p>
    </div>

    <!-- Watchdog: pastikan loader tidak pernah tampil selamanya walau resource terblokir -->
    <script>
        setTimeout(function () {
            var loader = document.getElementById('shell-loader');
            if (loader) {
                loader.style.opacity = '0';
                setTimeout(function () {
                    if (loader.parentNode) loader.parentNode.removeChild(loader);
                }, 500);
            }
        }, 8000);
    </script>

    <!-- Music Player (Global) -->
    <div id="music-btn" class="fixed z-[110] bottom-8 right-8 hidden opacity-0 transition-all duration-500">
        <button onclick="toggleMusic()" class="w-14 h-14 bg-white border shadow-2xl rounded-full flex flex-col items-center justify-center gap-1">
            <div id="visualizer" class="music-bars paused">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <p id="music-txt" class="text-[7px] font-bold uppercase tracking-tighter text-neutral-400">PLAY</p>
        </button>
    </div>
    <audio id="main-audio" loop preload="auto"></audio>

    <!-- Global Logic Script -->
    <script src="config.js"></script>
    <script>
        // ─── 1. CORE VARIABLES & SETUP ───
        const urlParams = new URLSearchParams(window.location.search);
        let guestName = urlParams.get('u');
        let guestId = urlParams.get('id');

        // Path fallback (/u/ID/NAMA)
        if (!guestName || !guestId) {
            const pathParts = window.location.pathname.split('/');
            const uIdx = pathParts.indexOf('u');
            if (uIdx !== -1 && pathParts[uIdx + 1]) {
                guestId = pathParts[uIdx + 1];
                guestName = pathParts[uIdx + 2];
            }
        }
        if (guestName) guestName = decodeURIComponent(guestName.replace(/\+/g, ' '));
        else guestName = "Tamu Undangan";
        if (!guestId) guestId = "STK-" + Math.random().toString(36).substr(2, 6).toUpperCase();

        const SB_URL = "https://llrapesaaoliyjrrrsjh.supabase.co";
        const SB_KEY = "sb_publishable_414hQDyPBaFi0fnzmIKyZw_Iwa09Q0u";

        // ─── 2. DYNAMIC FETCHER ENGINE ───
        async function fetchTemplateEngine(rawThemeId) {
            try {
                // Validate theme_id parameter (alphanumeric and hyphens only)
                let themeId = (rawThemeId || 'standard_clean_minimalis_1').toLowerCase().replace(/[^a-z0-9_-]/g, '');
                if (themeId === 'classic' || themeId === 'default' || !themeId) {
                    themeId = 'standard_clean_minimalis_1';
                }
                
                // Fetch Layout HTML with fallback to standard_clean_minimalis_1 if 404
                let htmlRes = await fetch(`/assets/templates/${themeId}/layout.html`);
                if (!htmlRes.ok && themeId !== 'standard_clean_minimalis_1') {
                    console.warn(`Template HTML [${themeId}] tidak ditemukan, fallback ke standard_clean_minimalis_1`);
                    themeId = 'standard_clean_minimalis_1';
                    htmlRes = await fetch(`/assets/templates/${themeId}/layout.html`);
                }
                if (!htmlRes.ok) throw new Error("Template HTML tidak ditemukan.");
                const htmlText = await htmlRes.text();
                
                // Fetch CSS
                const cssRes = await fetch(`/assets/templates/${themeId}/style.css`);
                if (cssRes.ok) {
                    const cssText = await cssRes.text();
                    document.getElementById('dynamic-style').innerHTML = cssText;
                }

                // Inject Layout (append ke body, hindari hapus audio & loader)
                let templateWrapper = document.getElementById('template-wrapper');
                if (!templateWrapper) {
                    templateWrapper = document.createElement('div');
                    templateWrapper.id = "template-wrapper";
                    document.getElementById('dynamic-body').appendChild(templateWrapper);
                }
                templateWrapper.innerHTML = htmlText;
                if (window.tailwind && typeof window.tailwind.refresh === 'function') {
                    try { window.tailwind.refresh(); } catch(e) {}
                }

                console.log(`✅ Template [${themeId}] loaded successfully.`);
                return true;
            } catch (e) {
                console.error("Gagal meload template:", e);
                document.getElementById('shell-loader').innerHTML = `<p class="text-red-500 font-bold p-4 text-center">Gagal memuat template</p>`;
                return false;
            }
        }

        let _resolveRetries = 0;
        async function loadDynamicConfig() {
            if (!window.SAPATAMU_RESOLVED && _resolveRetries < 20) {
                _resolveRetries++;
                setTimeout(loadDynamicConfig, 100);
                return;
            }
            const ssId = window.CURRENT_SS_ID || urlParams.get('ssId');

            try {
                // 1. Dapatkan JSON Konfigurasi dari Supabase
                if (ssId) {
                    const sbRes = await fetch(
                        `${SB_URL}/rest/v1/config_invitation?ssid=eq.${ssId}&select=data&limit=1`,
                        { headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY } }
                    );
                    
                    if (sbRes.ok) {
                        const rows = await sbRes.json();
                        if (rows && rows.length > 0 && rows[0].data) {
                            const invData = rows[0].data;
                            let themeId = (urlParams.get('theme_id') || invData.theme || "standard_clean_minimalis_1").toLowerCase();

                            // 2. Fetch Cangkang Template
                            const isLoaded = await fetchTemplateEngine(themeId);
                            
                            // 3. Render Data ke Template
                            if(isLoaded) {
                                window.applyLivePreview(invData);
                                initializeScripts(); // Countdown, dll
                            }
                            return;
                        }
                    }
                }
            } catch (e) {
                console.error("Supabase load failed", e);
            }

            // 2. Fallback jika Supabase kosong / gagal: Ambil dari GAS (Google Sheet)
            if (ssId) {
                try {
                    console.log("[Fallback] Supabase kosong, mencoba mengambil dari GAS...");
                    const gasUrl = `${window.SCRIPT_URL}?action=getSettings&ssId=${ssId}`;
                    const gasRes = await fetch(gasUrl);
                    if (gasRes.ok) {
                        const gasResult = await gasRes.json();
                        if (gasResult && gasResult.status === "success" && gasResult.data && gasResult.data.invitationData) {
                            const invData = gasResult.data.invitationData;
                            let themeId = (urlParams.get('theme_id') || invData.theme || "standard_clean_minimalis_1").toLowerCase();
                            
                            const isLoaded = await fetchTemplateEngine(themeId);
                            if (isLoaded) {
                                window.applyLivePreview(invData);
                                initializeScripts();
                            }
                            return;
                        }
                    }
                } catch (gasErr) {
                    console.error("GAS fallback load failed", gasErr);
                }
            }

            // 3. Fallback jika belum ada data diset di DB (misal baru buka halaman config / preview)
            let themeId = (urlParams.get('theme_id') || "standard_clean_minimalis_1").toLowerCase();
            const isLoaded = await fetchTemplateEngine(themeId);
            if (isLoaded) {
                const loader = document.getElementById('shell-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
                initializeScripts();
                
                // Request parent to update preview data immediately with current input values
                if (window.parent && typeof window.parent.updatePreview === 'function') {
                    window.parent.updatePreview();
                }
            }
        }

        // ─── 4. MAPPER / RENDERER SCRIPT (The Engine) ───
        // Logo bank resmi (URL terverifikasi). Bank/e-wallet lain otomatis memakai monogram.
        const BANK_LOGOS = {
            "BCA": "https://upload.wikimedia.org/wikipedia/commons/e/e0/BCA_logo.svg",
            "BRI": "https://upload.wikimedia.org/wikipedia/commons/2/2e/BRI_2020.svg",
            "BJB": "https://ridergalau.id/wp-content/uploads/2026/01/Logo-Bank-BJB.png",
            "MANDIRI": "https://upload.wikimedia.org/wikipedia/commons/a/ad/Bank_Mandiri_logo_2016.svg",
            "BNI": "/assets/bank-logos/bni.png",
            "BTN": "https://upload.wikimedia.org/wikipedia/commons/f/fd/Bank_BTN_logo.svg",
            "PERMATA": "https://upload.wikimedia.org/wikipedia/commons/f/ff/Permata_Bank_%282024%29.svg",
            "SEABANK": "https://upload.wikimedia.org/wikipedia/commons/a/ac/SeaBank.svg",
            "DANA": "https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Logo_dana_blue.svg/1280px-Logo_dana_blue.svg.png"
        };
        const EWALLET_KEYS = ["DANA", "GOPAY", "OVO", "SHOPEEPAY", "LINKAJA", "LINK AJA", "PAYPAL"];

        window.getBankLogo = function (bank) {
            if (!bank) return "";
            const key = String(bank).toUpperCase().replace(/[^A-Z0-9]/g, "");
            return BANK_LOGOS[key] || "";
        };

        window.bankMonogram = function (bank) {
            if (!bank) return "GFT";
            const words = String(bank).trim().split(/\s+/).filter(Boolean);
            return words.length > 1
                ? (words[0][0] + words[1][0]).toUpperCase()
                : words[0].slice(0, 2).toUpperCase();
        };

        // Jika gambar logo gagal dimuat, ganti dengan monogram bank
        window.fallbackGiftLogo = function (el, bank) {
            const mono = document.createElement('div');
            mono.className = "w-14 h-14 mx-auto mb-6 rounded-full bg-neutral-900 text-white flex items-center justify-center text-sm font-bold tracking-widest";
            mono.textContent = bankMonogram(bank);
            if (el && el.parentNode) el.parentNode.replaceChild(mono, el);
        };

        function escAttr(s) {
            return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
        }

        window.renderGifts = function (gifts) {
            const container = document.getElementById('gifts-container');
            if (!container || !Array.isArray(gifts)) return false;
            const valid = gifts.filter(g => g && g.acc);
            if (valid.length === 0) {
                container.innerHTML = '';
                return true;
            }
            container.innerHTML = valid.map(g => {
                const bank = (g.bank || "").trim();
                const key = bank.toUpperCase().replace(/[^A-Z0-9]/g, "");
                const logoUrl = getBankLogo(bank);
                const logoHtml = logoUrl
                    ? `<img src="${escAttr(logoUrl)}" class="h-8 mx-auto mb-6 object-contain grayscale opacity-80" alt="${escAttr(bank)}" onerror="window.fallbackGiftLogo(this, '${escAttr(bank)}')">`
                    : `<div class="w-14 h-14 mx-auto mb-6 rounded-full bg-neutral-900 text-white flex items-center justify-center text-sm font-bold tracking-widest">${escAttr(bankMonogram(bank))}</div>`;
                const btnLabel = EWALLET_KEYS.includes(key) ? "Salin No. HP" : "Salin No. Rekening";
                return `<div class="gift-card bg-white rounded-2xl shadow-sm border border-neutral-100 p-8">
                    ${logoHtml}
                    <p class="gift-acc-text text-lg font-serif text-neutral-800 mb-1">${escAttr(g.acc)}</p>
                    <p class="gift-owner-text text-[9px] uppercase tracking-widest text-neutral-400 mb-6">A/n: ${escAttr(g.owner || "")}</p>
                    <button onclick="copyToClipboard('${escAttr(g.acc)}')" class="px-8 py-3 border border-neutral-200 rounded-full text-[8px] uppercase tracking-widest font-bold text-neutral-400 hover:bg-neutral-50 transition-colors">${btnLabel}</button>
                </div>`;
            }).join('');
            return true;
        };

        // ─── RSVP EMBED: Konfirmasi Kehadiran + Selfie Check-In (di-port dari rsvp.html) ───
        let attendanceStatus = "";
        let rsvpPaxCount = 1;
        let selfieStream = null;
        let capturedSelfieBase64 = null;
        let selfieValidated = false;

        window.initRsvpEmbed = function () {
            const container = document.getElementById('rsvp-embed');
            if (!container || container.dataset.ready) return;
            const ssId = window.CURRENT_SS_ID || urlParams.get('ssId');
            if (!ssId) { container.style.display = 'none'; return; }
            container.dataset.ready = "1";

            container.innerHTML = `
                <div class="rsvp-card">
                    <div class="header-logo">
                        <div class="monogram">RSVP</div>
                        <div class="wedding-subtitle">Konfirmasi Kehadiran</div>
                    </div>

                    <div id="formContent">
                        <div class="wedding-info">
                            <h2 class="wedding-title" id="weddingTitle">Menghubungkan...</h2>
                            <p class="wedding-detail">
                                <span id="weddingDate">--</span><br>
                                <span id="weddingTime">--</span><br>
                                <span id="weddingVenue">--</span>
                            </p>
                        </div>

                        <form class="rsvp-form" id="rsvpForm" onsubmit="submitRsvp(event)">
                            <div>
                                <p class="greeting" id="guestGreeting">Kepada Yth. Bapak/Ibu/Saudara/i,</p>
                            </div>

                            <div>
                                <span class="form-label">Apakah Anda Akan Hadir?</span>
                                <div class="attendance-options">
                                    <label class="option-card" id="optHadir" onclick="selectAttendance('hadir')">
                                        <span class="option-icon">🥂</span>
                                        <span class="option-title">Bisa Hadir</span>
                                        <input type="radio" name="attendance" value="hadir" required>
                                    </label>
                                    <label class="option-card" id="optAbsen" onclick="selectAttendance('absen')">
                                        <span class="option-icon">✉️</span>
                                        <span class="option-title">Tidak Hadir</span>
                                        <input type="radio" name="attendance" value="absen" required>
                                    </label>
                                </div>
                            </div>

                            <div class="pax-container" id="paxContainer">
                                <span class="form-label">Jumlah Anggota yang Hadir</span>
                                <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 12px;">Termasuk Anda sendiri.</p>
                                <div class="counter-wrapper">
                                    <button type="button" class="counter-btn" onclick="adjustPax(-1)">-</button>
                                    <span class="counter-value" id="paxValue">1</span>
                                    <button type="button" class="counter-btn" onclick="adjustPax(1)">+</button>
                                </div>
                            </div>

                            <div class="input-group">
                                <label class="form-label" for="wishesText">Ucapan &amp; Doa Restu</label>
                                <textarea class="textarea-input" id="wishesText" placeholder="Tulis ucapan selamat dan harapan terbaik Anda untuk mempelai..." required></textarea>
                            </div>

                            <div class="selfie-section" id="selfieSection">
                                <label class="form-label">📸 Selfie Check-In &mdash; Jalur Cepat</label>
                                <p style="font-size: 10px; color: var(--text-muted); margin-bottom: 12px; text-align: center; line-height: 1.6;">
                                    Daftarkan wajah Anda sekarang &amp; nikmati <strong style="color: var(--gold);">check-in kilat</strong> tanpa antre di hari H. ✨
                                </p>
                                <div class="selfie-container" id="selfieContainer">
                                    <video id="selfieVideo" autoplay playsinline muted></video>
                                    <canvas id="selfieCanvas"></canvas>
                                    <img id="selfiePreview" alt="Selfie preview">
                                    <div class="selfie-overlay" id="selfieOverlay">
                                        <span id="selfieCountdown">3</span>
                                    </div>
                                </div>
                                <button type="button" class="selfie-btn" id="btnSelfie" onclick="toggleSelfie()">📸 Aktifkan Selfie Check-In</button>
                                <div class="selfie-hint" id="selfieHint">Pastikan wajah Anda terlihat jelas &amp; pencahayaan cukup</div>
                                <div class="selfie-status" id="selfieStatus"></div>
                            </div>

                            <button type="submit" class="submit-btn" id="btnSubmit" disabled>
                                <span>Kirim Konfirmasi</span>
                                <div class="btn-spinner" id="btnSpinner"></div>
                            </button>
                            <p style="font-size: 10px; color: var(--text-muted); text-align: center; margin-top: -15px;" id="submitHint">Pilih status kehadiran terlebih dahulu</p>
                        </form>
                    </div>

                    <div class="success-view" id="successView">
                        <div class="success-icon">✓</div>
                        <h3 class="success-title">Terima Kasih!</h3>
                        <p class="success-message" id="successMsg">Konfirmasi kehadiran dan ucapan Anda telah berhasil disimpan di sistem kami.</p>
                        <button type="button" class="submit-btn" style="background: transparent; border: 1.5px solid var(--primary); color: var(--primary);" onclick="resetForm()">
                            <span>Ubah Konfirmasi</span>
                        </button>
                    </div>
                </div>

                <div class="toast" id="toast">
                    <span id="toastIcon">⚠️</span>
                    <span id="toastText">Pesan di sini</span>
                </div>

                <div id="cameraPermModal" role="dialog" aria-modal="true" aria-labelledby="camPermTitle">
                    <div class="cam-perm-box">
                        <div class="cam-perm-icon">🚀</div>
                        <h2 class="cam-perm-title" id="camPermTitle">Aktifkan Jalur Cepat</h2>
                        <p class="cam-perm-desc">
                            <strong>Selfie Check-In</strong> &mdash; daftarkan wajah Anda sekali,
                            masuk tanpa antre selamanya.
                        </p>
                        <div class="cam-perm-note">
                            📲 <strong>Bagaimana caranya?</strong><br>
                            Panitia menggunakan foto Anda untuk <strong>mengenali kehadiran secara instan</strong>
                            di hari-H &mdash; tanpa perlu tunjukkan undangan, tanpa antre panjang. Cukup datang,
                            senyum, dan langsung masuk! 🎊
                        </div>
                        <div class="cam-perm-actions">
                            <button class="cam-perm-btn-allow" id="btnAllowCamera" onclick="grantCameraAccess()">📸 Aktifkan Selfie Check-In</button>
                            <button class="cam-perm-btn-skip" onclick="skipSelfie()">Lewati &mdash; check-in manual saja</button>
                        </div>
                    </div>
                </div>
            `;

            // Isi info acara (dari data undangan yang sudah dimuat)
            const inv = window.RSVP_INV_DATA || {};
            const gName = (inv.groom && inv.groom.name) || "";
            const bName = (inv.bride && inv.bride.name) || "";
            const titleEl = document.getElementById('weddingTitle');
            if (titleEl) {
                if (gName || bName) {
                    let html = '';
                    if (gName) html += `<span class="ws-name ws-groom">${escAttr(gName)}</span>`;
                    if (gName && bName) html += `<span class="ws-amp">&amp;</span>`;
                    if (bName) html += `<span class="ws-name ws-bride">${escAttr(bName)}</span>`;
                    titleEl.innerHTML = html;
                } else {
                    titleEl.innerText = "Acara Pernikahan";
                }
            }
            const ev1 = inv.ev1 || {};
            if (document.getElementById('weddingDate')) document.getElementById('weddingDate').innerText = ev1.date || "-";
            if (document.getElementById('weddingTime')) document.getElementById('weddingTime').innerText = ev1.time ? (ev1.time + (ev1.zone ? ' ' + ev1.zone : ' WIB')) : "-";
            if (document.getElementById('weddingVenue')) document.getElementById('weddingVenue').innerText = String(ev1.locName || "").replace(/\n/g, '<br>');

            const greetingEl = document.getElementById('guestGreeting');
            if (greetingEl) {
                if (guestName && guestName !== "Tamu Undangan") {
                    greetingEl.innerHTML = `Kepada Yth.<br><strong>${escAttr(guestName)}</strong>`;
                } else {
                    greetingEl.innerHTML = "Kepada Yth. Bapak/Ibu/Saudara/i,";
                }
            }
        };

        window.selectAttendance = function (type) {
            attendanceStatus = type;
            const optHadir = document.getElementById("optHadir");
            const optAbsen = document.getElementById("optAbsen");
            const paxContainer = document.getElementById("paxContainer");
            const selfieSection = document.getElementById("selfieSection");
            const btnSubmit = document.getElementById("btnSubmit");
            const submitHint = document.getElementById("submitHint");

            if (type === 'hadir') {
                optHadir.classList.add("selected");
                optAbsen.classList.remove("selected");
                paxContainer.style.display = "block";
                const radio = document.querySelector('#rsvp-embed input[value="hadir"]');
                if (radio) radio.checked = true;
                btnSubmit.disabled = true;
                submitHint.textContent = "Ambil selfie terlebih dahulu";
                selfieSection.classList.add("show");
                handleSelfiePermission();
            } else {
                optAbsen.classList.add("selected");
                optHadir.classList.remove("selected");
                paxContainer.style.display = "none";
                selfieSection.classList.remove("show");
                const radio = document.querySelector('#rsvp-embed input[value="absen"]');
                if (radio) radio.checked = true;
                btnSubmit.disabled = false;
                submitHint.textContent = "";
                stopSelfieCamera();
            }
        };

        window.adjustPax = function (amount) {
            rsvpPaxCount += amount;
            if (rsvpPaxCount < 1) rsvpPaxCount = 1;
            if (rsvpPaxCount > 10) rsvpPaxCount = 10;
            const el = document.getElementById("paxValue");
            if (el) el.innerText = rsvpPaxCount;
        };

        window.showToast = function (message, type = "info") {
            const toast = document.getElementById("toast");
            const toastIcon = document.getElementById("toastIcon");
            const toastText = document.getElementById("toastText");
            if (!toast || !toastIcon || !toastText) return;
            toastText.innerText = message;
            const iconMap = { success: "✅", error: "❌", warning: "⚠️", info: "ℹ️" };
            toastIcon.innerText = iconMap[type] || "ℹ️";

        async function takeSelfieWithCountdown() {
            const video = document.getElementById("selfieVideo");
            const overlay = document.getElementById("selfieOverlay");
            const countdownEl = document.getElementById("selfieCountdown");
            const btn = document.getElementById("btnSelfie");
            btn.disabled = true;
            btn.textContent = "MENYIAPKAN...";
            overlay.classList.add("show");
            let count = 3;
            countdownEl.textContent = count;
            const timer = setInterval(() => {
                count--;
                if (count > 0) { countdownEl.textContent = count; }
                else if (count === 0) { countdownEl.textContent = "📸"; }

            }, 800);

        function captureSelfie() {
            const video = document.getElementById("selfieVideo");
            const canvas = document.getElementById("selfieCanvas");
            const preview = document.getElementById("selfiePreview");
            const btn = document.getElementById("btnSelfie");
            const status = document.getElementById("selfieStatus");
            const hint = document.getElementById("selfieHint");

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext("2d");
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            capturedSelfieBase64 = canvas.toDataURL("image/jpeg", 0.8);
            stopSelfieCamera();

            video.style.display = "none";
            preview.src = capturedSelfieBase64;
            preview.style.display = "block";

            validateSelfie(canvas, status, hint);

            btn.textContent = "🔄 Ulangi Selfie";
            btn.classList.add("retry");
            btn.disabled = false;
        }
        function validateSelfie(canvas, status, hint) {
            const ctx = canvas.getContext("2d");
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            let totalBrightness = 0;
            for (let i = 0; i < data.length; i += 4) {
                totalBrightness += (data[i] + data[i + 1] + data[i + 2]) / 3;
            }
            const avgBrightness = totalBrightness / (data.length / 4);

            let laplacianSum = 0;
            let laplacianCount = 0;
            const width = canvas.width;
            const height = canvas.height;
            const grayscale = new Uint8Array(width * height);
            for (let i = 0; i < data.length; i += 4) {
                grayscale[i / 4] = (data[i] + data[i + 1] + data[i + 2]) / 3;
            }
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = y * width + x;
                    const laplacian = -4 * grayscale[idx] + grayscale[idx - 1] + grayscale[idx + 1] + grayscale[idx - width] + grayscale[idx + width];
                    laplacianSum += laplacian * laplacian;
                    laplacianCount++;
                }
            }
            const laplacianVariance = laplacianSum / laplacianCount;

            let skinPixels = 0;
            const centerX = width / 2;
            const centerY = height / 2;
            const checkRadius = Math.min(width, height) * 0.25;
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    const r = data[idx], g = data[idx + 1], b = data[idx + 2];
                    const dist = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);
                    if (dist > checkRadius) continue;
                    const max = Math.max(r, g, b);
                    const min = Math.min(r, g, b);
                    const s = max === 0 ? 0 : (max - min) / max;
                    const v = max / 255;
                    if (r > 95 && g > 40 && b > 20 && r > g && r > b && max - min > 15 && s > 0.1 && s < 0.7 && v > 0.3) skinPixels++;
                }
            }
            const skinRatio = skinPixels / (checkRadius * checkRadius * Math.PI);

            let isValid = true;
            let messages = [];
            if (avgBrightness < 50) { isValid = false; messages.push("Terlalu gelap"); }
            else if (avgBrightness > 220) { isValid = false; messages.push("Terlalu terang"); }
            if (laplacianVariance < 100) { isValid = false; messages.push("Foto blur"); }
            if (skinRatio < 0.05) { isValid = false; messages.push("Wajah tidak terdeteksi"); }

            selfieValidated = isValid;
            if (isValid) {
                status.textContent = "✅ Foto valid";
                status.className = "selfie-status success";
                hint.textContent = "Foto siap dikirim";
            } else {
                status.textContent = "⚠️ " + messages.join(", ");
                status.className = "selfie-status error";
                hint.textContent = "Ambil ulang dengan pencahayaan yang lebih baik";
            }
            updateSubmitButton();
        }

                if(!ds || typeof ds !== 'string') return "";
                const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
                const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
                let d;
                const ddmmyyyy = ds.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
                if (ddmmyyyy) d = new Date(ddmmyyyy[3], ddmmyyyy[2]-1, ddmmyyyy[1]);

                    const parts = ds.split('-'); d = new Date(parts[0], parts[1]-1, parts[2]);
                } else return ds;
                return days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
            }

            function formatTimeId(ts, zone) {
                if(!ts || typeof ts !== 'string') return "";

                        const vSrc = verseSec.querySelector('.source-text');
                        if (vSrc && data.verse_source) vSrc.innerText = data.verse_source;
                    }

                    // Wishes
                    const wSec = document.getElementById('wishes-section');
                    if (wSec) wSec.style.display = (data.show_wishes === "false") ? 'none' : 'block';
                    if (data.wishes_header) document.querySelectorAll('.wishes-header-text').forEach(el => el.innerText = data.wishes_header);

                    // Music
                    if (data.musicUrl) setMusicSource(data.musicUrl);
                }
            } catch (err) {
                console.error("Error inside applyLivePreview:", err);
            } finally {
                // Sembunyikan Loader SELALU
                const loader = document.getElementById('shell-loader');
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 400);
                }
            }
        };

        // ─── 5. GLOBAL UI FUNCTIONS ───
        function initializeScripts() {
            // Set QR
            const qr = document.getElementById('qr-code');
            if(qr) qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${guestId}`;
            const gIdLbl = document.getElementById('guest-id-label');
            if(gIdLbl) gIdLbl.innerText = `ID: ${guestId}`;

            // Name in Wish
            const wName = document.getElementById('wish-name');
            if(wName) wName.value = guestName !== "Tamu Undangan" ? guestName : "";

            // Init Countdown
            setInterval(updateCountdown, 1000);
            
            // Reveal SCRUB zig-zag + per-kata: progres terikat posisi scroll (scrubbing timeline video).
            // Scroll down = animasi maju (objek masuk frame), scroll up = mundur (objek keluar frame).
            // Teks dipecah per kata, tiap kata scrub zig-zag kiri/kanan bergantian — gaya groom/bride.
            (function initRevealScrub() {
                const rootSel = '.reveal, .reveal-left, .reveal-right';
                const blocks = Array.from(document.querySelectorAll(rootSel));
                if (!blocks.length) return;
                const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (reduced) {
                    blocks.forEach(el => el.classList.add('active'));
                    return;
                }
                const OFFSET = 34;
                const SKIP_TOKENS = new Set(['countdown', 'wishes-container', 'rsvp-link', 'guest-name-display']);

                function tokenize(el) {
                    if (el.querySelector('.scrub-token')) return;
                    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
                        acceptNode(n) {
                            if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
                            const p = n.parentElement;
                            if (!p || p.closest('script,style')) return NodeFilter.FILTER_REJECT;
                            return NodeFilter.FILTER_ACCEPT;
                        }
                    });
                    const targets = [];
                    let n;
                    while ((n = walker.nextNode())) targets.push(n);
                    targets.forEach(tn => {
                        const frag = document.createDocumentFragment();
                        tn.nodeValue.split(/(\s+)/).forEach(w => {
                            if (!w) return;
                            if (/^\s+$/.test(w)) { frag.appendChild(document.createTextNode(' ')); return; }
                            const span = document.createElement('span');
                            span.className = 'scrub-token';
                            span.style.display = 'inline-block';
                            span.textContent = w;
                            frag.appendChild(span);
                        });
                        tn.parentNode.replaceChild(frag, tn);
                    });
                }

                const items = [];
                let zig = 0;
                blocks.forEach(el => {
                    el.style.transition = 'none';
                    if (el.querySelector(rootSel)) {
                        items.push({ el, kind: 'fade' });
                        return;
                    }
                    const isBtn = el.matches('button, a[class*="btn"], [role="button"]');
                    const baseDir = el.classList.contains('reveal-left') ? -1
                                  : (el.classList.contains('reveal-right') ? 1
                                  : ((zig++ % 2) ? 1 : -1));
                    if (isBtn || SKIP_TOKENS.has(el.id)) {
                        items.push({ el, kind: 'block', dir: baseDir });
                        return;
                    }
                    if (el.children.length <= 1 && /[A-Za-z0-9\u00C0-\u024F]/.test(el.textContent || '')) {
                        tokenize(el);
                        const tokens = el.querySelectorAll('.scrub-token');
                        if (tokens.length) {
                            items.push({ el, kind: 'words', dir: baseDir, tokens: Array.from(tokens) });
                            return;
                        }
                    }
                    items.push({ el, kind: 'block', dir: baseDir });
                });

                const scrubEl = (el, p, dir) => {
                    const px = (1 - p) * OFFSET * dir;
                    el.style.opacity = p.toFixed(3);
                    el.style.transform = 'translateX(' + px.toFixed(1) + 'px)';
                };

                const scrubWords = (item, p) => {
                    const el = item.el;
                    el.classList.add('active');
                    el.style.opacity = '';
                    el.style.transform = '';
                    const N = item.tokens.length;
                    if (p >= 1) {
                        item.tokens.forEach(t => { t.style.opacity = '1'; t.style.transform = ''; });
                        return;
                    }
                    item.tokens.forEach((t, i) => {
                        const tp = N <= 1 ? p : Math.max(0, Math.min(1, (p * N - i) / 0.75));
                        const tdir = (i % 2 === 0) ? -item.dir : item.dir;
                        const off = (1 - tp) * OFFSET;
                        t.style.opacity = tp.toFixed(3);
                        t.style.transform = 'translateX(' + (tdir * off).toFixed(1) + 'px)';
                    });
                };

                let ticking = false;
                const update = () => {
                    ticking = false;
                    const vh = window.innerHeight || 800;
                    items.forEach(item => {
                        const el = item.el;
                        const h = el.offsetHeight || 1;
                        let p;
                        if (h >= vh) { p = 1; }
                        else {
                            const r = el.getBoundingClientRect();
                            p = r.top >= vh - h ? (vh - r.top) / h
                              : r.top <= 0 ? 1 + r.top / h
                              : 1;
                        }
                        p = Math.max(0, Math.min(1, p));
                        if (item.kind === 'fade') {
                            if (p >= 1) { el.classList.add('active'); el.style.opacity = ''; el.style.transform = ''; }
                            else { el.classList.remove('active'); el.style.opacity = p.toFixed(3); el.style.transform = ''; }
                        } else if (item.kind === 'block') {
                            if (p >= 1) { el.classList.add('active'); el.style.opacity = ''; el.style.transform = ''; }
                            else { el.classList.remove('active'); scrubEl(el, p, item.dir); }
                        } else {
                            scrubWords(item, p);
                        }
                    });
                };
                const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(update); } };
                window.addEventListener('scroll', onScroll, { passive: true });
                window.addEventListener('resize', onScroll);
                window.addEventListener('load', onScroll);
                update();
                setTimeout(onScroll, 400);
            })();

            loadWishes();

            // RSVP Embed (konfirmasi kehadiran + selfie) — diisi setelah template dimuat
            initRsvpEmbed();

            // Gallery: pause marquee (sentuh) + modal foto fullscreen
            initGalleryInteractions();
        }

        // ─── 6. GALLERY INTERACTIONS: pause marquee + fullscreen photo modal ───
        function initGalleryInteractions() {
            const track = document.querySelector('.carousel-track');
            const cards = Array.from(document.querySelectorAll('.carousel-card'));
            if (!track || cards.length === 0) return;

            // 1) Smooth drag-to-swipe marquee (mouse + touch, inertia, seamless resume)
            const pause = () => { track.style.animationPlayState = 'paused'; };
            const resume = () => { track.style.animationPlayState = ''; };
            const durSec = parseFloat(window.getComputedStyle(track).animationDuration) || 34;
            const loopDist = (track.scrollWidth / 2) + 8;
            const secFromPx = px => (-px / loopDist) * durSec;
            const pxFromSec = sec => -(sec / durSec) * loopDist;
            const clampPx = px => Math.max(-loopDist, Math.min(0, px));
            const getSec = () => {
                const tf = window.getComputedStyle(track).transform;
                let tx = 0;
                const m2 = tf.match(/matrix\(([^,]+),([^,]+),([^,]+),([^,]+),([^,]+),([^,]+)\)/);
                if (m2) tx = parseFloat(m2[5]);
                else {
                    const m3 = tf.match(/matrix3d\(([^)]*)\)/);
                    if (m3) { const a = m3[1].split(','); tx = parseFloat(a[12]); }
                }
                return Math.max(0, Math.min(durSec, secFromPx(tx)));
            };
            const scrub = sec => { track.style.animationDelay = '-' + sec + 's'; };
            let justDragged = false;
            track.style.touchAction = 'pan-y';
            track.style.cursor = 'grab';

            let dragState = null;
            track.addEventListener('pointerdown', (e) => {
                dragState = { id: e.pointerId, startX: e.clientX, lastX: e.clientX, lastT: performance.now(), startSec: getSec(), moved: false, v: 0 };
                clearTimeout(resume._t);
                pause();
                try { track.setPointerCapture(e.pointerId); } catch (err) {}
            });
            track.addEventListener('pointermove', (e) => {
                if (!dragState || dragState.id !== e.pointerId) return;
                const dx = e.clientX - dragState.startX;
                const px = clampPx(pxFromSec(dragState.startSec) + dx);
                scrub(secFromPx(px));
                const now = performance.now();
                const dt = now - dragState.lastT;
                if (dt > 0) dragState.v = 0.8 * dragState.v + 0.2 * ((e.clientX - dragState.lastX) / dt * 1000);
                dragState.lastX = e.clientX;
                dragState.lastT = now;
                if (Math.abs(dx) > 10) dragState.moved = true;
            });
            const resumeAfter = () => {
                clearTimeout(resume._t);
                resume._t = setTimeout(() => {
                    if (!dragState) { scrub(getSec()); resume(); }
                }, 1200);
            };
            const endDrag = (e) => {
                if (!dragState || dragState.id !== e.pointerId) return;
                const st = dragState;
                dragState = null;
                if (st.moved && Math.abs(st.v) > 120) {
                    let px = clampPx(pxFromSec(getSec()));
                    const step = () => {
                        px += st.v * 0.016;
                        st.v *= 0.93;
                        px = clampPx(px);
                        scrub(secFromPx(px));
                        if (Math.abs(st.v) > 8) requestAnimationFrame(step);
                        else resumeAfter();
                    };
                    requestAnimationFrame(step);
                } else {
                    resumeAfter();
                }
                if (st.moved) justDragged = true;
            };
            track.addEventListener('pointerup', endDrag);
            track.addEventListener('pointercancel', endDrag);

            // 2) Kumpulkan foto unik (duplikat marquee di-dedupe)
            const imgs = cards.map(c => c.querySelector('img')).filter(Boolean);
            const srcs = [...new Set(imgs.map(i => i.getAttribute('src') || '').filter(Boolean))];
            if (srcs.length === 0) return;

            let modal = document.getElementById('gallery-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'gallery-modal';
                modal.style.cssText = 'position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)';
                modal.innerHTML = `
                    <style>
                        #gallery-modal .gm-img{max-width:92vw;max-height:78vh;object-fit:contain;border-radius:12px;box-shadow:0 20px 80px rgba(0,0,0,0.6)}
                        #gallery-modal .gm-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;font-size:22px;color:#fff;background:rgba(255,255,255,0.12);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;transition:background .25s;z-index:2}
                        #gallery-modal .gm-nav:hover{background:rgba(255,255,255,0.28)}
                        #gallery-modal .gm-prev{left:16px} #gallery-modal .gm-next{right:16px}
                        #gallery-modal .gm-close{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;font-size:18px;color:#fff;background:rgba(255,255,255,0.12);backdrop-filter:blur(4px);z-index:2}
                        #gallery-modal .gm-close:hover{background:rgba(255,255,255,0.28)}
                        #gallery-modal .gm-counter{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.85);font-size:12px;letter-spacing:2px;font-weight:600;font-family:Montserrat,sans-serif}
                        @media(max-width:640px){#gallery-modal .gm-nav{width:40px;height:40px;font-size:18px}#gallery-modal .gm-prev{left:6px}#gallery-modal .gm-next{right:6px}}
                    </style>
                    <button class="gm-close" aria-label="Tutup">&times;</button>
                    <button class="gm-nav gm-prev" aria-label="Sebelumnya">&#10094;</button>
                    <img class="gm-img" alt="Foto galeri">
                    <button class="gm-nav gm-next" aria-label="Berikutnya">&#10095;</button>
                    <div class="gm-counter"></div>`;
                document.body.appendChild(modal);
            }
            const imgEl = modal.querySelector('.gm-img');
            const counterEl = modal.querySelector('.gm-counter');
            const navBtns = modal.querySelectorAll('.gm-nav');
            if (srcs.length <= 1) navBtns.forEach(b => b.style.display = 'none');
            let curIdx = 0;

            const openModal = (idx) => {
                curIdx = (idx + srcs.length) % srcs.length;
                imgEl.src = srcs[curIdx];
                counterEl.textContent = (curIdx + 1) + ' / ' + srcs.length;
                modal.style.display = 'flex';
                pause();
                document.body.style.overflow = 'hidden';
            };
            const closeModal = () => {
                modal.style.display = 'none';
                document.body.style.overflow = '';
                if (!track.matches(':hover')) resume();
            };

            imgs.forEach(img => {
                img.style.cursor = 'zoom-in';
                img.addEventListener('dragstart', (e) => e.preventDefault());
                img.addEventListener('click', () => {
                    if (justDragged) { justDragged = false; return; }
                    openModal(srcs.indexOf(img.getAttribute('src') || ''));
                });
            });
            modal.querySelector('.gm-close').addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
            modal.querySelector('.gm-prev').addEventListener('click', () => openModal(curIdx - 1));
            modal.querySelector('.gm-next').addEventListener('click', () => openModal(curIdx + 1));

            // Keyboard: Esc tutup, panah kiri/kanan navigasi
            document.addEventListener('keydown', (e) => {
                if (modal.style.display !== 'flex') return;
                if (e.key === 'Escape') closeModal();
                if (e.key === 'ArrowLeft') openModal(curIdx - 1);
                if (e.key === 'ArrowRight') openModal(curIdx + 1);
            });

            // Swipe kiri/kanan di modal (mobile)
            let sx = null;
            modal.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
            modal.addEventListener('touchend', (e) => {
                if (sx === null) return;
                const dx = e.changedTouches[0].clientX - sx;
                if (dx > 40) openModal(curIdx - 1);
                else if (dx < -40) openModal(curIdx + 1);
                sx = null;
            }, { passive: true });
        }

        window.scrollToAccessCard = function () {
            const section = document.getElementById('access-card-section');
            if (section) section.scrollIntoView({ behavior: 'smooth' });
        };

        window.startInvitation = function () {
            const audio = document.getElementById('main-audio');
            if (audio && audio.src) {
                audio.play().then(() => {
                    window.isPlaying = true;
                    updateMusicUI();
                }).catch(e => console.warn(e));
            }

            document.getElementById('cover').style.transform = 'translateY(-100%)';
            document.getElementById('cover').style.pointerEvents = 'none';
            const content = document.getElementById('content');
            if(content) {
                content.classList.remove('hidden');
                setTimeout(() => {
                    content.style.opacity = '1';
                    document.getElementById('music-btn').classList.remove('hidden');
                    setTimeout(() => document.getElementById('music-btn').style.opacity = '1', 100);
                    const sTab = document.getElementById('side-shortcut');
                    if (sTab) setTimeout(() => sTab.style.opacity = '1', 500);
                    const ht = document.getElementById('hero-target');
                    if(ht) ht.scrollIntoView({ behavior: 'smooth' });
                }, 600);
            }
        };

        window.isPlaying = false;
        window.toggleMusic = function () {
            const audio = document.getElementById('main-audio');
            if (!audio) return;
            if (window.isPlaying) {
                audio.pause(); window.isPlaying = false; updateMusicUI();
            } else {
                audio.play().then(() => { window.isPlaying = true; updateMusicUI(); }).catch(e => console.warn(e));
            }
        };

        function updateMusicUI() {
            const visualizer = document.getElementById('visualizer');
            if (visualizer) window.isPlaying ? visualizer.classList.remove('paused') : visualizer.classList.add('paused');
            const musicTxt = document.getElementById('music-txt');
            if (musicTxt) musicTxt.innerText = window.isPlaying ? "PAUSE" : "PLAY";
        }

        function setMusicSource(url) {
            const audio = document.getElementById('main-audio');
            if (!url || !audio) return;
            audio.src = url;
            audio.load();
        }

        function updateCountdown() {
            const rawCountdown = window.ACTIVE_COUNTDOWN || "May 25, 2026 08:00:00";
            const weddingDate = new Date(rawCountdown).getTime();
            const gap = weddingDate - new Date().getTime();
            if (gap > 0) {
                const d = Math.floor(gap / (1000 * 60 * 60 * 24));
                const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((gap % (1000 * 60)) / 1000);
                if(document.getElementById("days")) document.getElementById("days").innerText = d.toString().padStart(2, '0');
                if(document.getElementById("hours")) document.getElementById("hours").innerText = h.toString().padStart(2, '0');
                if(document.getElementById("mins")) document.getElementById("mins").innerText = m.toString().padStart(2, '0');
                if(document.getElementById("secs")) document.getElementById("secs").innerText = s.toString().padStart(2, '0');
            }
        }

        window.copyToClipboard = function(text) {
            navigator.clipboard.writeText(text).then(() => alert("Disalin: " + text));
        }

        window.loadWishes = async function () {
            const ssId = window.CURRENT_SS_ID || urlParams.get('ssId');
            if (!ssId) return;
            try {
                const res = await fetch(`${window.SCRIPT_URL}?action=getWishes&ssId=${ssId}`);
                const result = await res.json();
                if (result.status === "success" && Array.isArray(result.data)) {
                     const container = document.getElementById('wishes-container');
                     if (!container) return;
                     container.innerHTML = ''; 
                     result.data.forEach(wish => {
                         const div = document.createElement('div');
                         div.className = "wish-card";
                         div.innerHTML = `<p class="text-[11px] font-bold text-neutral-800 mb-1">${wish.name || 'Tamu'}</p>
                             <p class="text-[10px] text-neutral-500">${wish.text}</p>`;
                         container.appendChild(div);
                     });
                }
            } catch(e) { console.error(e); }
        };

        window.sendWish = async function () {
            const name = document.getElementById('wish-name').value;
            const text = document.getElementById('wish-text').value;
            const btn = document.getElementById('btn-wish');
            if (!name || !text || !btn) return;

            const ssId = window.CURRENT_SS_ID || urlParams.get('ssId');
            btn.disabled = true; btn.innerText = "Mengirim...";

            try {
                const res = await fetch(window.SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "addWish", ssId: ssId, name: name, text: text })
                });
                const result = await res.json();
                if(result.status === "success") {
                    document.getElementById('wish-text').value = "";
                    btn.innerText = "Terkirim!";
                    window.loadWishes(); 
                } else throw new Error();
            } catch (e) {
                btn.innerText = "Gagal";
            }
            setTimeout(() => { btn.innerText = "Kirim Ucapan"; btn.disabled = false; }, 2000);
        };

        // Mulai eksekusi saat dom siap
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(loadDynamicConfig, 500);
        });
    </script>
