<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Diagnostics — SapaTamu Sortir</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
        h2 { color: #fff; }
        .log { margin: 5px 0; padding: 5px 10px; border-left: 3px solid #0f0; }
        .log.err { border-color: #f00; color: #f66; }
        .log.ok { border-color: #0f0; color: #0f0; }
        .log.warn { border-color: #ff0; color: #ff0; }
        .log.info { border-color: #08f; color: #8cf; }
        button { background: #E07B7B; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
<h2>🔬 SapaTamu Sortir — Login Diagnostics</h2>
<p style="color:#888">Domain: <span id="dom" style="color:#ff0"></span></p>
<div id="log-container"></div>
<button onclick="runTest()">▶ Jalankan Test Login</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
document.getElementById('dom').innerText = window.location.href;

function log(msg, type = 'info') {
    const d = document.createElement('div');
    d.className = 'log ' + type;
    d.innerText = '[' + new Date().toLocaleTimeString() + '] ' + msg;
    document.getElementById('log-container').appendChild(d);
    console.log(msg);
}

async function runTest() {
    document.getElementById('log-container').innerHTML = '';

    // Step 0: Check Supabase SDK
    log('Step 0: Checking Supabase SDK...', 'info');
    if (typeof window.supabase === 'undefined') {
        log('ERROR: window.supabase tidak tersedia! CDN gagal dimuat.', 'err');
        return;
    }
    log('✅ window.supabase tersedia', 'ok');

    const SB_URL = "https://llrapesaaoliyjrrrsjh.supabase.co";
    const SB_KEY = "sb_publishable_414hQDyPBaFi0fnzmIKyZw_Iwa09Q0u";

    let supabase;
    try {
        supabase = window.supabase.createClient(SB_URL, SB_KEY);
        log('✅ Supabase client created', 'ok');
    } catch(e) {
        log('ERROR createClient: ' + e.message, 'err');
        return;
    }

    // Step 1: Resolve username
    log('Step 1: Resolving username "knowhere"...', 'info');
    let email = '';
    try {
        const r = await fetch('/api/sortir-get-email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: 'knowhere' })
        });
        log('HTTP Status: ' + r.status, r.ok ? 'ok' : 'err');
        const d = await r.json();
        log('Response: ' + JSON.stringify(d), r.ok ? 'ok' : 'err');
        if (!r.ok) { log('STOP: gagal resolve username', 'err'); return; }
        email = d.email;
        log('✅ Email: ' + email, 'ok');
    } catch(e) {
        log('EXCEPTION Step 1: ' + e.message, 'err');
        return;
    }

    // Step 2: Sign In
    log('Step 2: signInWithPassword...', 'info');
    let userId = '';
    try {
        const { data, error } = await supabase.auth.signInWithPassword({
            email: email,
            password: 'knowhere2026'
        });
        if (error) {
            log('ERROR signIn: ' + error.message + ' (code: ' + error.status + ')', 'err');
            return;
        }
        userId = data.user?.id;
        log('✅ Auth OK! User ID: ' + userId, 'ok');
        log('Session access_token prefix: ' + (data.session?.access_token?.substring(0,30) + '...'), 'ok');
    } catch(e) {
        log('EXCEPTION Step 2: ' + e.message, 'err');
        return;
    }

    // Step 3: Fetch vendor profile
    log('Step 3: Fetching sortir_vendors...', 'info');
    try {
        const { data, error } = await supabase
            .from('sortir_vendors')
            .select('*')
            .eq('id', userId);
        if (error) {
            log('ERROR vendor fetch: ' + error.message + ' | code: ' + error.code, 'err');
            return;
        }
        log('Rows returned: ' + (data?.length || 0), data?.length > 0 ? 'ok' : 'warn');
        if (data?.length > 0) {
            log('Vendor: ' + JSON.stringify({ username: data[0].username, is_active: data[0].is_active, subscription_expires_at: data[0].subscription_expires_at }), 'ok');
            log('✅ ALL STEPS PASSED — login should work!', 'ok');
            log('Redirecting to dashboard in 3 seconds...', 'warn');

            // Save session
            localStorage.setItem('sortir_vendor_session', JSON.stringify({
                id: data[0].id,
                username: data[0].username,
                vendor_name: data[0].vendor_name,
                email: email,
                plan: !data[0].subscription_expires_at ? 'bonus' : 'premium',
                subscription_expires_at: data[0].subscription_expires_at
            }));

            setTimeout(() => {
                window.location.replace('https://sortir.sapatamu.id/sortir_dashboard.html');
            }, 3000);
        } else {
            log('WARN: vendor profile KOSONG untuk userId: ' + userId, 'warn');
        }
    } catch(e) {
        log('EXCEPTION Step 3: ' + e.message, 'err');
    }
}
</script>
</body>
</html>
