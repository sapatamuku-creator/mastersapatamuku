<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Tema - SapaTamu.Ku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #E07B7B; --bg: #FFF9F5; --text: #4A3F35; --border: #F0E6DE; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--bg); padding-top: 80px; }
        .theme-card { transition: all 0.3s ease; }
        .theme-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        
        /* NAVBAR CLONE */
        .sapatamu-navbar { position: fixed; top: 0; left: 0; width: 100%; padding: 15px 15px 5px; display: flex; justify-content: center; z-index: 10000; background: var(--bg); }
        .nav-outer-wrapper { position: relative; max-width: 95%; display: flex; align-items: center; background: #FFFDFB; border-radius: 50px; box-shadow: 0 10px 30px rgba(74, 63, 53, 0.08); border: 1px solid var(--border); overflow: hidden; }
        .nav-scroll-container { display: flex; align-items: center; gap: 5px; padding: 6px 15px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .nav-link { text-decoration: none; font-size: 10.5px; font-weight: 700; color: #8C7560; padding: 10px 18px; border-radius: 30px; transition: 0.3s; }
        .nav-link.active { background: var(--primary); color: white !important; }
        .nav-link:hover { background: rgba(224, 123, 123, 0.05); color: var(--primary); }
        .nav-divider { width: 1px; height: 18px; background: #EEE0D5; margin: 0 8px; }
    </style>
</head>
<body class="text-neutral-800">

    <nav class="sapatamu-navbar">
        <div class="nav-outer-wrapper">
            <div class="nav-scroll-container" id="nav-scroll">
                <div class="nav-group flex items-center">
                    <a href="#" onclick="navTo('dashboard.html')" class="nav-link">Dashboard</a>
                    <div class="nav-divider"></div>
                    <a href="#" onclick="navTo('formulir_tamu.html')" class="nav-link">Formulir</a>
                    <a href="#" onclick="navTo('wa_blast.html')" class="nav-link">WA Blast</a>
                    <a href="#" onclick="navTo('undangan.html')" class="nav-link">Undangan</a>
                </div>
                <div class="nav-divider"></div>
                <div class="nav-group flex items-center">
                    <a href="#" onclick="navTo('config_invitation.html')" class="nav-link active">← KEMBALI KE EDITOR</a>
                </div>
                <div class="nav-divider"></div>
                <a href="logout.html" class="nav-link" style="color: #E07B7B;">Sign Out</a>
            </div>
        </div>
    </nav>
    <script>
        function navTo(page) {
            window.location.href = page + window.location.search;
        }
    </script>

    <!-- Header -->
    <div class="bg-white border-b border-neutral-100 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-3xl font-bold mb-4">Pilih Tema Undangan Anda</h1>
            <p class="text-neutral-500 max-w-2xl mx-auto">Satu klik untuk mengubah seluruh nuansa undangan digital Anda. Kami menyediakan berbagai pilihan tema mulai dari minimalis, elegan, hingga tradisional.</p>
        </div>
    </div>

    <!-- Catalog Grid -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        
        <!-- Loading State -->
        <div id="loading" class="text-center py-20">
            <div class="w-10 h-10 border-4 border-neutral-200 border-t-neutral-800 rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-sm font-bold text-neutral-500 uppercase tracking-widest">Memuat Katalog...</p>
        </div>

        <!-- Grid Container -->
        <div id="catalog-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
            <!-- Items will be injected here -->
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('catalog-grid');
            const loading = document.getElementById('loading');

            try {
                // Fetch Auto-Discovery JSON
                const res = await fetch('/assets/templates/master_templates.json');
                const templates = await res.json();

                if(templates && templates.length > 0) {
                    loading.classList.add('hidden');
                    grid.classList.remove('hidden');

                    templates.forEach(t => {
                        const card = document.createElement('div');
                        card.className = "theme-card bg-white rounded-2xl overflow-hidden border border-neutral-200 flex flex-col";
                        
                        card.innerHTML = `
                            <div class="aspect-[9/16] w-full bg-neutral-100 relative overflow-hidden group">
                                <img src="${t.cover || 'https://via.placeholder.com/400x700?text=No+Cover'}" class="w-full h-full object-cover" alt="${t.name}">
                                <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm">
                                    <button onclick="previewTheme('${t.id}')" class="bg-white text-neutral-900 px-6 py-3 rounded-full text-xs font-bold uppercase tracking-widest hover:scale-105 transition-transform">Live Preview</button>
                                </div>
                            </div>
                            <div class="p-6 flex-1 flex flex-col">
                                <h3 class="text-lg font-bold mb-2">${t.name}</h3>
                                <p class="text-sm text-neutral-500 mb-6 flex-1">${t.description}</p>
                                <button onclick="useTheme('${t.id}')" class="w-full bg-neutral-900 text-white py-3 rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-neutral-800 transition-colors">Gunakan Tema Ini</button>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    loading.innerHTML = "<p class='text-neutral-500'>Belum ada template yang tersedia.</p>";
                }
            } catch (err) {
                console.error(err);
                loading.innerHTML = "<p class='text-red-500'>Gagal memuat katalog tema.</p>";
            }
        });

        function useTheme(themeId) {
            if(confirm("Apakah Anda yakin ingin mengganti ke tema ini?")) {
                // Logic to update Supabase theme_id for this client
                // For now, we will simulate it by storing in localStorage and redirecting back to config
                alert("Tema berhasil diubah ke: " + themeId);
                
                const params = new URLSearchParams(window.location.search);
                params.set('theme_id', themeId);
                window.location.href = 'config_invitation.html?' + params.toString();
            }
        }

        function previewTheme(themeId) {
            alert("Membuka Live Preview untuk tema: " + themeId + "\n(Fitur Preview akan diarahkan ke undangan.html?preview=" + themeId + ")");
            // window.open('undangan.html?preview=' + themeId, '_blank');
        }
    </script>
</body>
</html>
