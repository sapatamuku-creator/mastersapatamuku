<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Vendor — Sapatamu.id</title>
  <meta name="description" content="Lihat profil, paket, galeri, dan ulasan vendor wedding di Sapatamu.id">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/animations.css">
  <style>
    :root {
      --primary:       hsl(0, 62%, 68%);
      --primary-dark:  hsl(0, 55%, 55%);
      --primary-light: hsl(0, 70%, 80%);
      --gold:          hsl(40, 63%, 48%);
      --mp-green:      hsl(142, 55%, 48%);
      --text-main:     hsl(20, 15%, 15%);
      --text-light:    hsl(20, 8%, 40%);
      --text-muted:    hsl(20, 5%, 58%);
      --bg:            hsl(30, 25%, 97%);
      --bg-alt:        hsl(30, 20%, 94%);
      --white:         #fff;
      --border:        hsl(30, 15%, 88%);
      --shadow-sm:     0 1px 4px rgba(0,0,0,.06);
      --shadow-md:     0 4px 16px rgba(0,0,0,.08);
      --shadow-lg:     0 8px 32px rgba(0,0,0,.10);
      --shadow-xl:     0 16px 48px rgba(0,0,0,.13);
      --radius:        16px;
      --radius-sm:     10px;
      --radius-lg:     24px;
      --transition:    all .2s ease;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text-main); line-height: 1.6; }
    a { text-decoration: none; color: inherit; transition: var(--transition); }
    img { max-width: 100%; height: auto; display: block; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; font-size: inherit; }

    .navbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: rgba(255,251,249,.92); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      transition: var(--transition);
    }
    .navbar.scrolled { box-shadow: var(--shadow-md); }
    .navbar .inner {
      max-width: 1200px; margin: 0 auto; padding: 0 20px;
      height: 60px; display: flex; align-items: center; gap: 12px;
    }
    .nav-back {
      display: flex; align-items: center; gap: 6px;
      font-size: .88rem; color: var(--text-light); font-weight: 500;
    }
    .nav-back:hover { color: var(--primary); }
    .nav-logo {
      font-family: 'Lora', serif; font-size: 1.2rem; font-weight: 700;
      display: flex; align-items: center; gap: 6px;
    }
    .nav-logo .li { width: 28px; height: 28px; background: linear-gradient(135deg,var(--primary),var(--gold)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: .85rem; }
    .nav-spacer { flex: 1; }
    .nav-cta {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; background: linear-gradient(135deg,var(--primary),var(--primary-dark));
      color: #fff; border-radius: 50px; font-size: .82rem; font-weight: 600;
      box-shadow: 0 4px 12px rgba(224,123,123,.3);
    }

    .vendor-cover-hero {
      margin-top: 60px; position: relative; height: 320px; overflow: hidden;
      background: linear-gradient(135deg, var(--primary), var(--gold));
    }
    .vendor-cover-hero img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .cover-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,.55));
    }

    .vendor-head-wrap { max-width: 1200px; margin: -60px auto 0; padding: 0 24px; position: relative; z-index: 10; }
    .vendor-head {
      background: var(--white); border-radius: var(--radius-lg); padding: 28px 32px;
      display: flex; align-items: flex-start; gap: 24px;
      box-shadow: var(--shadow-xl); border: 1px solid var(--border);
    }
    .vendor-logo-big {
      width: 90px; height: 90px; border-radius: 18px; flex-shrink: 0;
      border: 3px solid var(--white); overflow: hidden;
      background: linear-gradient(135deg,var(--primary),var(--gold));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 2rem; font-weight: 700; font-family: 'Lora', serif;
      box-shadow: var(--shadow-md);
    }
    .vendor-logo-big img { width: 100%; height: 100%; object-fit: cover; }
    .vendor-head-info { flex: 1; min-width: 0; }
    .vendor-badges { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .badge-cat {
      padding: 3px 10px; border-radius: 50px; font-size: .72rem; font-weight: 600;
      background: rgba(224,123,123,.12); color: var(--primary);
    }
    .badge-v {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 50px; font-size: .72rem; font-weight: 600;
      background: rgba(76,175,80,.12); color: #388e3c;
    }
    .badge-feat {
      padding: 3px 10px; border-radius: 50px; font-size: .72rem; font-weight: 600;
      background: rgba(200,150,46,.15); color: var(--gold);
    }
    .vendor-head h1 { font-family: 'Lora', serif; font-size: clamp(1.2rem,2.5vw,1.7rem); font-weight: 700; margin-bottom: 6px; }
    .vendor-meta-row {
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      font-size: .85rem; color: var(--text-light);
    }
    .vendor-head-actions {
      display: flex; align-items: flex-start; gap: 10px; flex-shrink: 0; flex-wrap: wrap;
    }
    .btn-wa {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 11px 20px; border-radius: 50px;
      background: #25D366; color: #fff; font-weight: 600; font-size: .88rem;
      box-shadow: 0 4px 12px rgba(37,211,102,.3);
    }
    .btn-inquiry {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 11px 20px; border-radius: 50px;
      background: linear-gradient(135deg,var(--primary),var(--primary-dark));
      color: #fff; font-weight: 600; font-size: .88rem;
      box-shadow: 0 4px 12px rgba(224,123,123,.3);
    }
    .btn-share {
      display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border-radius: 50%;
      border: 1.5px solid var(--border); color: var(--text-light);
    }

    .main-wrap { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; display: grid; grid-template-columns: 1fr 320px; gap: 28px; }
    @media (max-width: 900px) { .main-wrap { grid-template-columns: 1fr; } }

    .tabs { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); overflow: hidden; }
    .tab-nav { display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .tab-btn { padding: 14px 20px; font-size: .88rem; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-content { padding: 28px; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .about-desc { color: var(--text-light); line-height: 1.8; margin-bottom: 24px; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .info-item { display: flex; flex-direction: column; gap: 4px; }
    .info-label { font-size: .75rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); }
    .info-value { font-size: .9rem; font-weight: 500; color: var(--text-main); }

    .paket-grid { display: grid; gap: 16px; }
    .paket-card { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 20px; display: flex; gap: 16px; align-items: flex-start; }
    .paket-img { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; background: var(--bg-alt); flex-shrink: 0; }
    .paket-info { flex: 1; min-width: 0; }
    .paket-name { font-weight: 700; font-size: .95rem; margin-bottom: 4px; }
    .paket-price { font-family: 'Lora', serif; font-size: 1rem; font-weight: 700; color: var(--primary); }

    .galeri-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .galeri-item { aspect-ratio: 1; border-radius: var(--radius-sm); overflow: hidden; cursor: pointer; background: var(--bg-alt); }
    .galeri-item img { width: 100%; height: 100%; object-fit: cover; }

    .sidebar-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); padding: 22px; margin-bottom: 20px; }
    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 900;
      padding: 12px 20px; border-radius: 12px; font-size: .87rem; font-weight: 500;
      background: var(--text-main); color: #fff; box-shadow: var(--shadow-lg);
      transform: translateY(80px); opacity: 0; transition: all .3s ease;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <nav class="navbar" id="navbar">
    <div class="inner">
      <a href="/marketplace" class="nav-back">Marketplace</a>
      <div class="nav-spacer"></div>
      <a href="/" class="nav-logo"><span class="li">💍</span> sapatamu</a>
    </div>
  </nav>

  <div class="vendor-cover-hero" id="coverHero">
    <div class="cover-overlay"></div>
  </div>

  <div class="vendor-head-wrap">
    <div class="vendor-head" id="vendorHead">
      <div class="vendor-logo-big" id="vendorLogo"></div>
      <div class="vendor-head-info">
        <div class="vendor-badges" id="vendorBadges"></div>
        <h1 id="vendorName">&nbsp;</h1>
        <div class="vendor-meta-row" id="vendorMeta"></div>
      </div>
      <div class="vendor-head-actions" id="vendorActions"></div>
    </div>
  </div>

  <div class="main-wrap" id="mainWrap">
    <div>
      <div class="tabs">
        <div class="tab-nav" id="tabNav">
          <button class="tab-btn active" data-tab="tentang">Tentang</button>
          <button class="tab-btn" data-tab="paket">Paket & Layanan</button>
          <button class="tab-btn" data-tab="galeri">Galeri</button>
        </div>
        <div class="tab-content">
          <div class="tab-panel active" id="tab-tentang">
            <p class="about-desc" id="aboutDesc">—</p>
            <div class="info-grid" id="infoGrid"></div>
          </div>
          <div class="tab-panel" id="tab-paket">
            <div class="paket-grid" id="paketGrid"></div>
          </div>
          <div class="tab-panel" id="tab-galeri">
            <div class="galeri-grid" id="galeriGrid"></div>
          </div>
        </div>
      </div>
    </div>

    <aside class="sidebar">
      <div class="sidebar-card" id="statsCard"></div>
    </aside>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const $ = id => document.getElementById(id);
    const slug = location.pathname.split('/vendor/')[1]?.split('/')[0] || new URLSearchParams(location.search).get('slug') || '';

    async function loadVendor() {
      if (!slug) return;
      try {
        const res = await fetch(`/api/marketplace/vendor-detail?slug=${encodeURIComponent(slug)}`);
        const data = await res.json();
        if (data.vendor) {
          $('vendorName').textContent = data.vendor.business_name;
          $('aboutDesc').textContent = data.vendor.description || 'Tidak ada deskripsi.';
        }
      } catch (e) {}
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        $('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    loadVendor();
  </script>
</body>
</html>
