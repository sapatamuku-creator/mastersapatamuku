<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sapa Tamu.ku - Admin</title>
    <style>
    .st-container {
        padding: 30px;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        box-sizing: border-box;
    }

    .st-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 25px;
        margin-bottom: 25px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }

    .st-label {
        display: block;
        font-size: 9px !important;
        font-weight: 900;
        color: #BBB;
        letter-spacing: 1.5px;
        margin-bottom: 8px;
        text-transform: uppercase;
    }

    .st-input {
        width: 100%;
        padding: 14px;
        background: #fcfcfc;
        border: 1.5px solid var(--border);
        color: var(--primary);
        border-radius: 12px;
        font-size: 14px !important;
        font-weight: 600;
        margin-bottom: 15px;
        box-sizing: border-box;
        outline: none;
        transition: 0.3s;
    }
    .st-input:focus { border-color: var(--gold); background: #fff; }

    .st-btn {
        padding: 14px 20px;
        border-radius: 12px;
        font-weight: 800;
        cursor: pointer;
        border: none;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: 0.3s;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }
    .st-btn:active { transform: scale(0.96); }

    .btn-dark { background: var(--primary); color: #fff; }
    .btn-gold { background: var(--gold); color: #fff; box-shadow: 0 8px 15px rgba(212, 175, 55, 0.2); }
    .btn-disabled { background: #eee !important; color: #aaa !important; cursor: not-allowed; }
    
    .btn-outline-gold {
        background: transparent;
        border: 1.5px solid var(--gold);
        color: var(--gold);
    }
    .btn-outline-gold:hover { background: rgba(212, 175, 55, 0.05); }

    table { width: 100%; border-collapse: collapse; }
    th { 
        text-align: left; 
        padding: 15px; 
        border-bottom: 1px solid var(--border); 
        color: #BBB; 
        font-size: 9px; 
        font-weight: 900;
        letter-spacing: 1px;
        text-transform: uppercase;
        position: sticky; 
        top: 0; 
        background: var(--white); 
    }
    td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; color: #444; }
    
    .grid-layout { display: flex; gap: 25px; align-items: flex-start; }
    .sidebar { flex: 0 0 380px; }
    .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    .table-scroll-area {
        flex-grow: 1; 
        overflow-y: auto;
        background: #fff;
        max-height: 650px;
        border-radius: 15px;
    }

    #loading-global {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(255,255,255,0.95); 
        display: flex; justify-content: center;
        align-items: center; z-index: 100000; flex-direction: column;
        backdrop-filter: blur(5px);
    }
    .spinner {
        width: 40px; height: 40px;
        border: 4px solid #f0f0f0; border-top: 4px solid var(--gold);
        border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .fullscreen-btn {
        position: fixed; bottom: 25px; right: 25px; width: 50px; height: 50px;
        background: var(--primary); color: white; border-radius: 15px;
        display: flex; justify-content: center; align-items: center;
        cursor: pointer; z-index: 9999; box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        transition: 0.3s;
    }
    .fullscreen-btn:hover { transform: scale(1.1); background: var(--gold); }

    .st-modal-overlay {
        position: fixed; inset: 0; background: rgba(0,0,0,0.4);
        display: none; justify-content: center; align-items: center;
        z-index: 100000; backdrop-filter: blur(15px);
    }
    .st-modal-content {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(255,255,255,0.4);
        padding: 40px; border-radius: 35px;
        text-align: center; max-width: 400px; width: 90%;
        box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .st-modal-icon { font-size: 50px; margin-bottom: 20px; display: block; }
    .st-modal-title { color: var(--primary); margin-bottom: 10px; font-size: 22px; font-weight: 800; }
    .st-modal-msg { color: #666; line-height: 1.6; font-size: 14px; font-weight: 500; margin-bottom: 30px; }
    .st-modal-btn { background: var(--primary); color: #fff; border: none; padding: 18px; border-radius: 18px; cursor: pointer; font-weight: 800; width: 100%; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

    .switch-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
        position: absolute; cursor: pointer; inset: 0;
        background-color: #eee; transition: .4s; border-radius: 20px;
    }
    .slider:before {
        position: absolute; content: ""; height: 16px; width: 16px;
        left: 3px; bottom: 3px; background-color: #fff; transition: .4s; border-radius: 50%;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    input:checked + .slider { background-color: var(--gold); }
    input:checked + .slider:before { transform: translateX(18px); }

    #customToast {
        display: none; position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
        background: var(--primary); color: white; padding: 14px 28px; border-radius: 50px;
        font-weight: 800; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
        z-index: 100001; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    @media (max-width: 900px) {
        .grid-layout { flex-direction: column; }
        .sidebar { flex: 1 0 100%; width: 100%; }
        .st-container { padding: 15px; }
    }
    </style>
</head>
<body>

<!-- Tombol Fullscreen Fixed -->
<div class="fullscreen-btn" onclick="toggleFullScreen()" title="Toggle Fullscreen">
    <svg id="fs-icon" viewBox="0 0 24 24">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
    </svg>
</div>

<div id="loading-global">
    <div class="spinner"></div>
    <div style="color:#d4af37; font-size: 12px; font-weight:bold; letter-spacing: 2px;" id="loading-text">INITIALIZING...</div>
</div>

<div id="st-modal" class="st-modal-overlay">
    <div id="modal-container" class="st-modal-content">
        <span id="st-modal-icon" class="st-modal-icon">⚠️</span>
        <div id="st-modal-title" class="st-modal-title">Notifikasi</div>
        <div id="st-modal-msg" class="st-modal-msg">Pesan akan muncul di sini.</div>
        <button onclick="closeModal()" class="st-modal-btn">MENGERTI</button>
    </div>
</div>

<div id="customToast" style="display:none; position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:rgba(212,175,55,0.9); color:black; padding:10px 20px; border-radius:20px; font-weight:bold; z-index:10001; font-size:12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); white-space: nowrap;"></div>

<div class="st-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; border-bottom: 1.5px solid var(--border); padding-bottom: 25px;">
        <h2 style="margin:0; font-weight: 100; font-size: 20px; letter-spacing: 5px; text-transform: uppercase;">
            SAPA TAMU.KU 
            <span id="connectionStatus" style="background:#cc0000; color:white; font-size:8px; padding:4px 10px; border-radius:6px; font-weight:900; vertical-align: middle; letter-spacing: 1px; margin-left: 10px;">OFFLINE</span>
        </h2>
        <div style="text-align: right;">
            <div id="weddingTitle" style="font-size: 13px; color: var(--gold); font-weight: 800; text-transform: uppercase;">--</div>
            <div style="font-size: 9px; color: #AAA; font-weight: 800; margin-top: 5px; letter-spacing: 1px;">SSID: <span id="displaySsId" style="color: #666;">...</span></div>
        </div>
    </div>

    <div class="grid-layout">
        <div class="sidebar">
            
            <div class="st-card" style="padding: 20px;">
                <label class="st-label">Fonnte Account Token (Master)</label>
                <div style="display: flex; gap: 8px;">
                    <input type="password" id="masterToken" class="st-input" style="margin:0;" placeholder="Token Utama...">
                    <button onclick="saveMasterToken()" class="st-btn btn-dark">SAVE</button>
                </div>
                <button onclick="window.open('https://md.fonnte.com/new/login.php')" class="st-btn btn-outline-gold" style="width:100%; margin-top:12px;">
                    REGISTER / LOGIN FONNTE
                </button>
            </div>

            <div class="st-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                    <h3 style="color: var(--primary); margin: 0; font-size: 11px; font-weight: 900; letter-spacing: 1.5px;">CONTROL CENTER</h3>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span id="statusIndicator" style="font-size:7px; font-weight:900; padding:4px 8px; border-radius:5px; background:#f5f5f5; color: #999;">OFFLINE</span>
                        <span id="statusCounter" style="color: var(--gold); font-size: 11px; font-weight: 900;">[0/3]</span>
                    </div>
                </div>

                <label class="st-label">PILIH PIHAK PENGUNDANG</label>
                <select id="kategoriSelect" class="st-input" onchange="updateClientView()"></select>

                <label class="st-label">NOMOR WHATSAPP</label>
                <input type="text" id="clientPhone" class="st-input" placeholder="628xxxx">

                <div class="switch-container" style="background: #fcfcfc; padding: 12px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px;">
                    <label class="st-label" style="margin-bottom: 0; color: var(--primary);">DEVICE TOKEN</label>
                    <label class="switch">
                        <input type="checkbox" id="statusToggle" onchange="manualStatusUpdate()">
                        <span class="slider"></span>
                    </label>
                </div>
                <input type="text" id="displayToken" class="st-input" readonly style="color: var(--gold); border-style: dashed; background: #fffcf5; text-align: center; letter-spacing: 1px;"> 
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 5px;">
                    <button onclick="remoteSyncDevice()" class="st-btn btn-outline-gold">GET TOKEN</button>
                    <button id="btnBlastAction" onclick="executeMassBlast()" class="st-btn btn-disabled" disabled>
                        BLAST ALL
                    </button>
                </div>
                
                <button onclick="window.open('https://md.fonnte.com', '_blank')" class="st-btn btn-dark" style="width:100%; margin-top:12px;">
                    CONNECT TO FONNTE
                </button>
            </div>
        </div> 
        <div class="main-content">
            <div class="st-card" style="height: 100%; display: flex; flex-direction: column; padding: 25px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <label class="st-label" style="margin: 0;">Database Tamu</label>
                    <span id="countTamu" style="background: var(--gold); color: white; padding: 4px 12px; border-radius: 50px; font-size: 9px; font-weight: 900;">0 GUESTS</span>
                </div>
                
                <div class="table-scroll-area">
                    <table>
                        <thead>
                            <tr>
                                <th>NAMA</th>
                                <th>PENGUNDANG</th>
                                <th style="text-align: right;">STATUS</th>
                            </tr>
                        </thead>
                        <tbody id="tamuTable">
                            <tr><td colspan="3" style="text-align:center; color:#AAA; padding: 60px; font-size: 11px;">Mencari data di spreadsheet...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJ8biF1h3tjehSK88lDLxoQopTG8pJoWZNSBvh3YwFVX0Sow-7hCcZX4_eVqWWgdH4/exec"; 

    const urlParams = new URLSearchParams(window.location.search);
    const CURRENT_SS_ID = urlParams.get("ssId") || localStorage.getItem("st_saved_ssid");

    if (!CURRENT_SS_ID) {
        window.location.href = "https://sapatamu.weebly.com/";
        return;
    }

    localStorage.setItem("st_saved_ssid", CURRENT_SS_ID);
    document.getElementById('displaySsId').innerText = CURRENT_SS_ID.substring(0,8) + "...";
    
    let localData = { categories: [], tamu: [], liveUsage: 0 };
    let isProcessing = false; // State Management Global

    // Fungsi Notifikasi Modern
    function showToast(msg, duration = 3000) {
        const toast = document.getElementById('customToast');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, duration);
    }

    window.closeModal = function() {
        document.getElementById('st-modal').style.display = 'none';
    };

    function toggleProcessing(isStart, text = "PROCESSING...") {
        isProcessing = isStart; // Kunci status agar auto-sync tidak masuk
        document.getElementById('loading-text').innerText = text;
        document.getElementById('loading-global').style.display = isStart ? 'flex' : 'none';
    }

    window.refreshData = async function(isInitial = false) {
        try {
            const response = await fetch(SCRIPT_URL + "?action=getWAForm&ssId=" + CURRENT_SS_ID);
            localData = await response.json();
            
            document.getElementById('connectionStatus').innerText = "ONLINE";
            document.getElementById('connectionStatus').style.background = "#4caf50";
            document.getElementById('weddingTitle').innerText = localData.weddingTitle || "--";
            document.getElementById('masterToken').value = localData.masterToken || '';
            
            renderCategories(localData);
            renderTable();
        } catch (err) {
            document.getElementById('connectionStatus').innerText = "OFFLINE";
            document.getElementById('connectionStatus').style.background = "#cc0000";
        } finally {
            if(isInitial) toggleProcessing(false);
        }
    }

    window.renderCategories = function(data) {
        const select = document.getElementById('kategoriSelect');
        const counterEl = document.getElementById('statusCounter');
        const currentVal = select.value;
        
        const currentUsage = data.liveUsage || 0;
        const maxSlots = 3;
        if (counterEl) {
            counterEl.innerText = `[${currentUsage}/${maxSlots}]`;
            counterEl.style.color = currentUsage >= maxSlots ? "#ff4d4d" : "#d4af37";
        }

        select.innerHTML = '<option value="">-- PILIH KATEGORI --</option>';
        data.categories.forEach(c => {
            if(c.kategori) {
                const opt = document.createElement('option');
                opt.value = c.kategori;
                opt.textContent = c.kategori;
                select.appendChild(opt);
            }
        });

        if(currentVal) select.value = currentVal;
        updateClientView();
    };

    function renderTable() {
        const tbody = document.getElementById('tamuTable');
        tbody.innerHTML = localData.tamu.length ? localData.tamu.map(t => `
            <tr>
                <td><b>${t.nama}</b></td>
                <td style="color:#666; font-size:12px;">${t.kategori}</td>
                <td style="text-align:right; font-weight:bold; color:${t.status.includes('✅') ? '#4caf50' : '#d4af37'}">
                    ${t.status}
                </td>
            </tr>
        `).join('') : '<tr><td colspan="3" style="text-align:center;">Data Kosong</td></tr>';
        document.getElementById('countTamu').innerText = localData.tamu.length;
    }

    window.updateClientView = function() {
        const selectedKat = document.getElementById('kategoriSelect').value;
        const found = localData.categories.find(c => c.kategori === selectedKat);
        
        const statusInd = document.getElementById('statusIndicator');
        const btnBlast = document.getElementById('btnBlastAction');
        const toggle = document.getElementById('statusToggle');

        if (found) {
            document.getElementById('clientPhone').value = found.nomor || "";
            document.getElementById('displayToken').value = (found.token && found.token !== "-") ? found.token : "";
            const isConnect = found.statusConnect === "connect";
            toggle.checked = isConnect;

            if (isConnect) {
                btnBlast.disabled = false;
                btnBlast.className = "st-btn btn-gold"; 
            } else {
                btnBlast.disabled = true;
                btnBlast.className = "st-btn btn-disabled";
            }
        } else {
            document.getElementById('clientPhone').value = "";
            document.getElementById('displayToken').value = "";
            toggle.checked = false;
            statusInd.innerText = "OFFLINE";
            statusInd.style.background = "#f5f5f5";
            btnBlast.disabled = true;
        }
    };

    window.saveMasterToken = async function() {
        const tokenEl = document.getElementById('masterToken');
        const token = tokenEl.value.trim(); 
        
        if (!token) {
            showToast("⚠️ Token tidak boleh kosong!");
            return;
        }

        toggleProcessing(true, "SAVING MASTER TOKEN...");
        
        try {
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "cors", 
                cache: "no-cache",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8",
                },
                body: JSON.stringify({
                    action: "saveMasterToken",
                    ssId: CURRENT_SS_ID,
                    token: token
                })
            });
            
            const result = await response.json();
            
            if (result.status === "success") {
                showToast("✅ Token Master berhasil disimpan!");
                await refreshData();
            } else {
                showToast("❌ Gagal: " + (result.msg || "Terjadi kesalahan sistem"));
            }
        } catch (e) {
            showToast("❌ Gagal terhubung ke server.");
            console.error("SaveMasterToken Error:", e);
        } finally {
            toggleProcessing(false);
        }
    };

    window.manualStatusUpdate = async function() {
        const kat = document.getElementById('kategoriSelect').value;
        const isChecked = document.getElementById('statusToggle').checked;
        const newStatus = isChecked ? "connect" : "disconnect";

        if(!kat) {
            showToast("⚠️ Pilih kategori dulu!");
            document.getElementById('statusToggle').checked = !isChecked;
            return;
        }

        toggleProcessing(true, "UPDATING STATUS...");
        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "toggleStatus", ssId: CURRENT_SS_ID, kategori: kat, status: newStatus })
            });
            await refreshData();
            showToast("✅ Status berhasil diperbarui");
        } catch (e) { showToast("❌ Gagal update status."); }
        finally { toggleProcessing(false); }
    };

    window.remoteSyncDevice = async function() {
        const kat = document.getElementById('kategoriSelect').value;
        const phone = document.getElementById('clientPhone').value;
        if(!kat || !phone) return showToast("⚠️ Data tidak lengkap!");

        toggleProcessing(true, "SYNCING DEVICE...");
        try {
            const res = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "remoteFonnte", ssId: CURRENT_SS_ID, kategori: kat, targetNumber: phone })
            });
            const result = await res.json();
            if (result.status === "success") {
                showToast("✅ Berhasil! Silahkan Scan QR.");
                window.open("https://md.fonnte.com/new/device.php", "_blank");
                await refreshData();
            } else { showToast("❌ Gagal: " + result.msg); }
        } catch (e) { showToast("❌ Error koneksi."); }
        finally { toggleProcessing(false); }
    };

    window.executeMassBlast = async function() {
        const kat = document.getElementById('kategoriSelect').value;
        const token = document.getElementById('displayToken').value;
        
        const meta = {
            pengantin: localData.weddingTitle || "Kedua Mempelai",
            hariTanggal: localData.hariTanggal || "",
            lokasi: localData.lokasiAcara || "",
            linkBase: localData.linkInvitation || "",
            detailWaktu: "Akad: 08.00 / Resepsi: 10.30" 
        };

        const targets = localData.tamu.filter(t => t.kategori === kat && !t.status.includes('✅'));

        if(!targets.length) return showToast("□ Semua tamu sudah terkirim!");
        if(!confirm(`Kirim undangan untuk ${targets.length} tamu?`)) return;

        toggleProcessing(true, "BLASTING MESSAGES...");

        const payload = targets.map(t => {
            const encodedName = encodeURIComponent(t.nama);
            const inviteLink = `${meta.linkBase}?id=${t.kode}&u=${encodedName}`;
            const qrLink = `https://api.qrserver.com/v1/create-qr-code/?data=${t.kode}&size=400x400`;

            return {
                row: t.row, 
                target: t.nomor, 
                token: token,
                message: `Kepada Yth. Bapak/Ibu/Saudara/i\n*${t.nama.toUpperCase()}*\n\nTanpa mengurangi rasa hormat, perkenankan kami mengundang Anda untuk menghadiri acara kami.\n*Tepat pada pukul [${t.sesi || "Sesuai Jadwal"}]*\n\n*${meta.pengantin}*\n▫️ ${meta.hariTanggal}\n▫️ ${meta.detailWaktu}\n▫️ Lokasi: ${meta.lokasi}\n\nInformasi lengkap mengenai jadwal, lokasi, dan kartu akses digital dapat diakses melalui tautan berikut:\n${inviteLink}\n\n*Mohon simpan QR Code di bawah untuk ditunjukkan saat memasuki area acara:*\n${qrLink}\n\nMerupakan suatu kehormatan bagi kami apabila Anda berkenan hadir. Terima kasih.`
            };
        });

        try {
            const res = await fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ 
                    action: "executeFonnteBlast", 
                    ssId: CURRENT_SS_ID, 
                    payload: payload 
                })
            });
            const result = await res.json();
            
            if(result.status === "success") {
                showToast(`✅ Berhasil mengirim ${result.sent} pesan!`);
            } else {
                showToast("❌ Gagal mengirim pesan.");
            }
            
            // Memastikan dashboard terupdate dengan tanda centang (✅) terbaru
            await refreshData(); 
        } catch (e) { 
            showToast("❌ Error koneksi saat blasting."); 
        } finally { 
            toggleProcessing(false); 
        }
    };
    // INIT & AUTO SYNC
    refreshData(true);
    
    // Auto-sync hanya jika tidak sedang memproses aksi manual
    setInterval(() => { 
        // CEK: Jangan refresh jika sedang BLAST atau sedang ada MODAL popup
        const isModalOpen = document.getElementById('st-modal').style.display === 'flex';
        
        if (!isProcessing && !isModalOpen && document.visibilityState === 'visible') { 
            refreshData(); 
        } 
    }, 15000); // 15 detik sudah cukup ideal untuk pengawasan
})();
</script>
</body>
</html>
