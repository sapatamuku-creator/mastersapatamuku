<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sapatamu Lucky Draw Console - V10.2 Official</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root { 
            --gold: #d4af37; --dark: #1a1a1a; --success: #2ed573; 
            --danger: #ff4757; --light: #f4f7f6; --soft-gold: #fffcf5;
            --brand-warm: #e67e22;
        }

        /* Hide Weebly Elements */
        #weebly-footer-signup-container, .weebly-footer, .w-footer, [class*="weebly-"] { 
            display: none !important; visibility: hidden !important; opacity: 0 !important; height: 0 !important; 
        }

        body { 
            margin: 0; font-family: 'Montserrat', sans-serif; 
            background: var(--light); color: var(--dark); 
            height: 100vh; overflow-x: hidden;
        }

        .main-container { 
            height: 100vh; overflow-y: auto; 
            padding: 20px 15px 120px; 
            display: flex; flex-direction: column; gap: 20px; box-sizing: border-box;
        }

        .section-panel { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        
        .monitor-bar { display: flex; justify-content: space-around; padding: 5px 0; }
        .stat-item { text-align: center; }
        .stat-label { font-size: 8px; font-weight: 800; color: #aaa; text-transform: uppercase; display: block; }
        .stat-value { font-size: 20px; font-weight: 900; color: var(--dark); }

        .spin-box { background: var(--dark); border-radius: 24px; padding: 30px 20px; text-align: center; color: white; position: relative; box-shadow: 0 15px 30px rgba(0,0,0,0.2); }
        .spin-code { font-family: 'Quicksand', sans-serif; font-size: 42px; font-weight: 700; color: var(--gold); letter-spacing: 3px; min-height: 60px; margin: 10px 0; text-shadow: 0 0 20px rgba(212,175,55,0.4); }
        .winner-name { font-size: 18px; font-weight: 600; opacity: 0; transition: 0.5s; text-transform: uppercase; color: #fff; min-height: 24px; }
        .winner-name.show { opacity: 1; }

        .btn-primary { width: 100%; padding: 16px; border-radius: 15px; border: none; background: var(--gold); color: white; font-weight: 900; font-size: 14px; letter-spacing: 2px; cursor: pointer; box-shadow: 0 8px 20px rgba(212,175,55,0.3); transition: transform 0.1s; }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { background: #444; box-shadow: none; opacity: 0.7; }

        .scanner-section { border: 2px solid var(--gold); background: var(--soft-gold); }
        .scanner-wrapper { width: 100%; max-width: 200px; aspect-ratio: 1; margin: 0 auto 15px; border-radius: 20px; overflow: hidden; border: 2px solid var(--gold); background: #000; position: relative; }
        
        .manual-input-box { display: flex; gap: 8px; margin-top: 10px; }
        .input-text { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-family: 'Quicksand', sans-serif; font-weight: 700; text-transform: uppercase; font-size: 12px; }
        .btn-check { padding: 0 15px; background: var(--dark); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 10px; cursor: pointer; }

        .list-section { background: white; border-radius: 20px; overflow: hidden; border: 1px solid #eee; min-height: 200px; }
        .list-header { padding: 12px 15px; background: #fafafa; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .winner-item { padding: 12px 15px; border-bottom: 1px solid #f9f9f9; display: flex; align-items: center; gap: 12px; }
        .winner-info { flex: 1; }
        .winner-main { font-weight: 700; font-size: 12px; }
        .winner-sub { font-size: 8px; color: #999; font-weight: 600; }
        .badge-done { font-size: 7px; font-weight: 900; background: #e8faf0; color: var(--success); padding: 4px 8px; border-radius: 5px; }

        .action-fab {
            position: fixed; bottom: 25px; width: 45px; height: 45px;
            background: rgba(26, 26, 26, 0.8); backdrop-filter: blur(5px);
            color: white; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; cursor: pointer; z-index: 10000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .fullscreen-btn { right: 25px; }
        .logout-btn { right: 80px; color: var(--danger); }
        .action-fab:hover { transform: scale(1.1); background: var(--dark); }
        .action-fab svg { width: 20px; height: 20px; fill: currentColor; }

        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.95); z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .winner-glow { animation: glow 0.5s ease-in-out infinite alternate; color: white !important; }
        @keyframes glow { from { text-shadow: 0 0 10px var(--gold); } to { text-shadow: 0 0 30px var(--gold); } }
        
        #scan-result-card { border: 2px solid var(--success); background: #f0fff4; margin-top: 10px; }
        #camera-error { display: none; padding: 10px; background: var(--danger); color: white; font-size: 9px; border-radius: 10px; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body id="app-body">

<div id="loading" class="loading-overlay">
    <div style="width:40px; height:40px; border:4px solid #eee; border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite;"></div>
    <p style="font-size:10px; font-weight:900; letter-spacing:1px; margin-top:15px;">MENYINKRONKAN DATABASE...</p>
</div>

<div class="action-fab logout-btn" onclick="logout()" title="Keluar">
    <svg viewBox="0 0 24 24"><path d="M16 13v-2H7V9l-5 3 5 3v-2h9zM20 3H9c-1.1 0-2 .9-2 2v4h2V5h11v14H9v-4H7v4c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
</div>

<div class="action-fab fullscreen-btn" onclick="toggleFullScreen()" title="Toggle Fullscreen">
    <svg id="fs-icon" viewBox="0 0 24 24">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
    </svg>
</div>

<div class="main-container">
    <div style="text-align: center; margin-bottom: -10px;">
        <span id="user-display" style="font-size: 10px; font-weight: 800; color: #bbb; text-transform: uppercase;">MEMUAT SESI...</span>
    </div>

    <div class="section-panel" style="background: var(--soft-gold); border: 1px solid var(--gold);">
        <div class="monitor-bar">
            <div class="stat-item">
                <span class="stat-label">Tamu Hadir</span>
                <span class="stat-value" id="stat-total-hadir">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Pool Undian</span>
                <span class="stat-value" id="stat-valid" style="color:var(--success)">0</span>
            </div>
        </div>
    </div>

    <div class="spin-box">
        <div id="display-code" class="spin-code">000000</div>
        <div id="display-name" class="winner-name">SIAP DIUNDI</div>
        <div style="margin-top:30px;">
            <button id="btn-spin" onclick="runLuckyDraw()" class="btn-primary">PUTAR UNDIAN</button>
        </div>
    </div>

    <div class="section-panel scanner-section">
        <div style="font-size:10px; font-weight:800; color:var(--brand-warm); text-align:center; margin-bottom:15px; letter-spacing:1px;">SCAN QR ATAU INPUT KODE CLAIM</div>
        <div id="camera-error">Kamera bermasalah. Pastikan izin diberikan.</div>
        <div class="scanner-wrapper"><div id="qr-reader" style="width: 100%;"></div></div>
        <div class="manual-input-box">
            <input type="text" id="manual-code" class="input-text" placeholder="Ketik Kode (STK-xxx)">
            <button onclick="manualCheck()" class="btn-check">CEK DATA</button>
        </div>
        <div id="scan-result-card" style="display:none; padding: 15px; border-radius: 15px;">
            <div style="display:flex; align-items:center; gap:12px;">
                <div style="font-size:24px;">□</div>
                <div style="flex:1;">
                    <div id="res-name" style="font-weight:900; font-size:14px; color:#1b4332;">NAMA</div>
                    <div id="res-code" style="font-size:10px; font-weight:700; color:#52b788;">KODE</div>
                    <div id="res-status-label" style="font-size:9px; color:#666;">Status: -</div>
                </div>
            </div>
            <button id="confirm-btn" onclick="claimReward()" style="width:100%; margin-top:12px; padding:12px; background:var(--success); color:white; border:none; border-radius:10px; font-weight:800; cursor:pointer; font-size:11px;">KONFIRMASI PEMENANG</button>
            <button onclick="document.getElementById('scan-result-card').style.display='none'" style="width:100%; margin-top:8px; background:none; border:none; font-size:9px; font-weight:700; color:#999; cursor:pointer;">TUTUP</button>
        </div>
    </div>

    <div class="list-section">
        <div class="list-header">
            <span style="font-size:9px; font-weight:900; color:#bbb;">RIWAYAT PEMENANG</span>
            <span id="win-count" style="font-size:9px; font-weight:900; color:var(--gold);">0 PEMENANG</span>
        </div>
        <div id="winner-history-list"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzIfY3HDb7qF-zpgKX_86g2cK6wm_J1-9IdjDDC_He0pmx_qPGTSiZCoQPyiRClZzBm/exec"; 

    
    let masterData = [];
    let isSpinning = false;
    let html5QrScanner = null;
    let lastScannedGuest = null;

    const getActiveSession = () => {
        const session = sessionStorage.getItem('sapatamu_session') || localStorage.getItem('sapatamu_db');
        return session ? JSON.parse(session) : null;
    };

    window.logout = function() {
        if(confirm("Apakah Anda yakin ingin keluar?")) {
            sessionStorage.removeItem('sapatamu_session');
            window.location.href = "login.html";
        }
    };

    window.toggleFullScreen = function() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
            document.getElementById('fs-icon').innerHTML = '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>';
        } else {
            document.exitFullscreen();
            document.getElementById('fs-icon').innerHTML = '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>';
        }
    };

    async function refreshData(showLoader = false) {
        const session = getActiveSession();
        if(!session || !session.ssId) {
            window.location.href = "login.html";
            return;
        }

        document.getElementById('user-display').innerText = "CLIENT: " + (session.username || session.clientName || "USER");

        if(showLoader) document.getElementById('loading').style.display = 'flex';
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: "get_master_data",
                    ssId: session.ssId 
                })
            });
            const data = await response.json();
            if(data && data.guestList) {
                masterData = data.guestList;
                updatePoolStats();
                renderWinnerHistory(); 
            }
        } catch (e) { 
            console.error("Sinkron gagal:", e); 
        } finally { 
            if(showLoader) document.getElementById('loading').style.display = 'none'; 
        }
    }

    function updatePoolStats() {
        const hadir = masterData.filter(g => {
            const val = String(g.statusHadir || g.jamDatang || "").trim();
            return val === "1" || (val !== "-" && val !== "");
        }); 
        
        const valid = hadir.filter(g => {
            const hadiah = String(g.statusHadiah || "").trim();
            return hadiah === "-" || hadiah === "";
        }); 
        
        document.getElementById('stat-total-hadir').innerText = hadir.length;
        document.getElementById('stat-valid').innerText = valid.length;
    }

    function renderWinnerHistory() {
        const container = document.getElementById('winner-history-list');
        container.innerHTML = "";
        const winners = masterData.filter(g => {
            const hadiah = String(g.statusHadiah || "").trim();
            return hadiah !== "-" && hadiah !== "";
        });
        
        winners.forEach(g => {
            const html = `<div class="winner-item">
                <div class="winner-info">
                    <div class="winner-main">${g.nama}</div>
                    <div class="winner-sub">${g.kode} • Hadiah: ${g.statusHadiah}</div>
                </div>
                <span class="badge-done">LUCKY WINNER</span>
            </div>`;
            container.insertAdjacentHTML('beforeend', html);
        });
        document.getElementById('win-count').innerText = winners.length + " PEMENANG";
    }

    window.runLuckyDraw = function() {
        if(isSpinning) return;
        
        const validCandidates = masterData.filter(g => {
            const isHadir = String(g.statusHadir || g.jamDatang || "").trim() !== "-" && String(g.statusHadir || g.jamDatang || "").trim() !== "";
            const isNoGift = String(g.statusHadiah || "").trim() === "-" || String(g.statusHadiah || "").trim() === "";
            return isHadir && isNoGift;
        });
        
        if(validCandidates.length === 0) return alert("Tidak ada kandidat valid! Pastikan tamu sudah check-in dan belum menang.");
        
        isSpinning = true;
        const codeDiv = document.getElementById('display-code');
        const nameDiv = document.getElementById('display-name');
        const btn = document.getElementById('btn-spin');
        
        btn.disabled = true;
        codeDiv.classList.remove('winner-glow');
        nameDiv.classList.remove('show');

        let startTime = Date.now();
        const spinEffect = setInterval(() => {
            codeDiv.innerText = Math.random().toString(36).substr(2, 6).toUpperCase();
            
            if(Date.now() - startTime > 2500) {
                clearInterval(spinEffect);
                const winner = validCandidates[Math.floor(Math.random() * validCandidates.length)];
                
                codeDiv.innerText = winner.kode; 
                codeDiv.classList.add('winner-glow');
                nameDiv.innerText = winner.nama; 
                nameDiv.classList.add('show');
                
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.3 } });
                
                isSpinning = false;
                btn.disabled = false;
                
                document.getElementById('manual-code').value = winner.kode;
                manualCheck(); 
            }
        }, 50);
    };

    window.manualCheck = function() {
        const val = document.getElementById('manual-code').value.trim().toUpperCase();
        if(!val) return;
        
        const guest = masterData.find(g => String(g.kode).toUpperCase() === val);
        if(guest) {
            lastScannedGuest = guest;
            document.getElementById('res-name').innerText = guest.nama;
            document.getElementById('res-code').innerText = guest.kode;
            
            const isWinner = String(guest.statusHadiah || "").trim() !== "-" && String(guest.statusHadiah || "").trim() !== "";
            document.getElementById('res-status-label').innerText = "Status: " + (isWinner ? "SUDAH TERKLAIM (" + guest.statusHadiah + ")" : "Belum Konfirmasi");
            
            const btn = document.getElementById('confirm-btn');
            btn.disabled = isWinner;
            btn.style.background = isWinner ? "#ccc" : "var(--success)";
            btn.innerText = isWinner ? "DATA SUDAH TERKONFIRMASI" : "KONFIRMASI PEMENANG";
            
            document.getElementById('scan-result-card').style.display = 'block';
            document.getElementById('scan-result-card').scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else { 
            alert("Data kode tidak ditemukan."); 
        }
    };

    window.claimReward = async function() {
        const session = getActiveSession();
        if(!lastScannedGuest || !session) return;
        
        if(!confirm("Konfirmasi " + lastScannedGuest.nama + " sebagai pemenang?")) return;

        document.getElementById('loading').style.display = 'flex';
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: "claim_lucky_draw", 
                    kode: lastScannedGuest.kode,
                    ssId: session.ssId
                })
            });
            const result = await response.json();
            
            if(result.status === "success") {
                alert("Berhasil! Pemenang resmi dicatat di Spreadsheet.");
                document.getElementById('scan-result-card').style.display = 'none';
                document.getElementById('manual-code').value = "";
                await refreshData(true);
            } else {
                alert("Gagal: " + result.message);
                document.getElementById('loading').style.display = 'none';
            }
        } catch (e) {
            alert("Gangguan koneksi ke server.");
            document.getElementById('loading').style.display = 'none';
        }
    };

    async function initScanner() {
        if (html5QrScanner) { try { await html5QrScanner.clear(); } catch(e) {} }
        html5QrScanner = new Html5QrcodeScanner("qr-reader", { 
            fps: 10, 
            qrbox: 150, 
            aspectRatio: 1.0 
        });
        html5QrScanner.render((txt) => {
            document.getElementById('manual-code').value = txt;
            manualCheck();
        }, (err) => {
            if (err && String(err).includes("NotReadableError")) {
                document.getElementById('camera-error').style.display = 'block';
            }
        });
    }

    window.onload = () => {
        refreshData(true);
        setTimeout(initScanner, 1500);
        
        setInterval(() => {
            document.querySelectorAll('.weebly-footer, #weebly-footer-signup-container, [class*="weebly-"]').forEach(b => b.remove());
        }, 3000);
    };
</script>
</body>
</html>
