<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk Vendor Sortir — SapaTamu.ku</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="subdomain_resolver.js?v=1.6"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://app.midtrans.com/snap/snap.js"></script>
    <style>
        :root { 
            --primary: #E07B7B; /* Soft Rose */
            --bg: #FFF9F5;      /* Warm Cream */
            --card: #FFFFFF;
            --text-main: #4A3F35; 
            --text-muted: #8C7560;
            --border: #F0E6DE;
            --input-bg: #FDF8F4;
            --gold: #C8962E;
            --success: #10B981;
        }
        body { 
            margin: 0; padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main);
            min-height: 100vh;
        }
        .sapatamu-wrapper { 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; padding: 20px; box-sizing: border-box;
        }
        .sapatamu-card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(20px); 
            width: 100%; max-width: 400px; 
            padding: 40px; border-radius: 24px; 
            box-shadow: 0 15px 50px rgba(224, 123, 123, 0.08); 
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .sapatamu-header { text-align: center; margin-bottom: 28px; }
        .sapatamu-header h2 { font-family: 'Lora', serif; font-size: 32px; color: var(--text-main); font-weight: 700; }
        .sapatamu-header p { color: var(--text-muted); font-size: 14px; margin-top: 8px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .sapatamu-input { 
            width: 100%; padding: 14px 18px; border: 1.5px solid var(--border); 
            border-radius: 12px; font-size: 15px; box-sizing: border-box; 
            transition: all 0.2s; background: var(--input-bg); color: var(--text-main);
        }
        .sapatamu-input:focus { outline: none; border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(224, 123, 123, 0.15); }
        
        .sapatamu-btn { 
            width: 100%; padding: 16px; background: var(--primary); color: white; 
            border: none; border-radius: 12px; font-weight: 700; font-size: 16px;
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; 
            transition: all 0.2s; box-shadow: 0 4px 15px rgba(224, 123, 123, 0.3);
        }
        .sapatamu-btn:hover { opacity: 0.95; transform: translateY(-1px); }
        
        .footer-link { text-align: center; margin-top: 24px; font-size: 14px; color: var(--text-muted); }
        .clickable { color: var(--primary); cursor: pointer !important; font-weight: 700; text-decoration: none; }
        .clickable:hover { text-decoration: underline; }
        
        .alert-box {
            padding: 12px 16px; border-radius: 12px; font-size: 13px; margin-bottom: 20px; line-height: 1.5;
            display: none;
        }
        .alert-error { background: #fee2e2; border: 1px solid #fca5a5; color: #b91c1c; }
        .alert-success { background: #d1fae5; border: 1px solid #6ee7b7; color: #065f46; }
        .alert-warning { background: #fef3c7; border: 1px solid #fcd34d; color: #92400e; }

        .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-bottom-color: white; border-radius: 50%; animation: rotation 0.8s linear infinite; }
        @keyframes rotation { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="sapatamu-wrapper">
    <div class="sapatamu-card">
        <div class="sapatamu-header">
            <h2>Masuk Vendor</h2>
            <p>Kelola sortir foto klien SapaTamu Sortir.</p>
        </div>

        <div id="alert-message" class="alert-box"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <!-- Username / Email -->
            <div class="form-group">
                <label>Username atau Email Login</label>
                <input type="text" id="login-identifier" class="sapatamu-input" placeholder="Masukkan username atau email Anda" required>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="sapatamu-input" placeholder="Masukkan password Anda" required>
            </div>

            <button type="submit" id="btn-submit" class="sapatamu-btn">
                <span>Masuk Sekarang</span>
            </button>
        </form>

        <div class="footer-link">
            Belum punya akun? <a href="/sortir_register.html" class="clickable">Daftar sekarang</a>
        </div>
    </div>
</div>

<script>
    const SB_URL = "https://llrapesaaoliyjrrrsjh.supabase.co";
    const SB_KEY = "sb_publishable_414hQDyPBaFi0fnzmIKyZw_Iwa09Q0u";
    const supabase = window.supabase.createClient(SB_URL, SB_KEY);

    // Parse URL params for notifications
    window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const alertEl = document.getElementById('alert-message');
        
        if (urlParams.get('checkout') === 'success') {
            showAlert("✅ Pembayaran Berhasil! Silakan masuk menggunakan email dan password terdaftar.", "alert-success");
        } else if (urlParams.get('checkout') === 'pending') {
            showAlert("⏳ Pembayaran Anda Tertunda. Akun akan aktif otomatis setelah pembayaran Anda diselesaikan.", "alert-warning");
        } else if (urlParams.get('checkout') === 'cancel') {
            showAlert("⚠️ Pendaftaran belum selesai karena pembayaran dibatalkan.", "alert-warning");
        } else if (urlParams.get('kickout') === 'true') {
            showAlert("🔒 Sesi Anda telah berakhir karena akun terdeteksi digunakan di perangkat/tab lain. Silakan login kembali.", "alert-error");
        }
    });

    function showAlert(msg, className) {
        const alertEl = document.getElementById('alert-message');
        alertEl.innerText = msg;
        alertEl.className = `alert-box ${className}`;
        alertEl.style.display = 'block';
    }

    // Helper to generate UUID session token
    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    async function handleLogin(e) {
        e.preventDefault();
        const identifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('password').value.trim();

        const btn = document.getElementById('btn-submit');
        const btnSpan = btn.querySelector('span');

        btn.disabled = true;
        btnSpan.innerHTML = '<span class="spin"></span> Memverifikasi...';
        
        const alertEl = document.getElementById('alert-message');
        alertEl.style.display = 'none';

        try {
            let email = identifier;

            // Check if user input is an email, if not, resolve via username API
            if (!identifier.includes('@')) {
                btnSpan.innerHTML = '<span class="spin"></span> Mencari Username...';
                showAlert('🔍 [Debug Step 1] Mencari email dari username...', 'alert-warning');
                const resolveRes = await fetch('/api/sortir-get-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: identifier })
                });

                if (!resolveRes.ok) {
                    const errData = await resolveRes.json();
                    throw new Error(errData.error || "Username tidak ditemukan.");
                }

                const resolveData = await resolveRes.json();
                email = resolveData.email;
                showAlert('✅ [Debug Step 1] Email ditemukan: ' + email, 'alert-success');
                btnSpan.innerHTML = '<span class="spin"></span> Memverifikasi...';
            }

            // 1. Sign in with Supabase Auth
            showAlert('🔍 [Debug Step 2] Mencoba Supabase Auth signIn...', 'alert-warning');
            const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                email,
                password
            });

            if (authError) throw authError;

            const userId = authData.user.id;
            showAlert('✅ [Debug Step 2] Auth OK! User ID: ' + userId, 'alert-success');

            // 2. Fetch vendor profile from sortir_vendors
            showAlert('🔍 [Debug Step 3] Fetching vendor profile...', 'alert-warning');
            const { data: vendors, error: vendorError } = await supabase
                .from('sortir_vendors')
                .select('*')
                .eq('id', userId);

            if (vendorError) throw vendorError;

            if (!vendors || vendors.length === 0) {
                showAlert('❌ [Debug Step 3] Vendor KOSONG! userId: ' + userId, 'alert-error');
                throw new Error("Profil vendor tidak ditemukan. Pastikan pendaftaran selesai.");
            }

            const vendor = vendors[0];
            showAlert('✅ [Debug Step 3] Vendor OK! is_active: ' + vendor.is_active + ', expiry: ' + vendor.subscription_expires_at, 'alert-success');

            // 3. Verify if active and subscription not expired
            const now = new Date();
            const expiry = vendor.subscription_expires_at ? new Date(vendor.subscription_expires_at) : null;

            if (!vendor.is_active || (expiry && expiry < now)) {
                // If inactive, trigger Midtrans SNAP transaction again to allow renewal/activation
                showAlert("⚠️ Akun Anda belum aktif / masa aktif langganan habis. Menyiapkan invoice...", "alert-warning");
                
                // Call create-payment API to get a new Snap Token
                const payRes = await fetch('/api/sortir-create-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: vendor.id,
                        username: vendor.username,
                        vendorName: vendor.vendor_name,
                        whatsappAdmin: vendor.whatsapp_admin,
                        emailRecovery: vendor.email_recovery,
                        billingCycle: vendor.billing_cycle || 'monthly'
                    })
                });

                if (!payRes.ok) {
                    const payErr = await payRes.json();
                    throw new Error(payErr.error || "Gagal menginisiasi pembayaran ulang");
                }

                const paymentData = await payRes.json();

                // Open Midtrans Snap modal
                snap.pay(paymentData.token, {
                    onSuccess: function(result) {
                        window.location.replace('/sortir_login.html?checkout=success');
                    },
                    onPending: function(result) {
                        window.location.replace('/sortir_login.html?checkout=pending');
                    },
                    onError: function(result) {
                        showAlert("❌ Pembayaran gagal. Harap coba kembali.", "alert-error");
                        btn.disabled = false;
                        btnSpan.innerText = "Masuk Sekarang";
                    }
                });
                return;
            }

            // 4. Update session token for concurrent tab protection
            const sessionToken = generateUUID();
            localStorage.setItem('sortir_session_token', sessionToken);
            
            // Save vendor info in localStorage
            localStorage.setItem('sortir_vendor_session', JSON.stringify({
                id: vendor.id,
                username: vendor.username,
                vendor_name: vendor.vendor_name,
                email: email
            }));

            // Update session token on DB (non-blocking — don't fail login if this fails)
            supabase
                .from('sortir_vendors')
                .update({ active_session_token: sessionToken })
                .eq('id', userId)
                .then(({ error }) => {
                    if (error) console.warn('Session token update failed (non-critical):', error.message);
                });

            // 5. Redirect to Dashboard
            showAlert('✅ [Debug Step 4] Semua OK, redirecting ke dashboard...', 'alert-success');
            setTimeout(() => window.location.replace('/sortir_dashboard.html'), 1500);

        } catch (err) {
            showAlert("❌ Error: " + err.message, "alert-error");
            btn.disabled = false;
            btnSpan.innerText = "Masuk Sekarang";
        }
    }
</script>
</body>
</html>
