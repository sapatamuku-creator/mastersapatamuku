<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#C8962E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SapaTamu.ku - Reset Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    
    <style>
        :root { 
            --primary: #E07B7B; 
            --bg: #FFF9F5;      
            --card: #FFFFFF;
            --text-main: #4A3F35; 
            --text-muted: #8C7560;
            --border: #F0E6DE;
            --input-bg: #FDF8F4;
        }
        body { 
            margin: 0; padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .sapatamu-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(74, 63, 53, 0.05);
            padding: 40px;
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        .sapatamu-title {
            font-family: 'Lora', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .sapatamu-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .sapatamu-input { 
            width: 100%; padding: 15px; border-radius: 12px; border: 1.5px solid var(--border); 
            background: var(--input-bg); color: var(--text-main); font-size: 14px;
            transition: all 0.3s ease; box-sizing: border-box; text-align: left;
        }
        .sapatamu-input:focus { outline: none; border-color: var(--primary); background: #FFF; box-shadow: 0 0 0 3px rgba(224, 123, 123, 0.1); }
        
        .sapatamu-btn { 
            width: 100%; padding: 15px; background: var(--primary); color: white; 
            border: none; border-radius: 12px; font-weight: 700; font-size: 15px;
            cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 15px;
        }
        .sapatamu-btn:hover { background: #d06a6a; transform: translateY(-1px); }
        .sapatamu-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        
        .loader { width: 20px; height: 20px; border: 3px solid rgba(255, 255, 255, 0.3); border-bottom-color: transparent; border-radius: 50%; display: none; animation: rotation 0.8s linear infinite; }
        @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* CUSTOM NOTIFICATION MODAL */
        #sapa-notify-modal { position: fixed; inset: 0; background: rgba(74, 63, 53, 0.4); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 9999999; }
        .sapa-modal-content { background: #fff; width: 90%; max-width: 400px; border-radius: 35px; padding: 50px 40px; text-align: center; box-shadow: 0 30px 60px rgba(74, 63, 53, 0.2); border: 1px solid var(--border); animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .sapa-modal-title { font-family: 'Lora', serif; font-size: 24px; font-weight: 700; color: var(--text-main); margin-bottom: 15px; }
        .sapa-modal-msg { font-size: 15px; color: var(--text-muted); line-height: 1.6; margin-bottom: 35px; }
        @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <!-- NOTIFICATION MODAL -->
    <div id="sapa-notify-modal">
        <div class="sapa-modal-content">
            <div id="notify-icon" style="font-size: 50px; margin-bottom: 25px;">✨</div>
            <h2 id="notify-title" class="sapa-modal-title">Pesan</h2>
            <p id="notify-msg" class="sapa-modal-msg">Pesan notifikasi akan muncul di sini.</p>
            <button onclick="closeSapaModal()" class="sapatamu-btn" style="padding: 15px; border-radius: 15px; font-size: 11px; background: var(--text-main); width: 100%;">MENGERTI</button>
        </div>
    </div>

    <!-- MAIN CARD -->
    <div class="sapatamu-card" id="mainCard">
        <h1 class="sapatamu-title">Reset Password</h1>
        <p class="sapatamu-subtitle">Silakan masukkan password baru Anda.</p>

        <div class="text-left mb-4">
            <label class="block text-xs font-bold mb-2">Password Baru</label>
            <input type="password" id="newPass" class="sapatamu-input" placeholder="Masukkan password baru">
        </div>
        
        <div class="text-left mb-6">
            <label class="block text-xs font-bold mb-2">Konfirmasi Password Baru</label>
            <input type="password" id="confirmPass" class="sapatamu-input" placeholder="Ulangi password baru">
        </div>

        <button onclick="prosesReset()" id="btn_reset" class="sapatamu-btn">
            <span id="text_reset">Simpan Password Baru</span>
            <span class="loader" id="load_reset"></span>
        </button>
        
        <div class="mt-6 text-sm text-gray-500">
            Kembali ke halaman <a href="login.html" class="text-[#E07B7B] font-bold hover:underline">Login</a>
        </div>
    </div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5zBOJIO-b0MP-oqWhIUehqQaPbQt5pK9cMpTOYlj1pyT19LFD4VwynyJt_EAayBE/exec";

    function showSapaModal(title, msg, icon = "✨") {
        document.getElementById('notify-title').innerText = title;
        document.getElementById('notify-msg').innerText = msg;
        document.getElementById('notify-icon').innerText = icon;
        document.getElementById('sapa-notify-modal').style.display = 'flex';
    }

    function closeSapaModal() {
        document.getElementById('sapa-notify-modal').style.display = 'none';
        if (window.redirectAfterModal) {
            window.location.href = window.redirectAfterModal;
        }
    }

    function setLoading(btnId, isLoad) {
        const btn = document.getElementById(btnId);
        const text = document.getElementById(btnId.replace('btn', 'text'));
        const load = document.getElementById(btnId.replace('btn', 'load'));
        if (btn) btn.disabled = isLoad;
        if (text) text.style.display = isLoad ? 'none' : 'block';
        if (load) load.style.display = isLoad ? 'block' : 'none';
    }

    async function prosesReset() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (!token) {
            return showSapaModal("Token Tidak Valid", "Tautan reset password ini tidak valid atau tidak lengkap. Silakan minta ulang dari halaman login.", "⚠️");
        }
        
        const p1 = document.getElementById('newPass').value;
        const p2 = document.getElementById('confirmPass').value;

        if (!p1 || !p2) return showSapaModal("Data Kosong", "Isi kedua kolom password.", "⚠️ ");
        if (p1 !== p2) return showSapaModal("Tidak Cocok", "Konfirmasi password tidak cocok.", "❌");
        if (p1.length < 6) return showSapaModal("Password Lemah", "Password minimal 6 karakter.", "⚠️ ");

        setLoading('btn_reset', true);
        try {
            const response = await fetch(SCRIPT_URL, {
                method: "POST", mode: "cors", redirect: "follow",
                body: JSON.stringify({ action: "resetPasswordWithToken", token: token, newPass: p1 })
            });
            const res = await response.json();
            
            if (res.status === "success") {
                window.redirectAfterModal = 'login.html';
                showSapaModal("Berhasil!", "Password Anda berhasil diubah. Silakan login kembali dengan password baru.", "✅");
            } else {
                showSapaModal("Gagal", res.message, "❌");
            }
        } catch (e) {
            showSapaModal("Error", "Gagal menghubungi server. Coba beberapa saat lagi.", "⚠️ ");
        }
        setLoading('btn_reset', false);
    }
</script>
<script src="offline-db.js"></script>
<script src="sync-engine.js"></script>
<script>
(function(){
    if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
    window.addEventListener('online',function(){document.body.classList.remove('is-offline');});
    window.addEventListener('offline',function(){document.body.classList.add('is-offline');});
})();
</script>
<style>
.is-offline::before{content:'⚠️ OFFLINE — Data tersimpan lokal';position:fixed;top:0;left:0;right:0;z-index:99999;background:#FEE2E2;color:#991B1B;text-align:center;padding:6px;font-size:10px;font-weight:700;}
@media(min-width:1024px){.is-offline::before{display:none;}}
</style>
</body>
</html>
