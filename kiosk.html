<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SapaTamu - Self Check-in Kiosk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root { 
            --primary: #E07B7B; /* Rose */
            --bg: #FFF9F5;      /* Warm White */
            --text-main: #4A3F35; 
            --text-muted: #8C7560;
            --gold: #C8962E;
            --border: #F0E6DE;
            --success: #10B981;
        }
        body {
            background: #000;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        /* --- LAYOUT SCANNER FULL SCREEN --- */
        #scanner-wrapper { 
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000; z-index: 1;
        }
        #reader { width: 100% !important; height: 100% !important; }
        #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }

        .scan-overlay { 
            position: absolute; inset: 0; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 5; pointer-events: none; 
        }
        
        .scan-header {
            margin-bottom: 40px; text-align: center; color: white;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        .scan-header h1 { font-family: 'Lora', serif; font-size: 3rem; letter-spacing: 3px; font-weight: 700; }
        .scan-header p { font-size: 1.2rem; opacity: 0.9; margin-top: 5px; font-weight: 300; }

        /* Frame Kotak Pindai */
        .scan-frame { 
            width: 350px; height: 350px; 
            box-shadow: 0 0 0 4000px rgba(0,0,0,0.5); /* Gelapkan area luar */
            position: relative; border-radius: 20px;
            transition: all 0.3s ease;
        }
        .corner { position: absolute; width: 50px; height: 50px; border-color: var(--primary); border-style: solid; transition: 0.3s; }
        .top-left { top: 0; left: 0; border-width: 8px 0 0 8px; border-top-left-radius: 20px; }
        .top-right { top: 0; right: 0; border-width: 8px 8px 0 0; border-top-right-radius: 20px; }
        .bottom-left { bottom: 0; left: 0; border-width: 0 0 8px 8px; border-bottom-left-radius: 20px; }
        .bottom-right { bottom: 0; right: 0; border-width: 0 8px 8px 0; border-bottom-right-radius: 20px; }

        .scan-frame.qr-detected .corner { border-color: var(--success); transform: scale(1.1); }

        /* --- MODAL FULL SCREEN --- */
        @keyframes slideUp {
            from { transform: translateY(100vh); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal-full {
            animation: slideUp 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .active-gift {
            border-color: var(--gold) !important;
            background: rgba(200,150,46,0.05) !important;
            color: var(--gold) !important;
            transform: scale(1.05);
        }

        .loading-overlay { 
            position: fixed; inset: 0; 
            background: rgba(255,249,245,0.95); 
            backdrop-filter: blur(10px); 
            z-index: 200000; 
            display: none; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
        }
        .spinner { width: 60px; height: 60px; border: 4px solid var(--border); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body onload="initApp()">

    <!-- Script Resolver Subdomain -->
    <script src="subdomain_resolver.js?v=3.2"></script>

    <!-- AREA SCANNER -->
    <div id="scanner-wrapper">
        <div id="reader"></div>
        <div class="scan-overlay">
            <div class="scan-header">
                <h1>SCAN QR CODE</h1>
                <p>Arahkan layar HP Anda ke area kotak</p>
            </div>
            <div class="scan-frame" id="target-frame">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>
            </div>
        </div>
    </div>

    <!-- MODAL KONFIRMASI FULL LAYAR -->
    <div id="kiosk-modal" class="hidden fixed inset-0 bg-[#FFFDFB] z-50 flex flex-col items-center justify-center modal-full">
        <p class="text-2xl md:text-3xl text-[#8C7560] font-serif italic mb-4">Welcome,</p>
        <h2 id="guest-name" class="text-5xl md:text-7xl font-serif text-[#4A3F35] font-bold text-center px-10 mb-6 uppercase tracking-wide">NAMA TAMU</h2>
        
        <p id="guest-category" class="text-xl md:text-2xl text-[#C8962E] font-bold tracking-widest uppercase mb-16">KATEGORI</p>

        <!-- Steppers and Toggles Grid -->
        <div class="flex flex-wrap items-center justify-center gap-10 md:gap-20 mb-16">
            <!-- Dewasa -->
            <div class="flex items-center gap-5">
                <button onclick="updatePax('adult', -1)" class="w-14 h-14 rounded-full bg-[#F0E6DE] text-[#4A3F35] text-3xl font-bold flex items-center justify-center hover:bg-[#E07B7B] hover:text-white transition-colors">-</button>
                <div class="text-center w-28">
                    <div id="m-pax-adult" class="text-5xl font-bold text-[#4A3F35]">1</div>
                    <div class="text-[12px] text-[#8C7560] uppercase tracking-widest font-bold mt-2">Person(s)</div>
                </div>
                <button onclick="updatePax('adult', 1)" class="w-14 h-14 rounded-full bg-[#4A3F35] text-white text-3xl font-bold flex items-center justify-center hover:bg-[#E07B7B] transition-colors">+</button>
            </div>

            <!-- Anak -->
            <div class="flex items-center gap-5">
                <button onclick="updatePax('child', -1)" class="w-14 h-14 rounded-full bg-[#F0E6DE] text-[#4A3F35] text-3xl font-bold flex items-center justify-center hover:bg-[#E07B7B] hover:text-white transition-colors">-</button>
                <div class="text-center w-28">
                    <div id="m-pax-child" class="text-5xl font-bold text-[#4A3F35]">0</div>
                    <div class="text-[12px] text-[#8C7560] uppercase tracking-widest font-bold mt-2">Kid(s)</div>
                </div>
                <button onclick="updatePax('child', 1)" class="w-14 h-14 rounded-full bg-[#4A3F35] text-white text-3xl font-bold flex items-center justify-center hover:bg-[#E07B7B] transition-colors">+</button>
            </div>
        </div>

        <!-- Toggles -->
        <div class="flex items-center justify-center gap-8 mb-20">
            <button id="btn-angpao" onclick="toggleGift('angpao')" class="flex items-center gap-4 px-10 py-5 rounded-full border-2 border-[#E5D7CA] text-[#8C7560] font-bold text-xl transition-all">
                <span class="text-3xl">✉️</span> Angpao
            </button>
            <button id="btn-kado" onclick="toggleGift('kado')" class="flex items-center gap-4 px-10 py-5 rounded-full border-2 border-[#E5D7CA] text-[#8C7560] font-bold text-xl transition-all">
                <span class="text-3xl">🎁</span> Kado
            </button>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-8">
            <button onclick="cancelCheckin()" class="px-12 py-6 rounded-full border-2 border-[#F0E6DE] text-[#8C7560] font-bold text-xl uppercase tracking-widest hover:bg-[#F0E6DE] transition-colors">
                BATAL
            </button>
            <button onclick="executeCheckin()" class="px-20 py-6 rounded-full bg-[#4A3F35] text-white font-bold text-xl uppercase tracking-widest hover:bg-[#E07B7B] shadow-2xl transition-all">
                CONTINUE
            </button>
        </div>
    </div>

    <!-- Modal Sukses Animasi -->
    <div id="success-modal" class="hidden fixed inset-0 bg-[#FFF9F5]/95 backdrop-blur-md z-[60] flex items-center justify-center">
        <div class="text-center scale-150 transform transition-all duration-500 opacity-0" id="success-content">
            <!-- Icon Checklist Hijau -->
            <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center shadow-[0_20px_50px_rgba(200,150,46,0.3)] mx-auto border-4 border-[#C8962E]">
                <svg class="w-16 h-16 text-[#C8962E]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3 class="text-4xl mt-10 font-serif text-[#4A3F35] font-bold tracking-wide">Check-in Berhasil</h3>
            <p class="text-[#C8962E] mt-4 text-sm tracking-[5px] uppercase font-extrabold">Silakan Masuk</p>
        </div>
    </div>

    <!-- Loading -->
    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <span class="text-[#E07B7B] mt-6 tracking-widest font-bold text-sm">MEMPROSES DATA...</span>
    </div>

    <script>
        let SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygBaFZE1n36jh8q7ZBICvmPcvVjvIjYKFmf-Gg5XS5F09Sr59SHTSymrLgOTuxcPDA/exec";
        let CURRENT_SS_ID = null;
        let masterData = [];
        let html5QrCode = null;
        let selectedGuest = null;

        async function initApp() {
            if (!window.SAPATAMU_RESOLVED) {
                setTimeout(initApp, 100);
                return;
            }
            
            const session = JSON.parse(sessionStorage.getItem('sapatamu_session')) || JSON.parse(localStorage.getItem('sapatamu_db'));
            CURRENT_SS_ID = window.CURRENT_SS_ID || (session ? session.ssId : null);
            
            if (!CURRENT_SS_ID) { window.location.href = "login.html"; return; }
            
            fetchData();
            initScanner();
        }

        async function fetchData() {
            try {
                const res = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: "get_master_data", ssId: CURRENT_SS_ID }) 
                });
                const data = await res.json();
                masterData = data.guestList || [];
            } catch (e) { console.error("Gagal load data tamu:", e); }
        }

        function initScanner() {
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            // Kiosk usually uses front facing camera if it's an iPad standing, but let's try 'user' or default 'environment'
            html5QrCode.start({ facingMode: "user" }, { fps: 15, qrbox: 350, aspectRatio: window.innerWidth/window.innerHeight }, onScanSuccess)
            .catch(e => {
                // Fallback to environment if user facing is not available
                html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 350, aspectRatio: window.innerWidth/window.innerHeight }, onScanSuccess).catch(console.error);
            });
        }

        function onScanSuccess(txt) {
            if (!document.getElementById('kiosk-modal').classList.contains('hidden')) return;
            if (!document.getElementById('success-modal').classList.contains('hidden')) return;

            const frame = document.getElementById('target-frame');
            let scCode = txt.trim();
            if (scCode.includes("id=")) scCode = scCode.split("id=")[1].split("&")[0];
            
            const guest = masterData.find(g => String(g.kode).trim().toUpperCase() === scCode.toUpperCase());
            
            if (guest) {
                frame.classList.add('qr-detected');
                if (String(guest.statusHadir) === "1") {
                    alert("Tamu '" + guest.nama + "' sudah melakukan check-in sebelumnya.");
                    setTimeout(() => frame.classList.remove('qr-detected'), 1500);
                } else {
                    setTimeout(() => {
                        frame.classList.remove('qr-detected');
                        openConfirm(guest);
                    }, 500);
                }
            } else {
                // Not found visual feedback
                document.querySelectorAll('.corner').forEach(c => c.style.borderColor = '#E07B7B');
                setTimeout(() => document.querySelectorAll('.corner').forEach(c => c.style.borderColor = 'var(--primary)'), 1000);
            }
        }

        function openConfirm(guest) {
            selectedGuest = guest;
            document.getElementById('guest-name').innerText = guest.nama;
            document.getElementById('guest-category').innerText = guest.kategori || 'UMUM';
            
            // Reset state
            const adult = parseInt(guest.rencanaHadir) || 1;
            document.getElementById('m-pax-adult').innerText = adult;
            document.getElementById('m-pax-child').innerText = "0";
            
            document.getElementById('btn-angpao').classList.remove('active-gift');
            document.getElementById('btn-kado').classList.remove('active-gift');

            document.getElementById('kiosk-modal').classList.remove('hidden');
            if (html5QrCode) html5QrCode.pause(true); 
        }

        function cancelCheckin() {
            document.getElementById('kiosk-modal').classList.add('hidden');
            selectedGuest = null;
            if (html5QrCode) html5QrCode.resume();
        }

        function updatePax(type, delta) {
            const el = document.getElementById('m-pax-' + type);
            let val = parseInt(el.innerText) + delta;
            if (type === 'adult' && val < 1) val = 1;
            if (type === 'child' && val < 0) val = 0;
            el.innerText = val;
        }

        function toggleGift(type) {
            const btn = document.getElementById('btn-' + type);
            btn.classList.toggle('active-gift');
        }

        async function executeCheckin() {
            if (!selectedGuest) return;
            
            const loading = document.getElementById('loading');
            loading.style.display = 'flex';
            
            const adult = document.getElementById('m-pax-adult').innerText;
            const child = document.getElementById('m-pax-child').innerText;
            const total = parseInt(adult) + parseInt(child);
            const paxString = `${total} ( ${adult}D + ${child}A )`;

            const isAngpao = document.getElementById('btn-angpao').classList.contains('active-gift');
            const isKado = document.getElementById('btn-kado').classList.contains('active-gift');
            const giftStatus = (isAngpao ? "ANGPAO " : "") + (isKado ? "KADO" : "");

            try {
                const res = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ 
                        action: "confirm_checkin", 
                        ssId: CURRENT_SS_ID, 
                        kodeUnik: selectedGuest.kode, 
                        realHadir: paxString, 
                        statusAngpao: giftStatus || "-" 
                    }) 
                });
                const result = await res.json();

                if (result.status === "success") {
                    document.getElementById('kiosk-modal').classList.add('hidden');
                    
                    // Show success animation
                    const successModal = document.getElementById('success-modal');
                    const successContent = document.getElementById('success-content');
                    successModal.classList.remove('hidden');
                    
                    // Trigger animation frame
                    setTimeout(() => {
                        successContent.style.opacity = '1';
                        successContent.style.transform = 'scale(1)';
                    }, 50);

                    // Blast WA Automation in background
                    if (result.triggerBlast) {
                        fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify({ 
                                action: "sendAutomationBlast", 
                                ssId: CURRENT_SS_ID, 
                                type: "checkin",
                                guestData: { nama: selectedGuest.nama, whatsapp: selectedGuest.whatsapp } 
                            })
                        }).catch(e => console.warn("Background blast failed:", e));
                    }

                    // Reset and update local list
                    selectedGuest.statusHadir = "1"; 
                    
                    // Auto close after 3 seconds
                    setTimeout(() => {
                        successContent.style.opacity = '0';
                        successContent.style.transform = 'scale(1.5)';
                        setTimeout(() => {
                            successModal.classList.add('hidden');
                            selectedGuest = null;
                            if (html5QrCode) html5QrCode.resume();
                        }, 500);
                    }, 3000);
                } else {
                    alert("Gagal Check-in: " + result.message);
                }
            } catch(e) { 
                alert("Koneksi Error!"); 
                console.error(e);
            } finally { 
                loading.style.display = 'none'; 
            }
        }
    </script>
</body>
</html>
