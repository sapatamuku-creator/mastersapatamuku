<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Jadi Vendor — Sapatamu.id</title>
  <meta name="description" content="Daftarkan bisnis wedding-mu di sapatamu.id. Jangkau ribuan calon pengantin di seluruh Indonesia. Gratis!">
  <link rel="canonical" href="https://sapatamu.id/menjadi-vendor">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/animations.css">

  <style>
    :root {
      --primary: #E07B7B;
      --primary-light: #F2B8B8;
      --primary-dark: #C45A5A;
      --gold: #C8962E;
      --text-main: #4A3F35;
      --text-light: #8A7E72;
      --text-muted: #B5ADA5;
      --bg: #FFFBF9;
      --bg-alt: #FFF5EE;
      --white: #FFFFFF;
      --border: rgba(200, 150, 46, 0.18);
      --shadow-sm: 0 1px 3px rgba(74, 63, 53, .06);
      --shadow-md: 0 4px 16px rgba(74, 63, 53, .08);
      --shadow-lg: 0 8px 32px rgba(74, 63, 53, .12);
      --radius: 20px;
      --radius-sm: 10px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
    }

    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 251, 249, .92); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border); height: 60px;
    }
    .navbar .container { display: flex; align-items: center; justify-content: space-between; height: 100%; max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .nav-logo { display: flex; align-items: center; gap: 8px; font-family: 'Lora', serif; font-size: 1.35rem; font-weight: 700; color: var(--text-main); text-decoration: none; }
    .nav-logo .ico { width: 32px; height: 32px; background: linear-gradient(135deg, var(--primary), var(--gold)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: .95rem; }
    .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; }
    .nav-links a { font-size: .88rem; font-weight: 500; color: var(--text-light); text-decoration: none; }
    .nav-links a:hover { color: var(--primary); }

    .hero { padding: 50px 20px 30px; text-align: center; }
    .hero h1 { font-family: 'Lora', serif; font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
    .hero p { color: var(--text-light); font-size: 1rem; max-width: 540px; margin: 0 auto; }

    .form-section { padding: 20px 20px 80px; }
    .form-card { max-width: 580px; margin: 0 auto; background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-lg); padding: 36px; }

    .form-title { font-family: 'Lora', serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; color: var(--text-main); text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: .83rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--bg); font-size: .9rem; color: var(--text-main); font-family: inherit; outline: none; transition: border-color .2s;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
    .form-group select:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-submit {
      width: 100%; padding: 14px; border-radius: 50px; font-weight: 700; font-size: .95rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; border: none; cursor: pointer;
      box-shadow: 0 4px 15px rgba(224, 123, 123, .3); transition: transform .2s ease; margin-top: 10px;
    }
    .btn-submit:hover { transform: translateY(-2px); }

    .toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 900;
      padding: 12px 20px; border-radius: 12px; font-size: .87rem; font-weight: 500;
      background: var(--text-main); color: #fff; box-shadow: var(--shadow-lg);
      transform: translateY(80px); opacity: 0; transition: all .3s ease;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: #059669; }
    .toast.error { background: #DC2626; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="/" class="nav-logo"><span class="ico">💍</span>sapatamu</a>
      <ul class="nav-links">
        <li><a href="/marketplace">Marketplace</a></li>
        <li><a href="/guestbook">Buku Tamu Digital</a></li>
        <li><a href="/menjadi-vendor" style="color:var(--primary);font-weight:700">Jadi Vendor</a></li>
      </ul>
    </div>
  </nav>

  <section class="hero">
    <h1>Daftarkan Bisnis Wedding Anda</h1>
    <p>Jangkau ribuan calon pengantin di seluruh Indonesia. Pendaftaran Gratis!</p>
  </section>

  <section class="form-section">
    <div class="form-card">
      <h2 class="form-title">Formulir Pendaftaran Vendor</h2>
      <form id="regForm">
        <div class="form-group">
          <label>Nama Bisnis / Brand *</label>
          <input type="text" id="businessName" placeholder="Contoh: Double Happiness Decoration" required>
        </div>

        <div class="form-group">
          <label>Kategori Vendor *</label>
          <select id="categoryId" required>
            <option value="">Pilih Kategori...</option>
            <option value="cat-wo">Wedding Organizer &amp; Planner</option>
            <option value="cat-foto">Fotografi &amp; Videografi</option>
            <option value="cat-katering">Katering (Catering)</option>
            <option value="cat-venue">Venue &amp; Gedung Pernikahan</option>
            <option value="cat-dekorasi">Dekorasi &amp; Florist</option>
            <option value="cat-makeup">Rias Pengantin &amp; Gaun (Makeup &amp; Attire)</option>
            <option value="cat-entertainment">Musik, MC &amp; Entertainment</option>
            <option value="cat-undangan">Undangan &amp; Souvenir</option>
            <option value="cat-jewellery">Perhiasan &amp; Cincin Kawin</option>
            <option value="cat-photobooth">Photobooth &amp; Interactive</option>
            <option value="cat-honeymoon">Honeymoon &amp; Travel</option>
          </select>
        </div>

        <!-- CASCADING WILAYAH INDONESIA -->
        <div class="form-group">
          <label>Provinsi *</label>
          <select id="provinceSelect" required onchange="onProvinceChange()">
            <option value="">Pilih Provinsi...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Kabupaten / Kota *</label>
          <select id="regencySelect" required disabled onchange="onRegencyChange()">
            <option value="">Pilih Kab. / Kota (Pilih Provinsi dulu)...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Kecamatan *</label>
          <select id="districtSelect" required disabled>
            <option value="">Pilih Kecamatan (Pilih Kab/Kota dulu)...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Email Akses *</label>
          <input type="email" id="email" placeholder="vendor@email.com" required>
        </div>

        <div class="form-group">
          <label>Password Akun *</label>
          <input type="password" id="password" placeholder="Minimal 6 karakter" required minlength="6">
        </div>

        <div class="form-group">
          <label>Nomor WhatsApp *</label>
          <input type="tel" id="whatsapp" placeholder="08xxxxxxxxxx" required>
        </div>

        <div class="form-group">
          <label>Deskripsi Singkat Bisnis</label>
          <textarea id="description" rows="3" placeholder="Jelaskan spesialisasi dan keunggulan jasa vendor Anda..."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">Daftar Vendor Sekarang 🚀</button>
      </form>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <script>
    const $ = id => document.getElementById(id);
    const API_BASE = 'https://www.emsifa.com/api-wilayah-indonesia/api';
    const API_FALLBACK = 'https://emsifa.github.io/api-wilayah-indonesia/api';

    function showToast(msg, type = '') {
      const toast = $('toast');
      toast.textContent = msg;
      toast.className = 'toast show ' + type;
      setTimeout(() => toast.className = 'toast', 4000);
    }

    function formatTitleCase(str) {
      if (!str) return '';
      return str.toLowerCase().split(' ').map(w => {
        if (w === 'kabupaten') return 'Kab.';
        if (w === 'kecamatan') return 'Kec.';
        return w.charAt(0).toUpperCase() + w.slice(1);
      }).join(' ');
    }

    async function loadProvinces() {
      const select = $('provinceSelect');
      select.innerHTML = '<option value="">Memuat Provinsi...</option>';
      try {
        let res = await fetch(`${API_BASE}/provinces.json`);
        if (!res.ok) res = await fetch(`${API_FALLBACK}/provinces.json`);
        const data = await res.json();
        select.innerHTML = '<option value="">Pilih Provinsi...</option>';
        data.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          const formatted = formatTitleCase(p.name);
          opt.dataset.name = formatted;
          opt.textContent = formatted;
          select.appendChild(opt);
        });
      } catch (err) {
        select.innerHTML = '<option value="">Gagal memuat provinsi</option>';
      }
    }

    async function onProvinceChange() {
      const provId = $('provinceSelect').value;
      const regSelect = $('regencySelect');
      const distSelect = $('districtSelect');

      distSelect.innerHTML = '<option value="">Pilih Kecamatan (Pilih Kab/Kota dulu)...</option>';
      distSelect.disabled = true;

      if (!provId) {
        regSelect.innerHTML = '<option value="">Pilih Kab. / Kota (Pilih Provinsi dulu)...</option>';
        regSelect.disabled = true;
        return;
      }

      regSelect.innerHTML = '<option value="">Memuat Kab. / Kota...</option>';
      regSelect.disabled = true;

      try {
        let res = await fetch(`${API_BASE}/regencies/${provId}.json`);
        if (!res.ok) res = await fetch(`${API_FALLBACK}/regencies/${provId}.json`);
        const data = await res.json();
        regSelect.innerHTML = '<option value="">Pilih Kab. / Kota...</option>';
        data.forEach(r => {
          const opt = document.createElement('option');
          opt.value = r.id;
          const formatted = formatTitleCase(r.name);
          opt.dataset.name = formatted;
          opt.textContent = formatted;
          regSelect.appendChild(opt);
        });
        regSelect.disabled = false;
      } catch (err) {
        regSelect.innerHTML = '<option value="">Gagal memuat kabupaten/kota</option>';
      }
    }

    async function onRegencyChange() {
      const regId = $('regencySelect').value;
      const distSelect = $('districtSelect');

      if (!regId) {
        distSelect.innerHTML = '<option value="">Pilih Kecamatan (Pilih Kab/Kota dulu)...</option>';
        distSelect.disabled = true;
        return;
      }

      distSelect.innerHTML = '<option value="">Memuat Kecamatan...</option>';
      distSelect.disabled = true;

      try {
        let res = await fetch(`${API_BASE}/districts/${regId}.json`);
        if (!res.ok) res = await fetch(`${API_FALLBACK}/districts/${regId}.json`);
        const data = await res.json();
        distSelect.innerHTML = '<option value="">Pilih Kecamatan...</option>';
        data.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d.id;
          const formatted = formatTitleCase(d.name);
          opt.dataset.name = formatted;
          opt.textContent = formatted;
          distSelect.appendChild(opt);
        });
        distSelect.disabled = false;
      } catch (err) {
        distSelect.innerHTML = '<option value="">Gagal memuat kecamatan</option>';
      }
    }

    async function loadCategories() {
      try {
        const res = await fetch('/api/mp/categories');
        const data = await res.json();
        const cats = Array.isArray(data) ? data : (data.categories || data.data || []);
        if (cats && cats.length > 0) {
          const select = $('categoryId');
          select.innerHTML = '<option value="">Pilih Kategori...</option>';
          cats.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.name;
            select.appendChild(opt);
          });
        }
      } catch (e) {}
    }

    $('regForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = $('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Memproses Pendaftaran...';

      const provSel = $('provinceSelect');
      const regSel  = $('regencySelect');
      const distSel = $('districtSelect');

      const provName = provSel.options[provSel.selectedIndex]?.dataset.name || '';
      const regName  = regSel.options[regSel.selectedIndex]?.dataset.name || '';
      const distName = distSel.options[distSel.selectedIndex]?.dataset.name || '';

      const cityFormatted = regName ? `${regName}${distName ? ' (' + distName + ')' : ''}` : '';

      const payload = {
        business_name: $('businessName').value.trim(),
        category_id: $('categoryId').value,
        province: provName,
        city: cityFormatted,
        district: distName,
        email: $('email').value.trim(),
        password: $('password').value,
        whatsapp: $('whatsapp').value.trim(),
        description: $('description').value.trim()
      };

      try {
        const res = await fetch('/api/mp/register-vendor', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (res.ok && json.success) {
          showToast('Pendaftaran Berhasil! Mengalihkan ke dashboard...', 'success');
          if (json.token) localStorage.setItem('mp_vendor_token', json.token);
          setTimeout(() => window.location.href = '/vendor-dashboard', 1500);
        } else {
          showToast(json.error || json.message || 'Pendaftaran gagal, coba lagi.', 'error');
          btn.disabled = false;
          btn.textContent = 'Daftar Vendor Sekarang 🚀';
        }
      } catch (err) {
        showToast('Terjadi kesalahan koneksi.', 'error');
        btn.disabled = false;
        btn.textContent = 'Daftar Vendor Sekarang 🚀';
      }
    });

    loadProvinces();
    loadCategories();
  </script>
</body>
</html>
