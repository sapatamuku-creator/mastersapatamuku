<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Jadi Vendor — Sapatamu.id</title>
  <meta name="description" content="Daftarkan bisnis wedding-mu di sapatamu.id. Jangkau ribuan calon pengantin di seluruh Indonesia. Gratis!">
  <link rel="canonical" href="https://sapatamu.id/menjadi-vendor">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/animations.css">

  <style>
    :root {
      --primary:#E07B7B; --primary-light:#F2B8B8; --primary-dark:#C45A5A;
      --gold:#C8962E; --text-main:#4A3F35; --text-light:#8A7E72; --text-muted:#B5ADA5;
      --bg:#FFFBF9; --bg-alt:#FFF5EE; --white:#FFFFFF; --border:rgba(200,150,46,0.15);
      --mp-purple:#7C3AED; --mp-green:#059669;
      --shadow-sm:0 1px 3px rgba(74,63,53,.06); --shadow-md:0 4px 16px rgba(74,63,53,.08);
      --shadow-lg:0 8px 32px rgba(74,63,53,.12); --shadow-xl:0 16px 48px rgba(74,63,53,.16);
      --radius:16px; --radius-sm:8px; --radius-lg:24px;
      --transition:all .3s cubic-bezier(.4,0,.2,1);
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;background:var(--bg);color:var(--text-main);line-height:1.6;-webkit-font-smoothing:antialiased}
    h1,h2,h3,h4{font-family:'Lora',Georgia,serif;font-weight:600;line-height:1.25}
    a{text-decoration:none;color:inherit;transition:var(--transition)}
    img{max-width:100%;display:block}
    button{cursor:pointer;border:none;background:none;font-family:inherit}
    input,select,textarea{font-family:inherit;font-size:inherit}
    .container{max-width:1200px;margin:0 auto;padding:0 20px}

    .navbar{position:sticky;top:0;z-index:100;background:rgba(255,251,249,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);height:60px}
    .navbar .container{display:flex;align-items:center;justify-content:space-between;height:100%}
    .nav-logo{display:flex;align-items:center;gap:8px;font-family:'Lora',serif;font-size:1.35rem;font-weight:700}
    .nav-logo .ico{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--gold));border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.95rem}
    .nav-links{display:flex;align-items:center;gap:28px;list-style:none}
    .nav-links a{font-size:.88rem;font-weight:500;color:var(--text-light)}

    .hero{padding:60px 0 48px;text-align:center;position:relative;overflow:hidden}
    .hero h1{font-size:clamp(1.8rem,4vw,2.8rem);margin-bottom:12px}
    .hero p{color:var(--text-light);font-size:1.05rem;max-width:520px;margin:0 auto}

    .form-section{padding:48px 0 80px}
    .form-card{max-width:640px;margin:0 auto;background:var(--white);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-lg)}

    .step-indicator{display:flex;border-bottom:1px solid var(--border)}
    .step-tab{flex:1;padding:16px;text-align:center;font-size:.82rem;font-weight:600;color:var(--text-muted);position:relative}
    .step-tab.active{color:var(--primary)}

    .form-body{padding:32px 28px}
    .form-step{display:none}
    .form-step.active{display:block}

    .form-group{margin-bottom:18px}
    .form-group label{display:block;font-size:.82rem;font-weight:600;color:var(--text-main);margin-bottom:6px}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);font-size:.88rem;color:var(--text-main)}

    .btn-next{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:12px 24px;border-radius:50px;font-weight:600}
    .btn-submit{background:linear-gradient(135deg,var(--mp-green),#047857);color:#fff;padding:12px 24px;border-radius:50px;font-weight:600}
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="/" class="nav-logo"><span class="ico">💍</span>sapatamu</a>
      <ul class="nav-links">
        <li><a href="/marketplace">Marketplace</a></li>
        <li><a href="/menjadi-vendor" style="color:var(--primary)">Jadi Vendor</a></li>
      </ul>
    </div>
  </nav>

  <section class="hero">
    <div class="container">
      <h1>Daftarkan Bisnis Wedding-mu</h1>
      <p>Jangkau ribuan calon pengantin di seluruh Indonesia. GRATIS!</p>
    </div>
  </section>

  <section class="form-section">
    <div class="container">
      <div class="form-card">
        <div class="form-body">
          <div class="form-step active">
            <h3>Info Bisnis</h3>
            <form id="regForm">
              <div class="form-group">
                <label>Nama Bisnis *</label>
                <input type="text" placeholder="Nama Bisnis Wedding Anda" required>
              </div>
              <div class="form-group">
                <label>Email *</label>
                <input type="email" placeholder="email@vendor.com" required>
              </div>
              <div class="form-group">
                <label>WhatsApp *</label>
                <input type="tel" placeholder="08xxxxxxxxxx" required>
              </div>
              <button type="submit" class="btn-submit">Daftar Sekarang</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

</body>
</html>
