<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#C8962E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SapaTamu.ku - Keluar Sesi</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #E07B7B; --text-main: #4A3F35; --bg: #FFF9F5; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; color: var(--text-main); }
        .logout-card { background: white; padding: 40px; border-radius: 30px; text-align: center; box-shadow: 0 20px 50px rgba(74, 63, 53, 0.1); max-width: 400px; width: 90%; border: 1px solid #F0E6DE; }
        h2 { font-family: 'Lora', serif; font-size: 24px; margin-bottom: 10px; }
        p { color: #8C7560; font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
        .btn-confirm { background: #4A3F35; color: white; border: none; padding: 15px 30px; border-radius: 15px; font-weight: 700; font-size: 12px; cursor: pointer; width: 100%; margin-bottom: 10px; letter-spacing: 1px; }
        .btn-cancel { background: none; color: #8C7560; border: 1px solid #F0E6DE; padding: 12px; border-radius: 15px; font-size: 11px; cursor: pointer; width: 100%; }
    </style>
    <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body>

    <div id="modal-confirm">
        <div class="logout-card">
            <div style="font-size: 40px; margin-bottom: 20px;">👋</div>
            <h2>Keluar Sesi?</h2>
            <p>Anda akan dialihkan kembali ke halaman login utama.</p>
            <button onclick="executeLogout()" class="btn-confirm">YA, KELUAR</button>
            <button onclick="window.location.replace('dashboard.html')" class="btn-cancel">BATAL</button>
        </div>
    </div>

    <script>
        function executeLogout() {
            // 1. BERSIHKAN SEMUA SESSION DATA
            if (typeof clearSession === 'function') clearSession();
            localStorage.clear();
            sessionStorage.clear();

            // 2. LANGSUNG TEMBAK KE LANDING PAGE UTAMA (DENGAN PARAMETER SIGNOUT)
            window.location.replace("https://sapatamu.id/?signout=true");
        }
    </script>
<script src="config.js"></script>
<script src="offline-db.js"></script>
<script src="sync-engine.js"></script>
<script>
(function(){
    if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
    window.addEventListener('online',function(){document.body.classList.remove('is-offline');});
    window.addEventListener('offline',function(){document.body.classList.add('is-offline');});
})();
</script>
<style>
.is-offline::before{content:'⚠️ OFFLINE — Data tersimpan lokal';position:fixed;top:0;left:0;right:0;z-index:99999;background:#FEE2E2;color:#991B1B;text-align:center;padding:6px;font-size:10px;font-weight:700;}
@media(min-width:1024px){.is-offline::before{display:none;}}
</style>
</body>
</html>
