<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>sapatamu.ku | TOTAL INTEGRATION V7.6</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="subdomain_resolver.js?v=2.1"></script>

    <style>
        :root { 
            --primary: #E07B7B; /* Rose */
            --bg: #FFF9F5;      /* Warm White */
            --card: #FFFFFF;
            --text-main: #4A3F35; 
            --text-muted: #8C7560;
            --border: #F0E6DE;
            --input-bg: #FDF8F4;
            --gold: #C8962E;
            --success: #10B981;
            --danger: #E74C3C;
        }
        
        /* BLOKIR FOOTER WEEBLY */
        .weebly-footer, .w-footer, [class*="weebly"], #weebly-footer-signup-container, 
        div[style*="position: fixed; bottom: 0;"], .footer-wrap, div[class*="powered-by"] { 
            display: none !important; visibility: hidden !important; z-index: -1 !important; height: 0 !important;
        }

        html, body { min-height: 100%; width: 100%; margin: 0; padding: 0; background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; }
        
        #app-root { 
            display: flex; flex-direction: column; 
            background: var(--bg); min-height: 100vh;
        }

        .header { text-align: center; padding: 20px; background: white; border-bottom: 1px solid var(--border); z-index: 100; flex-shrink: 0; }
        .header h1 { font-family: 'Lora', serif; font-size: 18px; color: var(--text-main); margin: 0; letter-spacing: 1px; font-weight: 700; }
        .header h1 span { color: var(--primary); }

        .nav-wrapper { padding: 10px 15px; background: white; flex-shrink: 0; }
        .nav-tabs { display: flex; background: #f0f0f0; border-radius: 12px; padding: 4px; gap: 4px; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 9px; border: none; background: transparent; font-size: 10px; font-weight: 800; color: #888; text-transform: uppercase; transition: 0.3s; cursor: pointer; }
        .tab-btn.active { background: white; color: var(--dark); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        .main-content { flex: 1; display: flex; flex-direction: column; padding: 0 10px 10px; overflow: hidden; gap: 10px; }

        #media-container { 
            position: relative; width: 100%; max-width: 220px; margin: 0 auto; 
            aspect-ratio: 1 / 1; background: #000; border-radius: 28px; overflow: hidden; 
            border: 4px solid white; box-shadow: 0 10px 30px rgba(0,0,0,0.1); flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        #reader { width: 100% !important; height: 100% !important; border: none !important; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
        #onsite-video, #preview-canvas, #capture-preview-onsite { width: 100% !important; height: 100% !important; object-fit: cover; }
        #onsite-video { transform: scaleX(-1); display: none; }

        .card-panel { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; flex: 1; min-height: 0; }
        #guest-list-container { 
            flex: 1; overflow-y: auto; padding-right: 2px; -webkit-overflow-scrolling: touch; 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px;
            align-content: start;
        }

        .counter-wrapper { display: flex; align-items: center; background: #f0f0f0; border-radius: 10px; padding: 2px; height: 40px; }
        .btn-step { width: 40px; height: 100%; border: none; background: white; border-radius: 8px; font-size: 18px; font-weight: bold; color: var(--dark); cursor: pointer; }
        .counter-value { flex: 1; text-align: center; font-weight: 800; font-size: 14px; color: var(--dark); }

        .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .form-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .form-label { font-size: 7.5px; font-weight: 900; color: #aaa; text-transform: uppercase; margin-left: 5px; }
        .form-control { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #eee; background: #fcfcfc; font-size: 12px; font-weight: 600; outline: none; box-sizing: border-box; }
        
        .tag-row { display: flex; gap: 8px; margin: 5px 0 15px; }
        .tag-item { flex: 1; padding: 10px; border-radius: 10px; background: #f5f5f5; border: 1px solid #eee; font-size: 9px; font-weight: 800; text-align: center; cursor: pointer; color: #888; }
        .tag-item.active { background: var(--gold); color: white; border-color: var(--gold); }

        .btn-main { background: var(--dark); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; }
        
        .guest-item { padding: 16px; background: #fff; border: 1px solid #f0f0f0; border-radius: 18px; margin-bottom: 0px; display: flex; flex-direction: column; position: relative; transition: 0.3s; }
        .guest-item:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(140, 117, 96, 0.1); }
        .guest-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; border-bottom: 1px dashed #f0e6de; padding-bottom: 8px; }
        .guest-info h4 { margin: 0; font-size: 13px; color: var(--text-main); font-weight: 800; text-transform: uppercase; line-height: 1.2; }
        .guest-wa { font-size: 9px; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }
        
        .guest-details { display: grid; grid-template-columns: 1fr; gap: 4px; margin-bottom: 12px; }
        .detail-item { font-size: 9px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .detail-item span { color: var(--text-main); font-weight: 700; }
        
        .guest-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; }
        .guest-badge { font-size: 8px; padding: 4px 10px; border-radius: 6px; font-weight: 800; text-transform: uppercase; background:#fdf8f4; color:var(--gold); border: 1px solid #f0e6de; }
        .guest-status-label { font-size: 8px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .pax-badge { font-size: 10px; font-weight: 800; color: var(--primary); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 100000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: white; width: 100%; max-width: 350px; border-radius: 30px; padding: 20px; text-align: center; }
        .modal-video-box { width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 20px; overflow: hidden; margin: 15px 0; border: 3px solid #f0f0f0; position: relative; }
        #confirm-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-cancel { background: #eee; color: #666; border: none; flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        .btn-confirm { background: var(--gold); color: white; border: none; flex: 2; padding: 12px; border-radius: 12px; font-weight: 800; cursor: pointer; }

        .loading-overlay { position: fixed; inset: 0; background: white; z-index: 100001; display: none; align-items: center; justify-content: center; font-weight: 800; color: var(--gold); }

        #btn-fullscreen {
            position: fixed; bottom: 20px; right: 20px; width: 45px; height: 45px;
            background: var(--text-main); color: white; border: 2px solid var(--gold);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            z-index: 100002; cursor: pointer; transition: 0.3s;
        }
        .fade-out { opacity: 0; visibility: hidden; }

        .main-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 20px 40px;
        }

        /* HEADER AREA (FIXED) */
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            border-bottom: 1px solid var(--border);
        }

        .pax-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; background: #fafafa; padding: 10px 15px; border-radius: 15px; border: 1px solid #eee; }
        .pax-label { font-size: 10px; font-weight: 800; color: #666; text-transform: uppercase; }
        .pax-total-label { font-size: 10px; font-weight: 800; color: var(--gold); text-align: right; margin-top: 5px; }

        .onsite-input-group { margin-bottom: 20px; border-bottom: 1.5px solid var(--border); padding-bottom: 8px; transition: 0.3s; }
        .onsite-input-group label { display: block; font-size: 9px; font-weight: 800; color: var(--gold); text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; text-align: left; }
        .onsite-input-group input, .onsite-input-group select { width: 100%; border: none; background: transparent; font-size: 13px; font-weight: 700; color: var(--text-main); outline: none; }
        
        .btn-dark-onsite { width: 100%; padding: 18px; border-radius: 15px; background: #4A3F35; color: white; border: none; font-weight: 800; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-dark-onsite:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* UNIFIED NAVBAR STYLES */
        .sapatamu-navbar {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .sapatamu-nav-container {
            background: #FFFDFB;
            padding: 6px 10px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 10px 30px rgba(74, 63, 53, 0.08);
            border: 1px solid var(--border);
            max-width: 95%;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
            position: relative;
        }
        .sapatamu-nav-container::-webkit-scrollbar { display: none; }
        
        /* SCROLL INDICATORS */
        .sapatamu-nav-container::before,
        .sapatamu-nav-container::after {
            content: '';
            position: sticky;
            top: 0;
            min-width: 40px;
            height: 32px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            color: var(--text-muted);
            opacity: 0.5;
        }
        .sapatamu-nav-container::before {
            left: 0;
            background: linear-gradient(to right, #FFFDFB 70%, transparent);
            content: '‹';
            margin-right: -40px;
        }
        .sapatamu-nav-container::after {
            right: 0;
            background: linear-gradient(to left, #FFFDFB 70%, transparent);
            content: '›';
            margin-left: -40px;
        }
        
        .nav-group { display: flex; align-items: center; gap: 4px; }
        .nav-group:first-child { padding-left: 20px; }
        .nav-group:last-child { padding-right: 20px; }
        
        /* TABS UNDER NAVBAR */
        .nav-tabs-container {
            width: 100%;
            max-width: 400px;
            padding: 0 20px 15px;
        }
        .nav-tabs { 
            display: flex; 
            background: #f0f0f0; 
            border-radius: 12px; 
            padding: 4px; 
            gap: 4px; 
        }

        .nav-group { display: flex; align-items: center; gap: 4px; }
        .nav-link {
            text-decoration: none;
            font-size: 10.5px;
            font-weight: 700;
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 30px;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }
        .nav-link:hover { color: var(--primary); background: rgba(224, 123, 123, 0.05); }
        .nav-link.active { background: var(--primary); color: white !important; }
        .nav-divider { width: 1px; height: 18px; background: #EEE0D5; margin: 0 8px; }
        .nav-divider-bold { width: 1.5px; height: 22px; background: #D6C7BC; margin: 0 12px; }

        .main-content { margin-top: 140px; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
    </style>
</head>
<body onload="initApp()">

<div id="app-root">
    <div id="loading" class="loading-overlay">MEMPROSES...</div>

    <!-- CUSTOM NOTIFICATION MODAL -->
    <div id="sapa-notify-modal" style="position: fixed; inset: 0; background: rgba(74, 63, 53, 0.4); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 9999999;">

            <button onclick="closeSapaModal()" class="btn-main" style="padding: 15px; border-radius: 15px; font-size: 11px; margin-top: 0; background: var(--text-main); width: 100%; border: none; color: white;">MENGERTI</button>
        </div>

        @keyframes modalPop {

    <div class="fixed-header">
        <nav class="sapatamu-navbar">
            <div class="sapatamu-nav-container">

        <div class="nav-tabs-container">
            <div class="nav-tabs">

            </div>
        </div>

    <div class="main-content">
        <div class="main-container">
            <div id="media-container">
                <div id="reader"></div>
                <video id="onsite-video" autoplay playsinline muted></video>
                <canvas id="capture-preview-onsite" style="display:none;"></canvas>
            </div>

            <div id="panel-scan" class="card-panel">
                <div class="search-box"><input type="text" id="search-input" class="form-control" placeholder="Cari Nama / Kode / Pihak Pengundang..." oninput="renderGuestList()"></div>
                <div id="guest-list-container"></div>
            </div>

            <div id="panel-onsite" class="card-panel" style="display: none; overflow-y: auto; text-align: left; padding: 30px 25px;">
                <h3 style="font-family: 'Lora', serif; font-size: 20px; font-weight: 700; color: var(--text-main); margin-bottom: 25px;">Registrasi Tamu Baru</h3>

                <div class="onsite-input-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="reg-nama" placeholder="Masukkan nama tamu...">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="onsite-input-group">
                        <label>WhatsApp Number</label>
                        <input type="tel" id="reg-wa" placeholder="08...">
                    </div>
                    <div class="onsite-input-group">
                        <label>Category</label>
                        <select id="reg-kategori">
                            <option value="Umum">Umum</option>
                            <option value="VIP">VIP</option>
                            <option value="VVIP">VVIP</option>
                            <option value="Keluarga">Keluarga</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="onsite-input-group">
                        <label>Inviter Side</label>
                        <select id="reg-host">
                            <option value="PENGANTIN PRIA">Pengantin Pria</option>
                            <option value="PENGANTIN WANITA">Pengantin Wanita</option>
                            <option value="KELUARGA AYAH CPP">Keluarga Ayah CPP</option>
                            <option value="KELUARGA IBU CPP">Keluarga Ibu CPP</option>
                            <option value="KELUARGA AYAH CPW">Keluarga Ayah CPW</option>
                            <option value="KELUARGA IBU CPW">Keluarga Ibu CPW</option>
                        </select>
                    </div>
                    <div class="onsite-input-group">
                        <label>Souvenir</label>
                        <select id="reg-souvenir">
                            <option value="1">Ya</option>
                            <option value="0">Tidak</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="onsite-input-group">
                        <label>Sesi Undangan</label>
                        <select id="reg-sesi">
                            <option value="">Memuat sesi...</option>
                        </select>
                    </div>
                    <div class="onsite-input-group" style="border:none;">
                        <label>Jumlah Pax</label>
                        <div style="display:flex; flex-direction:column; gap:5px;">
                            <div class="pax-row" style="margin:0; padding:5px 10px; height: 35px;">
                                <span style="font-size:8px; font-weight:800; color:#666;">DEWASA</span>
                                <div class="counter-wrapper" style="height:28px; width:80px;">
                                    <button type="button" class="btn-step" onclick="updatePax('reg', 'adult', -1)">-</button>
                                    <div id="reg-pax-adult" class="counter-value" style="font-size:11px;">1</div>
                                    <button type="button" class="btn-step" onclick="updatePax('reg', 'adult', 1)">+</button>
                                </div>
                            </div>
                            <div class="pax-row" style="margin:0; padding:5px 10px; height: 35px;">
                                <span style="font-size:8px; font-weight:800; color:#666;">ANAK</span>
                                <div class="counter-wrapper" style="height:28px; width:80px;">
                                    <button type="button" class="btn-step" onclick="updatePax('reg', 'child', -1)">-</button>
                                    <div id="reg-pax-child" class="counter-value" style="font-size:11px;">0</div>
                                    <button type="button" class="btn-step" onclick="updatePax('reg', 'child', 1)">+</button>
                                </div>
                            </div>
                            <div class="pax-total-label" style="font-size:8px;">TOTAL: <span id="reg-pax-total">1</span> PAX</div>
                        </div>
                    </div>
                </div>

                <div class="onsite-input-group">
                    <label>Alamat / Instansi</label>
                    <input type="text" id="reg-alamat" placeholder="Kota atau Instansi...">
                </div>

                <div class="tag-row" style="margin-bottom: 15px;">
                    <div class="tag-item" id="tag-angpao" onclick="this.classList.toggle('active')" style="flex:1">ANGPAO</div>
                    <div class="tag-item" id="tag-kado" onclick="this.classList.toggle('active')" style="flex:1">KADO</div>
                </div>

                <button type="button" onclick="takeOnsiteSnapshot()" id="btn-onsite-snap" style="background: none; border: 1px solid var(--gold); color: var(--gold); padding: 12px; border-radius: 15px; font-size: 10px; font-weight: 800; cursor: pointer; width: 100%; margin-bottom: 15px; letter-spacing: 1px;">AMBIL SELFIE</button>
                
                <button id="btn-final-onsite" class="btn-dark-onsite" onclick="submitOnsite()" disabled>DAFTARKAN TAMU</button>
            </div>
        </div>
    </div>
</div>

                    <div class="counter-wrapper">
                        <button type="button" class="btn-step" onclick="updatePax('m', 'child', -1)">-</button>
                        <div id="m-pax-child" class="counter-value">0</div>
                        <button type="button" class="btn-step" onclick="updatePax('m', 'child', 1)">+</button>
                    </div>
                </div>
                <div class="pax-total-label">TOTAL: <span id="m-pax-total">1</span> PAX</div>
            </div>
            <div class="form-group">
                <label class="form-label">Pemberian</label>
                <div class="tag-row" style="margin:0">
                    <div class="tag-item" id="m-tag-angpao" onclick="this.classList.toggle('active')">ANGPAO</div>
                    <div class="tag-item" id="m-tag-kado" onclick="this.classList.toggle('active')">KADO</div>
                </div>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn-cancel" onclick="closeConfirm()">BATAL</button>
            <button class="btn-confirm" id="btn-final-confirm" onclick="executeCheckIn()" style="opacity:0.5;" disabled>KONFIRMASI</button>
        </div>
    </div>
</div>

<script>const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwLzsJG32z-5SvkqiQj942TSeCX2QhQmUSJVOV6l2rUErgotLNDiPTtyx5ViSgst3DI/exec";
 
    const WA_ENGINE_URL = SCRIPT_URL;
    const SELFIE_URL = SCRIPT_URL;

    function syncNavbar() {
        const links = document.querySelectorAll('.nav-link');
        links.forEach(link => {
            const baseHref = link.getAttribute('href').split('?')[0];
            link.href = baseHref;
        });
    }

    // --- CUSTOM NOTIFICATION SYSTEM ---
    window.showSapaModal = function(title, msg, icon = "✨") {
        document.getElementById('notify-title').innerText = title;
        document.getElementById('notify-msg').innerText = msg;
        document.getElementById('notify-icon').innerText = icon;
        document.getElementById('sapa-notify-modal').style.display = 'flex';
    };

    window.closeSapaModal = function() {
        document.getElementById('sapa-notify-modal').style.display = 'none';
    };
    
    // --- SESSION HANDLER ---
    const session = JSON.parse(sessionStorage.getItem('sapatamu_session')) || JSON.parse(localStorage.getItem('sapatamu_db'));
    let CURRENT_SS_ID = window.CURRENT_SS_ID || (session ? session.ssId : null);

    let masterData = [], html5QrCode = null, onsiteStream = null, confirmStream = null;
    let currentMode = 'scan', selectedGuest = null, capturedPhoto = null, capturedOnsitePhoto = null;

    async function initApp() { 
        if (window.SAPATAMU_RESOLVED) {
            CURRENT_SS_ID = window.CURRENT_SS_ID || CURRENT_SS_ID;
            if (!CURRENT_SS_ID) {
                window.location.href = "login.html";
                return;
            }
            syncNavbar();
            startScanner(); 
            fetchMasterData(); 
            startExtremeWeeblyKiller();
        } else {
            setTimeout(initApp, 100);
        }
    }

    function startExtremeWeeblyKiller() {
        setInterval(() => {
            document.querySelectorAll('.weebly-footer, .w-footer, [class*="weebly"], #weebly-footer-signup-container').forEach(el => el.remove());
        }, 500);
    }

    window.updatePax = function(id, step) {
        const el = document.getElementById(id);
        let val = parseInt(el.innerText) + step;
        if (val < 1) val = 1; if (val > 20) val = 20;
        el.innerText = val;
    };

    window.toggleFullScreen = function() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().then(() => {
                document.getElementById('btn-fullscreen').classList.add('fade-out');
            });
        }
    };

    async function fetchMasterData() {
        try {
            const res = await fetch(SCRIPT_URL, { 
                method: 'POST', 
                body: JSON.stringify({ action: "get_master_data", ssId: CURRENT_SS_ID }) 
            });
            const data = await res.json();
            masterData = data.guestList || [];
            
            // Populate Session Options for Onsite
            const sesiSelect = document.getElementById('reg-sesi');
            if (sesiSelect && data.eventMeta && data.eventMeta.sesiOptions) {
                sesiSelect.innerHTML = '<option value="">Pilih Sesi</option>' + 
                    data.eventMeta.sesiOptions.map(s => `<option value="${s}">${s}</option>`).join('');
            }

            renderGuestList();
        } catch (e) { console.error("Error fetching master data:", e); }
    }

    window.renderGuestList = function() {
        const container = document.getElementById('guest-list-container');
        const term = document.getElementById('search-input').value.toLowerCase();
        const filtered = masterData.filter(g => 
            (g.nama||"").toLowerCase().includes(term) || 
            (g.kode||"").toLowerCase().includes(term) ||
            (g.pihakPengundang||"").toLowerCase().includes(term)
        );

        container.innerHTML = filtered.map(g => {
            const isHadir = String(g.statusHadir) === "1" || (g.jamDatang && g.jamDatang !== "-");
            return `
                <div class="guest-item" style="border-top: 4px solid ${isHadir?'var(--success)':'var(--border)'}; opacity:${isHadir?0.7:1}" onclick="${isHadir?"":`openConfirm('${g.kode}','${g.nama}','${g.alamat}','${g.kategori}')`}">
                    <div class="guest-header">
                        <div style="flex:1">
                            <div class="guest-badge" style="margin-bottom:4px; display:inline-block">${g.kategori || 'REGULER'}</div>
                            <h4>${g.nama}</h4>
                        </div>
                        <div class="guest-wa">${g.whatsapp || '-'}</div>
                    </div>
                    
                    <div class="guest-details">
                        <div class="detail-item">🏠 <span>${g.alamat || '-'}</span></div>
                        <div class="detail-item">💌 Inv by: <span>${g.pihakPengundang || '-'}</span></div>
                        <div class="detail-item">⏰ Sesi: <span>${g.sesi || g.rencanaJamHadir || g.jamHadir || '-'}</span></div>
                    </div>

                    <div class="guest-footer">
                        <div class="pax-badge">PAX PLAN: ${(g.rencanaHadir !== "" && g.rencanaHadir !== undefined) ? g.rencanaHadir : '1'}</div>
                        <div class="guest-status-label" style="color:${isHadir?'var(--success)':'var(--text-muted)'}">
                            ${isHadir ? '✓ HADIR ('+g.realHadir+')' : '● BELUM SCAN'}
                        </div>
                    </div>
                    <div style="font-size:7px; color:#ccc; margin-top:5px; text-align:right">ID: ${g.kode}</div>
                </div>`;
        }).join('');
    };

    async function startScanner() {
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 220 }, (txt) => {
            const t = masterData.find(g => String(g.kode) === String(txt));
            if (t && String(t.statusHadir)!=="1") openConfirm(t.kode, t.nama, t.alamat, t.kategori);
        }).catch(()=>{});
    }

    window.takeSnapshot = function() {
        const v = document.getElementById('confirm-video'), c = document.getElementById('preview-canvas'), ctx = c.getContext('2d');
        if (v.style.display === 'none') { resetSnapshot(); return; }
        c.width = v.videoWidth; c.height = v.videoHeight;
        ctx.translate(c.width, 0); ctx.scale(-1, 1);
        ctx.drawImage(v, 0, 0, c.width, c.height);
        capturedPhoto = c.toDataURL('image/jpeg', 0.8);
        v.style.display = 'none'; c.style.display = 'block';
        document.getElementById('btn-snap').innerText = "ULANGI";
        document.getElementById('btn-final-confirm').disabled = false; document.getElementById('btn-final-confirm').style.opacity = 1;
    };

    function resetSnapshot() {
        document.getElementById('confirm-video').style.display = 'block';
        document.getElementById('preview-canvas').style.display = 'none';
        capturedPhoto = null; document.getElementById('btn-snap').innerText = "AMBIL SELFIE";
        document.getElementById('btn-final-confirm').disabled = true; document.getElementById('btn-final-confirm').style.opacity = 0.5;
        document.getElementById('m-pax-adult').innerText = "1";
        document.getElementById('m-pax-child').innerText = "0";
        document.getElementById('m-pax-total').innerText = "1";
    }

    window.takeOnsiteSnapshot = function() {
        const v = document.getElementById('onsite-video'), c = document.getElementById('capture-preview-onsite'), ctx = c.getContext('2d');
        if (v.style.display === 'none') { resetOnsiteSnapshot(); return; }
        const size = Math.min(v.videoWidth, v.videoHeight);
        c.width = 600; c.height = 600;
        const sx = (v.videoWidth - size) / 2;
        const sy = (v.videoHeight - size) / 2;
        ctx.translate(c.width, 0); ctx.scale(-1, 1);
        ctx.drawImage(v, sx, sy, size, size, 0, 0, c.width, c.height);
        capturedOnsitePhoto = c.toDataURL('image/jpeg', 0.8);
        v.style.display = 'none'; c.style.display = 'block';
        document.getElementById('btn-onsite-snap').innerText = "ULANGI";
        document.getElementById('btn-final-onsite').disabled = false; document.getElementById('btn-final-onsite').style.opacity = 1;
    };

    function resetOnsiteSnapshot() {
        document.getElementById('onsite-video').style.display = 'block';
        document.getElementById('capture-preview-onsite').style.display = 'none';
        capturedOnsitePhoto = null; document.getElementById('btn-onsite-snap').innerText = "AMBIL SELFIE";
        document.getElementById('btn-final-onsite').disabled = true; document.getElementById('btn-final-onsite').style.opacity = 0.5;
        document.getElementById('reg-pax-adult').innerText = "1";
        document.getElementById('reg-pax-child').innerText = "0";
        document.getElementById('reg-pax-total').innerText = "1";
    }

    window.updatePax = function(prefix, type, delta) {
        const el = document.getElementById(prefix + '-pax-' + type);
        let val = parseInt(el.innerText) + delta;
        if (type === 'adult' && val < 1) val = 1;
        if (type === 'child' && val < 0) val = 0;
        el.innerText = val;
        
        const adult = parseInt(document.getElementById(prefix + '-pax-adult').innerText);
        const child = parseInt(document.getElementById(prefix + '-pax-child').innerText);
        document.getElementById(prefix + '-pax-total').innerText = adult + child;
    };

    window.openConfirm = async function(kode, nama, alamat, kategori) {
        selectedGuest = masterData.find(g => g.kode === kode);
        document.getElementById('m-nama').innerText = nama;
        document.getElementById('m-info').innerText = `${kategori} | ${alamat}`;
        
        // Reset counters
        const initialAdult = parseInt(selectedGuest.rencanaHadir) || 1;
        document.getElementById('m-pax-adult').innerText = initialAdult;
        document.getElementById('m-pax-child').innerText = "0";
        document.getElementById('m-pax-total').innerText = initialAdult;

        document.getElementById('modal-confirm').style.display = 'flex';
        if (html5QrCode) await html5QrCode.stop();
        confirmStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        document.getElementById('confirm-video').srcObject = confirmStream;
    };

    window.closeConfirm = function() {
        if (confirmStream) confirmStream.getTracks().forEach(t => t.stop());
        resetSnapshot(); document.getElementById('modal-confirm').style.display = 'none';
        if (currentMode === 'scan') startScanner();
    };

    window.executeCheckIn = async function() {
        document.getElementById('loading').style.display = 'flex';
        const adult = document.getElementById('m-pax-adult').innerText;
        const child = document.getElementById('m-pax-child').innerText;
        const total = document.getElementById('m-pax-total').innerText;
        const paxString = `${total} ( ${adult}D + ${child}A )`;

        const note = (document.getElementById('m-tag-angpao').classList.contains('active')?"ANGPAO ":"") + (document.getElementById('m-tag-kado').classList.contains('active')?"KADO":"");
        
        try {
            const res = await fetch(SCRIPT_URL, { 
                method:'POST', 
                body: JSON.stringify({ 
                    action: "confirm_checkin", 
                    ssId: CURRENT_SS_ID,
                    kodeUnik: selectedGuest.kode, 
                    realHadir: paxString, 
                    catatan: note||"-" 
                }) 
            });
            
            const json = await res.json();
            
            if (json.status === "success") {
                fetch(WA_ENGINE_URL, {
                    method: 'POST', mode: 'no-cors',
                    body: JSON.stringify({ action: "broadcastWA", ssId: CURRENT_SS_ID, kodeUnik: selectedGuest.kode })
                });

                if (capturedPhoto) {
                    fetch(SELFIE_URL, { 
                        method: 'POST', mode: 'no-cors', 
                        body: JSON.stringify({ action: "uploadSelfie", image: capturedPhoto, nama: selectedGuest.nama, kode: selectedGuest.kode, ssId: CURRENT_SS_ID }) 
                    });
                }

                confetti({ particleCount: 150, spread: 70 });
                const idx = masterData.findIndex(g => g.kode === selectedGuest.kode);
                if(idx !== -1) {
                    masterData[idx].statusHadir = "1";
                    masterData[idx].realHadir = paxString;
                    masterData[idx].jamDatang = "Tadi";
                }
                closeConfirm(); 
                renderGuestList();
                fetchMasterData();
            }
        } catch (e) {
            console.error("Error checkin:", e);
        } finally { 
            document.getElementById('loading').style.display = 'none'; 
        }
    };

    window.switchMode = async function(m) {
        currentMode = m;
        document.getElementById('tab-scan').classList.toggle('active', m==='scan');
        document.getElementById('tab-onsite').classList.toggle('active', m==='onsite');
        document.getElementById('panel-scan').style.display = m==='scan'?'flex':'none';
        document.getElementById('panel-onsite').style.display = m==='onsite'?'block':'none';
        if (m === 'onsite') {
            if (html5QrCode) await html5QrCode.stop();
            document.getElementById('reader').style.display = 'none';
            document.getElementById('onsite-video').style.display = 'block';
            onsiteStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('onsite-video').srcObject = onsiteStream;
        } else {
            if (onsiteStream) onsiteStream.getTracks().forEach(t => t.stop());
            document.getElementById('reader').style.display = 'block';
            document.getElementById('onsite-video').style.display = 'none';
            startScanner();
        }
    };

    window.submitOnsite = async function() {
        document.getElementById('loading').style.display = 'flex';
        const adult = document.getElementById('reg-pax-adult').innerText;
        const child = document.getElementById('reg-pax-child').innerText;
        const total = document.getElementById('reg-pax-total').innerText;
        const paxString = `${total} ( ${adult}D + ${child}A )`;

        const giftNote = (document.getElementById('tag-angpao').classList.contains('active')?"ANGPAO ":"") + (document.getElementById('tag-kado').classList.contains('active')?"KADO":"");

        const payload = { 
            action: "register_new_onsite", 
            ssId: CURRENT_SS_ID,
            namaTamu: document.getElementById('reg-nama').value, 
            alamat: document.getElementById('reg-alamat').value, 
            whatsapp: document.getElementById('reg-wa').value, 
            kategori: document.getElementById('reg-kategori').value, 
            host: document.getElementById('reg-host').value, 
            sesi: document.getElementById('reg-sesi').value,
            souvenir: document.getElementById('reg-souvenir').value,
            catatan: giftNote,
            realHadir: paxString 
        };

        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            const json = await res.json();

            if (json.status === "success") {
                fetch(WA_ENGINE_URL, {
                    method: 'POST', mode: 'no-cors',
                    body: JSON.stringify({ action: "broadcastWA", ssId: CURRENT_SS_ID, kodeUnik: json.kode })
                });

                if (capturedOnsitePhoto) {
                    fetch(SELFIE_URL, { 
                        method: 'POST', mode: 'no-cors', 
                        body: JSON.stringify({ action: "uploadSelfie", image: capturedOnsitePhoto, nama: payload.namaTamu, kode: json.kode, ssId: CURRENT_SS_ID }) 
                    });
                }

                confetti({ particleCount: 100, spread: 50 });
                resetOnsiteSnapshot(); 
                document.getElementById('reg-nama').value = ""; 
                document.getElementById('reg-alamat').value = ""; 
                document.getElementById('reg-wa').value = "";
                switchMode('scan');
                fetchMasterData(); 
            }
        } catch (e) {
            console.error("Error onsite registration:", e);
        } finally { 
            document.getElementById('loading').style.display = 'none'; 
        }
    };
</script>
</body>
</html>
