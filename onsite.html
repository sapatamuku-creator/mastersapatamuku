<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>sapatamu.ku | ONSITE SCAN & REG</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="subdomain_resolver.js?v=3.2"></script>

    <style>
        :root { 
            --primary: #E07B7B; 
            --bg: #FFF9F5; 
            --card: #FFFFFF;
            --text-main: #4A3F35; 
            --text-muted: #8C7560;
            --border: #F0E6DE;
            --input-bg: #FDF8F4;
            --gold: #C8962E;
            --success: #10B981;
        }

        html, body { overflow: hidden; height: 100%; width: 100%; margin: 0; padding: 0; background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; }
        #app-root { display: flex; position: absolute; top: 0; left: 0; right: 0; bottom: 0; flex-direction: column; z-index: 10; color: var(--text-main); }

        .header { text-align: center; padding: 80px 20px 10px; background: white; border-bottom: 1px solid var(--border); z-index: 100; }
        .header h1 { font-family: 'Lora', serif; font-size: 18px; color: var(--text-main); margin: 0; font-weight: 700; }
        .header h1 span { color: var(--primary); }
        .header p { font-size: 8px; letter-spacing: 2px; color: var(--text-muted); font-weight: 700; margin: 0; text-transform: uppercase; }

        .main-content { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 10px; overflow: hidden; }
        
        /* TABS (ONSITE SPECIFIC) */
        .onsite-tabs { display: flex; background: white; border-radius: 15px; padding: 5px; border: 1px solid var(--border); }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-size: 11px; font-weight: 800; border-radius: 10px; cursor: pointer; color: var(--text-muted); transition: 0.3s; text-transform: uppercase; }
        .tab-btn.active { background: var(--primary); color: white; }

        #scanner-wrapper { 
            position: relative; width: 100%; max-width: 250px; margin: 0 auto; 
            aspect-ratio: 1 / 1;
            background: #000; border-radius: 24px; overflow: hidden; border: 4px solid white; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        #reader { width: 100% !important; height: 100% !important; }
        #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }

        .scan-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 5; pointer-events: none; }
        .scan-frame { 
            width: 70%; height: 70%; border: 2px solid rgba(255,255,255,0.1); border-radius: 20px; 
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); transition: all 0.25s ease; transform: scale(0.95); opacity: 0.5;
        }
        .scan-frame.qr-detected { border-color: var(--gold); box-shadow: 0 0 20px rgba(212,175,55,0.4), 0 0 0 1000px rgba(0,0,0,0.2); transform: scale(1); opacity: 1; }
        .scan-frame.qr-success { border-color: var(--success) !important; box-shadow: 0 0 30px var(--success), 0 0 0 1000px rgba(0,0,0,0.1) !important; transform: scale(1.05); }

        .bottom-section { flex: 1; background: white; border-radius: 25px 25px 0 0; display: flex; flex-direction: column; overflow: hidden; }
        .search-container { padding: 12px; border-bottom: 1px solid #f2f2f2; display: flex; gap: 8px; }
        .search-input { flex: 1; padding: 12px; border-radius: 14px; border: 1px solid #eee; background: #f8f9f9; font-size: 13px; outline: none; }

        .list-wrapper { flex: 1; padding: 5px 12px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-content: start; }
        .guest-item { padding: 16px; border-radius: 18px; background: #fff; border: 1px solid #f0f0f0; display: flex; flex-direction: column; position: relative; transition: 0.3s; border-top: 4px solid var(--border); }
        .guest-item.checked-in { background: #fdf8f4; border-color: var(--success); opacity: 0.7; }
        .guest-item:hover { border-color: var(--primary); transform: translateY(-2px); }
        
        .guest-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; border-bottom: 1px dashed #f0e6de; padding-bottom: 8px; }
        .guest-name { font-size: 13px; font-weight: 800; color: var(--text-main); line-height: 1.2; text-transform: uppercase; }
        
        .guest-details { display: grid; grid-template-columns: 1fr; gap: 4px; margin-bottom: 12px; }
        .detail-item { font-size: 9px; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .detail-item span { color: var(--text-main); font-weight: 700; }
        
        .guest-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .guest-cat { font-size: 8px; background: #fdf8f4; padding: 4px 10px; border-radius: 6px; font-weight: 800; color: var(--gold); border: 1px solid #f0e6de; }

        /* REGISTRATION FORM STYLES */
        .reg-pane { flex: 1; background: white; padding: 25px; overflow-y: auto; display: none; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 10px; font-weight: 800; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 14px; border-radius: 14px; border: 1.5px solid var(--border); background: #fafafa; font-size: 13px; font-weight: 600; outline: none; }
        .btn-submit { width: 100%; padding: 20px; background: var(--primary); color: white; border: none; border-radius: 18px; font-weight: 800; font-size: 14px; box-shadow: 0 10px 20px rgba(224,123,123,0.3); cursor: pointer; }

        /* MODAL STYLES */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 100000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: white; width: 100%; max-width: 350px; border-radius: 30px; padding: 25px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); }
        .modal-video-box { width: 100%; aspect-ratio: 1/1; background: #000; border-radius: 20px; overflow: hidden; margin: 15px 0; border: 3px solid #f0f0f0; position: relative; }
        #camera-preview { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #eee; color: #666; border: none; flex: 1; padding: 14px; border-radius: 16px; font-weight: 700; cursor: pointer; font-size: 11px; }
        .btn-confirm { background: var(--gold); color: white; border: none; flex: 2; padding: 14px; border-radius: 16px; font-weight: 800; cursor: pointer; font-size: 11px; }

        .pax-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; background: #fafafa; padding: 10px 15px; border-radius: 15px; border: 1px solid #eee; }
        .counter-wrapper { display: flex; align-items: center; background: #f0f0f0; border-radius: 12px; padding: 2px; height: 38px; width: 100px; }
        .btn-step { width: 35px; height: 100%; border: none; background: white; border-radius: 8px; font-size: 16px; font-weight: bold; color: var(--text-main); cursor: pointer; }
        .counter-value { flex: 1; text-align: center; font-weight: 800; font-size: 13px; color: var(--text-main); }

        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 1000000; display: none; align-items: center; justify-content: center; font-weight: 800; color: var(--primary); }

        /* UNIFIED NAVBAR STYLES (FIXED WRAPPING) */
        .sapatamu-navbar { position: fixed; top: 0; left: 0; width: 100%; padding: 15px 20px 5px; display: flex; justify-content: center; z-index: 10000; }
        .sapatamu-nav-container { 
            background: #FFFDFB; padding: 6px 10px; border-radius: 50px; 
            display: flex; align-items: center; gap: 5px; box-shadow: 0 10px 30px rgba(74, 63, 53, 0.08); 
            border: 1px solid var(--border); max-width: 95%; overflow-x: auto; 
            white-space: nowrap; scrollbar-width: none; flex-wrap: nowrap;
        }
        .sapatamu-nav-container::-webkit-scrollbar { display: none; }
        .nav-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; flex-wrap: nowrap; }
        .nav-link { text-decoration: none; font-size: 10.5px; font-weight: 700; color: var(--text-muted); padding: 10px 18px; border-radius: 30px; transition: 0.3s; display: flex; align-items: center; white-space: nowrap; }
        .nav-link.active { background: var(--primary); color: white !important; }
        .nav-divider { width: 1px; height: 18px; background: #EEE0D5; margin: 0 8px; flex-shrink: 0; }
    </style>
</head>
<body onload="initApp()">

<div id="app-root">
    <nav class="sapatamu-navbar">
        <div class="sapatamu-nav-container">
            <div class="nav-group">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <div class="nav-divider"></div>
                <a href="formulir_tamu.html" class="nav-link">Formulir</a>
                <a href="wa_blast.html" class="nav-link">WA Blast</a>
                <a href="undangan.html" class="nav-link">Undangan</a>
            </div>
            <div class="nav-divider"></div>
            <div class="nav-group">
                <a href="checkin.html" class="nav-link">Check-in</a>
                <a href="onsite.html" class="nav-link active">On-Site</a>
                <a href="analytics.html" class="nav-link">Analytics</a>
                <a href="luckydraw.html" class="nav-link">Lucky Draw</a>
            </div>
        </div>
    </nav>

    <div class="header">
        <h1>sapa<span>tamu</span>.ku</h1>
        <p>ONSITE SCAN & REGISTRATION</p>
    </div>

    <div class="main-content">
        <div class="onsite-tabs">
            <div id="tab-scan-btn" class="tab-btn active" onclick="switchTab('scan')">SCAN CHECK-IN</div>
            <div id="tab-reg-btn" class="tab-btn" onclick="switchTab('reg')">TAMU BARU (ON-SITE)</div>
        </div>

        <!-- PANE SCAN (CLONE FROM CHECKIN) -->
        <div id="pane-scan" style="display: flex; flex-direction: column; gap: 10px; flex: 1; overflow: hidden;">
            <div id="scanner-wrapper">
                <div id="reader"></div>
                <div class="scan-overlay"><div class="scan-frame" id="target-frame"></div></div>
            </div>
            <div class="bottom-section">
                <div class="search-container">
                    <input type="text" id="search-box" class="search-input" placeholder="Cari nama atau kode..." oninput="renderUI()">
                </div>
                <div id="guest-list" class="list-wrapper"></div>
            </div>
        </div>

        <!-- PANE REGISTRATION -->
        <div id="pane-reg" class="reg-pane">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="reg-nama" placeholder="Masukkan nama tamu...">
            </div>
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1">
                    <label>WhatsApp</label>
                    <input type="tel" id="reg-wa" placeholder="08...">
                </div>
                <div class="form-group" style="flex:1">
                    <label>Kategori</label>
                    <select id="reg-kategori"><option>Umum</option><option>VIP</option><option>VVIP</option><option>Keluarga</option></select>
                </div>
            </div>
            <div style="display:flex; gap:10px;">
                <div class="form-group" style="flex:1">
                    <label>Pihak Pengundang</label>
                    <select id="reg-host"></select>
                </div>
                <div class="form-group" style="flex:1">
                    <label>Sesi</label>
                    <select id="reg-sesi"></select>
                </div>
            </div>
            <div class="form-group">
                <label>Alamat / Instansi</label>
                <input type="text" id="reg-alamat" placeholder="Kota / Instansi...">
            </div>
            <button class="btn-submit" onclick="submitOnsite()">DAFTARKAN & CHECK-IN</button>
        </div>
    </div>
</div>

<!-- MODAL CONFIRM (CLONE FROM CHECKIN) -->
<div id="modalConfirm" class="modal-overlay">
    <div class="modal-card">
        <h3 id="m-nama" style="margin: 0; color: var(--text-main); font-size: 15px; font-weight: 800; text-align: center; text-transform: uppercase;">Konfirmasi</h3>
        <p id="m-info" style="font-size: 10px; color: var(--text-muted); margin: 5px 0 15px;">Pilih Pax & Ambil Foto (Opsional)</p>
        
        <div class="modal-video-box">
            <video id="camera-preview" autoplay playsinline muted></video>
            <canvas id="capture-canvas" style="display:none;"></canvas>
        </div>
        <button id="btn-snap" onclick="takeSelfie()" style="background: none; border: 1px solid var(--gold); color: var(--gold); padding: 8px 20px; border-radius: 30px; font-size: 10px; font-weight: 800; cursor: pointer; margin-bottom: 15px;">AMBIL FOTO</button>

        <div class="pax-row">
            <span class="pax-label">Dewasa</span>
            <div class="counter-wrapper">
                <button type="button" class="btn-step" onclick="updatePax('adult', -1)">-</button>
                <div id="m-pax-adult" class="counter-value">1</div>
                <button type="button" class="btn-step" onclick="updatePax('adult', 1)">+</button>
            </div>
        </div>
        <div class="pax-row">
            <span class="pax-label">Anak</span>
            <div class="counter-wrapper">
                <button type="button" class="btn-step" onclick="updatePax('child', -1)">-</button>
                <div id="m-pax-child" class="counter-value">0</div>
                <button type="button" class="btn-step" onclick="updatePax('child', 1)">+</button>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-cancel" onclick="closeModal()">BATAL</button>
            <button class="btn-confirm" id="btn-final-confirm" onclick="executeCheckin()">CHECK-IN</button>
        </div>
    </div>
</div>

<div id="loading" class="loading-overlay">MEMPROSES...</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJdAGMyhDHfyWJTq2IrEzCVVBMxEuwlaflv4_xBdbeVIzrQRG1SfCnBGz-XXbDjM3C/exec";
    
    let CURRENT_SS_ID = null;
    let masterData = [];
    let html5QrCode = null;
    let currentStream = null;
    let capturedBase64 = null;
    let selectedGuest = null;

    async function initApp() {
        if (!window.SAPATAMU_RESOLVED) {
            setTimeout(initApp, 100);
            return;
        }
        
        const session = JSON.parse(sessionStorage.getItem('sapatamu_session')) || JSON.parse(localStorage.getItem('sapatamu_db'));
        CURRENT_SS_ID = window.CURRENT_SS_ID || (session ? session.ssId : null);
        
        if (!CURRENT_SS_ID) { window.location.href = "login.html"; return; }
        
        fetchData();
        initScanner();
    }

    async function fetchData() {
        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "get_master_data", ssId: CURRENT_SS_ID }) });
            const data = await res.json();
            masterData = data.guestList || [];
            
            if (data.dropdownOptions) {
                document.getElementById('reg-host').innerHTML = data.dropdownOptions.map(o => `<option value="${o}">${o}</option>`).join('');
            }
            if (data.eventMeta && data.eventMeta.sesiOptions) {
                document.getElementById('reg-sesi').innerHTML = '<option value="">Pilih Sesi</option>' + data.eventMeta.sesiOptions.map(s => `<option value="${s}">${s}</option>`).join('');
            }
            renderUI();
        } catch (e) { console.error(e); }
    }

    function initScanner() {
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 25, qrbox: 220, aspectRatio: 1.0 }, onScanSuccess).catch(e => console.log(e));
    }

    function onScanSuccess(txt) {
        if (document.getElementById('modalConfirm').style.display === 'flex') return;
        const frame = document.getElementById('target-frame');
        let scCode = txt.trim();
        if (scCode.includes("id=")) scCode = scCode.split("id=")[1].split("&")[0];
        
        frame.classList.add('qr-detected');
        const guest = masterData.find(g => String(g.kode).trim().toUpperCase() === scCode.toUpperCase());
        
        if (guest) {
            if (String(guest.statusHadir) === "1") {
                alert("Tamu '" + guest.nama + "' sudah hadir.");
                frame.classList.remove('qr-detected');
            } else {
                frame.classList.add('qr-success');
                setTimeout(() => {
                    frame.classList.remove('qr-success', 'qr-detected');
                    openConfirm(guest);
                }, 400);
            }
        } else {
            setTimeout(() => frame.classList.remove('qr-detected'), 1000);
        }
    }

    function switchTab(t) {
        document.getElementById('tab-scan-btn').classList.toggle('active', t==='scan');
        document.getElementById('tab-reg-btn').classList.toggle('active', t==='reg');
        document.getElementById('pane-scan').style.display = t==='scan'?'flex':'none';
        document.getElementById('pane-reg').style.display = t==='reg'?'block':'none';
        if (t==='scan') initScanner();
        else if (html5QrCode) html5QrCode.stop();
    }

    function renderUI() {
        const term = document.getElementById('search-box').value.toLowerCase();
        const filtered = masterData.filter(g => (g.nama||"").toLowerCase().includes(term) || (g.kode||"").toLowerCase().includes(term));
        document.getElementById('guest-list').innerHTML = filtered.map(g => {
            const isHadir = g.jamDatang && g.jamDatang !== "-";
            return `
                <div class="guest-item ${isHadir?'checked-in':''}" style="border-top-color: ${isHadir?'var(--success)':'var(--border)'}" onclick="${isHadir?'':'openConfirm('+JSON.stringify(g).replace(/"/g, '&quot;')+')'}">
                    <div class="guest-header">
                        <div class="guest-name">${g.nama}</div>
                        <div class="guest-cat">${g.kategori || 'UMUM'}</div>
                    </div>
                    <div class="guest-details">
                        <div class="detail-item">🏠 <span>${g.alamat || '-'}</span></div>
                        <div class="detail-item">💌 Inv by: <span>${g.pihakPengundang || '-'}</span></div>
                    </div>
                    <div class="guest-footer">
                        <div style="font-size:8px; color:#ccc">ID: ${g.kode}</div>
                        <div style="font-size:9px; font-weight:800; color:${isHadir?'var(--success)':'#ccc'}">${isHadir?'✓ HADIR':'● BELUM SCAN'}</div>
                    </div>
                </div>`;
        }).join('');
    }

    async function openConfirm(guest) {
        selectedGuest = guest;
        document.getElementById('m-nama').innerText = guest.nama;
        document.getElementById('m-info').innerText = `${guest.kategori} | ${guest.alamat}`;
        document.getElementById('modalConfirm').style.display = 'flex';
        capturedBase64 = null;
        
        // Reset pax based on plan
        const initialAdult = parseInt(guest.rencanaHadir) || 1;
        document.getElementById('m-pax-adult').innerText = initialAdult;
        document.getElementById('m-pax-child').innerText = "0";

        try {
            if (html5QrCode) await html5QrCode.stop();
            currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('camera-preview').srcObject = currentStream;
        } catch(e) {}
    }

    function closeModal() {
        if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
        document.getElementById('modalConfirm').style.display = 'none';
        setTimeout(() => initScanner(), 300);
    }

    window.updatePax = function(type, delta) {
        const el = document.getElementById('m-pax-' + type);
        let val = parseInt(el.innerText) + delta;
        if (type === 'adult' && val < 1) val = 1;
        if (type === 'child' && val < 0) val = 0;
        el.innerText = val;
    };

    function takeSelfie() {
        const v = document.getElementById('camera-preview'), c = document.getElementById('capture-canvas'), ctx = c.getContext('2d');
        c.width = v.videoWidth; c.height = v.videoHeight;
        ctx.translate(c.width, 0); ctx.scale(-1, 1);
        ctx.drawImage(v, 0, 0, c.width, c.height);
        capturedBase64 = c.toDataURL('image/jpeg', 0.8);
        
        const btnSnap = document.getElementById('btn-snap');
        btnSnap.innerText = "ULANGI FOTO ✓";
        btnSnap.style.background = "var(--success)";
        btnSnap.style.color = "white";
    }

    async function executeCheckin() {
        document.getElementById('loading').style.display = 'flex';
        const adult = document.getElementById('m-pax-adult').innerText;
        const child = document.getElementById('m-pax-child').innerText;
        const paxString = `${parseInt(adult)+parseInt(child)} ( ${adult}D + ${child}A )`;

        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "confirm_checkin", ssId: CURRENT_SS_ID, kodeUnik: selectedGuest.kode, realHadir: paxString, catatan: "-" }) });
            if (capturedBase64) fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', body: JSON.stringify({ action:"uploadSelfie", image:capturedBase64, nama:selectedGuest.nama, kode:selectedGuest.kode, ssId:CURRENT_SS_ID }) });
            
            confetti({ particleCount: 100, spread: 70 });
            closeModal(); 
            fetchData();
        } catch(e) { alert("Error!"); } finally { document.getElementById('loading').style.display = 'none'; }
    }

    async function submitOnsite() {
        const nama = document.getElementById('reg-nama').value;
        if (!nama) return alert("Nama wajib diisi!");
        document.getElementById('loading').style.display = 'flex';
        
        const adult = 1; // Default for onsite
        const child = 0;
        const paxString = `1 ( 1D + 0A )`;

        try {
            // Kita gunakan prefix ONS sesuai permintaan
            const payload = { 
                action: "register_new_onsite", 
                ssId: CURRENT_SS_ID, 
                namaTamu: nama, 
                alamat: document.getElementById('reg-alamat').value, 
                whatsapp: document.getElementById('reg-wa').value, 
                kategori: document.getElementById('reg-kategori').value, 
                host: document.getElementById('reg-host').value, 
                sesi: document.getElementById('reg-sesi').value, 
                souvenir: "1", 
                realHadir: paxString,
                prefix: "ONS" // Memastikan backend tau mau pakai ONS
            };
            
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            const json = await res.json();
            
            if (json.status === "success") {
                alert("Berhasil mendaftarkan tamu " + nama + " (ID: " + json.kode + ")");
                document.getElementById('reg-nama').value = "";
                document.getElementById('reg-wa').value = "";
                document.getElementById('reg-alamat').value = "";
                switchTab('scan'); fetchData();
            }
        } catch(e) { alert("Gagal koneksi."); } finally { document.getElementById('loading').style.display = 'none'; }
    }
</script>
</body>
</html>
