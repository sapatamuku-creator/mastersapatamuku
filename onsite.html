<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>sapatamu.ku | ONSITE CHECK-IN</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="subdomain_resolver.js?v=3.2"></script>

    <style>
        :root { 
            --primary: #E07B7B; 
            --bg: #FFF9F5; 
            --text: #4A3F35; 
            --text-muted: #8C7560;
            --border: #F0E6DE; 
            --success: #27ae60;
            --gold: #C8962E;
        }
        
        * { box-sizing: border-box; }
        html, body { 
            height: 100%; width: 100%; margin: 0; padding: 0; 
            background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; 
            color: var(--text);
            overflow: hidden;
        }

        #app-root {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .header {
            text-align: center;
            padding: 15px;
            background: white;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .header h1 { font-size: 18px; margin: 0; font-weight: 800; color: var(--text); }
        .header span { color: var(--primary); }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px 120px; 
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .mode-tabs {
            display: flex;
            background: #F0E6DE;
            padding: 4px;
            border-radius: 15px;
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        .mode-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .mode-tab.active { background: white; color: var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        .search-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg);
            padding-bottom: 10px;
        }
        .search-input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 18px;
            border: 2px solid var(--border);
            background: white;
            font-size: 14px;
            outline: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }

        #guest-list-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }

        .guest-item {
            background: white;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .guest-item:active { transform: scale(0.97); }
        .guest-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; border-bottom: 1px dashed var(--border); padding-bottom: 10px; }
        .guest-badge { font-size: 8px; font-weight: 800; padding: 4px 10px; border-radius: 8px; background: #FCF8F5; color: var(--gold); border: 1px solid var(--border); text-transform: uppercase; }
        .guest-wa { font-size: 10px; color: var(--text-muted); font-weight: 600; }
        .guest-item h4 { margin: 0; font-size: 16px; font-weight: 800; color: var(--text); }
        .guest-details { margin: 12px 0; display: flex; flex-direction: column; gap: 5px; }
        .detail-item { font-size: 11px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .detail-item span { color: var(--text); }
        .guest-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid var(--bg); padding-top: 10px; }
        .pax-badge { font-size: 11px; font-weight: 800; color: var(--primary); }
        .guest-status-label { font-size: 10px; font-weight: 800; text-transform: uppercase; }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 85px;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 9px;
            font-weight: 800;
            gap: 5px;
            width: 70px;
        }
        .nav-item.active { color: var(--primary); }
        .nav-item svg { width: 24px; height: 24px; }

        .scan-btn-container { position: relative; width: 85px; height: 85px; display: flex; justify-content: center; align-items: center; margin-top: -55px; }
        .scan-trigger {
            width: 75px; height: 75px;
            background: var(--primary);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: white;
            box-shadow: 0 10px 25px rgba(224, 123, 123, 0.4);
            border: 6px solid var(--bg);
            cursor: pointer;
            transition: 0.3s;
        }
        .scan-trigger:active { transform: scale(0.9); }
        .scan-trigger svg { width: 32px; height: 32px; }

        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            z-index: 3000; display: none; align-items: center; justify-content: center; padding: 15px;
        }
        .modal-content {
            background: white; width: 100%; max-width: 700px; border-radius: 35px;
            padding: 30px; max-height: 95vh; overflow-y: auto; box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        }

        #scanner-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: black; z-index: 4000; display: none;
        }
        #reader { width: 100%; height: 100%; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
        .scanner-header {
            position: absolute; top: 40px; left: 0; right: 0;
            display: flex; justify-content: space-between; padding: 0 20px; z-index: 10;
        }
        .close-scanner {
            background: rgba(255,255,255,0.2); color: white; border: none;
            padding: 12px 24px; border-radius: 15px; font-weight: 800; backdrop-filter: blur(10px);
        }

        .onsite-input-group { margin-bottom: 20px; }
        .onsite-input-group label { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
        .onsite-input-group input, .onsite-input-group select { width: 100%; padding: 15px; border-radius: 15px; border: 2px solid var(--border); outline: none; background: #FCF8F5; font-size: 14px; font-weight: 600; }
        .pax-row { display: flex; justify-content: space-between; align-items: center; background: #FCF8F5; padding: 15px 20px; border-radius: 18px; border: 1.5px solid var(--border); margin-bottom: 12px; }
        .counter-wrapper { display: flex; align-items: center; gap: 15px; }
        .btn-step { width: 40px; height: 40px; border: none; background: white; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.05); }

        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 9999; display: none; align-items: center; justify-content: center; font-weight: 800; color: var(--primary); }
        
        .selfie-box { width: 100%; aspect-ratio: 1/1; background: black; border-radius: 25px; overflow: hidden; border: 4px solid var(--border); margin-bottom: 20px; position: relative; }
        .selfie-video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .selfie-canvas { width: 100%; height: 100%; object-fit: cover; display: none; }
    </style>
</head>
<body onload="initApp()">

<div id="app-root">
    <div id="loading" class="loading-overlay">MEMPROSES...</div>

    <header class="header">
        <h1>SapaTamu<span>.ku</span></h1>
    </header>

    <main class="main-content">
        <div class="mode-tabs">
            <div id="tab-scan" class="mode-tab active" onclick="switchMode('scan')">QR SCAN</div>
            <div id="tab-onsite" class="mode-tab" onclick="switchMode('onsite')">ON-SITE REG</div>
        </div>

        <div id="panel-scan">
            <div class="search-container">
                <input type="text" id="search-input" class="search-input" placeholder="Cari Nama / Kode..." oninput="renderGuestList()">
            </div>
            <div id="guest-list-container"></div>
        </div>

        <div id="panel-onsite" style="display:none;">
            <div style="background:white; border-radius:35px; padding:35px; border:1px solid var(--border);">
                <h3 style="font-size:22px; margin-bottom:25px; font-weight:800; color:var(--text);">Registrasi Tamu Baru</h3>
                
                <div class="onsite-input-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="reg-nama" placeholder="Masukkan nama tamu...">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="onsite-input-group">
                        <label>WhatsApp</label>
                        <input type="tel" id="reg-wa" placeholder="08...">
                    </div>
                    <div class="onsite-input-group">
                        <label>Kategori</label>
                        <select id="reg-kategori"><option>Umum</option><option>VIP</option><option>VVIP</option><option>Keluarga</option></select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="onsite-input-group">
                        <label>Pihak Pengundang</label>
                        <select id="reg-host"></select>
                    </div>
                    <div class="onsite-input-group">
                        <label>Souvenir</label>
                        <select id="reg-souvenir"><option value="1">Ya</option><option value="0">Tidak</option></select>
                    </div>
                </div>

                <div class="onsite-input-group">
                    <label>Sesi Undangan</label>
                    <select id="reg-sesi"><option value="">Memuat sesi...</option></select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                    <div class="pax-row">
                        <span class="pax-label">DEWASA</span>
                        <div class="counter-wrapper">
                            <button type="button" class="btn-step" onclick="updatePax('reg', 'adult', -1)">-</button>
                            <div id="reg-pax-adult" style="font-weight:800; min-width:20px; text-align:center;">1</div>
                            <button type="button" class="btn-step" onclick="updatePax('reg', 'adult', 1)">+</button>
                        </div>
                    </div>
                    <div class="pax-row">
                        <span class="pax-label">ANAK</span>
                        <div class="counter-wrapper">
                            <button type="button" class="btn-step" onclick="updatePax('reg', 'child', -1)">-</button>
                            <div id="reg-pax-child" style="font-weight:800; min-width:20px; text-align:center;">0</div>
                            <button type="button" class="btn-step" onclick="updatePax('reg', 'child', 1)">+</button>
                        </div>
                    </div>
                </div>

                <div class="onsite-input-group">
                    <label>Alamat / Instansi</label>
                    <input type="text" id="reg-alamat" placeholder="Kota atau Instansi...">
                </div>

                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <button onclick="openOnsiteSelfie()" id="btn-trigger-onsite-selfie" style="width:100%; padding:18px; border-radius:18px; border:2px solid var(--primary); background:white; color:var(--primary); font-weight:800;">AMBIL SELFIE (OPSIONAL)</button>
                    <button onclick="submitOnsite()" style="width:100%; padding:20px; border-radius:20px; background:var(--primary); color:white; font-weight:800; border:none; box-shadow: 0 10px 25px rgba(224, 123, 123, 0.3);">DAFTARKAN TAMU</button>
                </div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>DASHBOARD</span>
        </a>
        <div class="scan-btn-container">
            <div class="scan-trigger" onclick="openScanner()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            </div>
        </div>
        <a href="#" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
            <span>CHECK-IN</span>
        </a>
    </nav>
</div>

<!-- CHECKIN CONFIRM MODAL -->
<div id="confirm-modal" class="modal">
    <div class="modal-content">
        <h2 id="m-nama" style="font-size:24px; font-weight:800; text-align:center; margin-bottom:5px;">NAMA TAMU</h2>
        <p id="m-info" style="text-align:center; color:var(--text-muted); font-size:14px; margin-bottom:20px;">Kategori | Alamat</p>
        
        <div class="selfie-box">
            <video id="confirm-video" class="selfie-video" autoplay playsinline muted></video>
            <canvas id="preview-canvas" class="selfie-canvas"></canvas>
        </div>

        <div style="display:flex; justify-content:center; margin-bottom:25px;">
            <button onclick="takeSnapshot()" id="btn-snap" style="padding:12px 30px; border-radius:15px; border:2px solid var(--primary); background:white; color:var(--primary); font-weight:800;">AMBIL SELFIE</button>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-bottom:25px;">
            <div class="pax-row">
                <span class="pax-label">DEWASA</span>
                <div class="counter-wrapper">
                    <button type="button" class="btn-step" onclick="updatePax('m', 'adult', -1)">-</button>
                    <div id="m-pax-adult" style="font-weight:800;">1</div>
                    <button type="button" class="btn-step" onclick="updatePax('m', 'adult', 1)">+</button>
                </div>
            </div>
            <div class="pax-row">
                <span class="pax-label">ANAK</span>
                <div class="counter-wrapper">
                    <button type="button" class="btn-step" onclick="updatePax('m', 'child', -1)">-</button>
                    <div id="m-pax-child" style="font-weight:800;">0</div>
                    <button type="button" class="btn-step" onclick="updatePax('m', 'child', 1)">+</button>
                </div>
            </div>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:25px;">
            <button id="m-tag-angpao" onclick="toggleTag(this)" style="flex:1; padding:15px; border-radius:15px; border:1px solid var(--border); font-weight:800; color:var(--text-muted);">ANGPAO</button>
            <button id="m-tag-kado" onclick="toggleTag(this)" style="flex:1; padding:15px; border-radius:15px; border:1px solid var(--border); font-weight:800; color:var(--text-muted);">KADO</button>
        </div>

        <div style="display:flex; gap:15px;">
            <button onclick="closeConfirm()" style="flex:1; padding:18px; border-radius:18px; background:#eee; color:#666; font-weight:800; border:none;">BATAL</button>
            <button id="btn-final-confirm" onclick="executeCheckIn()" style="flex:2; padding:18px; border-radius:18px; background:var(--primary); color:white; font-weight:800; border:none; box-shadow:0 10px 20px rgba(224,123,123,0.3);">KONFIRMASI HADIR</button>
        </div>
    </div>
</div>

<!-- ONSITE SELFIE MODAL -->
<div id="onsite-selfie-modal" class="modal">
    <div class="modal-content" style="max-width: 450px;">
        <h2 style="font-size:20px; font-weight:800; text-align:center; margin-bottom:20px;">Selfie Tamu On-site</h2>
        
        <div class="selfie-box">
            <video id="onsite-video" class="selfie-video" autoplay playsinline muted></video>
            <canvas id="capture-preview-onsite" class="selfie-canvas"></canvas>
        </div>

        <div style="display:flex; justify-content:center; margin-bottom:25px;">
            <button onclick="takeOnsiteSnapshot()" id="btn-snap-onsite" style="padding:12px 30px; border-radius:15px; border:2px solid var(--primary); background:white; color:var(--primary); font-weight:800;">AMBIL FOTO</button>
        </div>

        <div style="display:flex; gap:15px;">
            <button onclick="closeOnsiteSelfie()" style="flex:1; padding:15px; border-radius:15px; background:#eee; color:#666; font-weight:800; border:none;">BATAL</button>
            <button onclick="closeOnsiteSelfie()" style="flex:1; padding:15px; border-radius:15px; background:var(--success); color:white; font-weight:800; border:none;">GUNAKAN FOTO</button>
        </div>
    </div>
</div>

<div id="scanner-overlay">
    <div class="scanner-header">
        <button class="close-scanner" onclick="closeScanner()">BATAL</button>
        <div style="color:white; font-weight:800; font-size:14px; margin-top:10px;">SCAN QR TAMU</div>
        <div style="width:60px;"></div>
    </div>
    <div id="reader"></div>
</div>

<script>
    let masterData = [];
    let html5QrCode = null;
    let currentMode = 'scan';
    let selectedGuest = null;
    let capturedPhoto = null;
    let capturedOnsitePhoto = null;
    let onsiteStream = null;
    let confirmStream = null;

    async function initApp() {
        console.log("App Initializing...");
        // Wait for subdomain resolution if needed
        if (!window.SAPATAMU_RESOLVED) {
            await new Promise(r => {
                let timer = 0;
                const check = setInterval(() => {
                    timer += 100;
                    if (window.SAPATAMU_RESOLVED || timer > 3000) { clearInterval(check); r(); }
                }, 100);
            });
        }
        
        // Fallback session logic
        if (!window.CURRENT_SS_ID) {
            const session = JSON.parse(sessionStorage.getItem('sapatamu_session')) || JSON.parse(localStorage.getItem('sapatamu_db'));
            window.CURRENT_SS_ID = session ? session.ssId : null;
        }

        if (!window.CURRENT_SS_ID) {
            console.error("SS_ID NOT FOUND");
            return;
        }

        await fetchMasterData();
    }

    async function fetchMasterData() {
        const ssId = window.CURRENT_SS_ID;
        const api = window.SCRIPT_URL || "https://script.google.com/macros/s/AKfycbzJdAGMyhDHfyWJTq2IrEzCVVBMxEuwlaflv4_xBdbeVIzrQRG1SfCnBGz-XXbDjM3C/exec";
        
        try {
            const res = await fetch(api, { method: 'POST', body: JSON.stringify({ action: "get_master_data", ssId: ssId }) });
            const data = await res.json();
            console.log("Data Received:", data.guestList ? data.guestList.length : 0);
            masterData = data.guestList || [];
            
            const hostSelect = document.getElementById('reg-host');
            if (hostSelect && data.dropdownOptions) {
                hostSelect.innerHTML = data.dropdownOptions.map(o => `<option value="${o}">${o}</option>`).join('');
            }
            
            const sesiSelect = document.getElementById('reg-sesi');
            if (sesiSelect && data.eventMeta && data.eventMeta.sesiOptions) {
                sesiSelect.innerHTML = '<option value="">Pilih Sesi</option>' + data.eventMeta.sesiOptions.map(s => `<option value="${s}">${s}</option>`).join('');
            }
            renderGuestList();
        } catch (e) { console.error("Fetch Error:", e); }
    }

    window.renderGuestList = function() {
        const container = document.getElementById('guest-list-container');
        const term = document.getElementById('search-input').value.toLowerCase();
        const filtered = masterData.filter(g => (g.nama||"").toLowerCase().includes(term) || (g.kode||"").toLowerCase().includes(term));

        if (filtered.length === 0) {
            container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted); font-size:12px;">Tidak ada data tamu ditemukan.</div>';
            return;
        }

        container.innerHTML = filtered.map(g => {
            const isHadir = String(g.statusHadir) === "1";
            return `
                <div class="guest-item" style="border-left: 6px solid ${isHadir?'var(--success)':'var(--border)'};" onclick="${isHadir?"":`openConfirm('${g.kode}','${g.nama}','${g.alamat}','${g.kategori}')`}">
                    <div class="guest-header">
                        <div class="guest-badge">${g.kategori || 'UMUM'}</div>
                        <div class="guest-wa">${g.whatsapp || '-'}</div>
                    </div>
                    <h4>${g.nama}</h4>
                    <div class="guest-details">
                        <div class="detail-item">🏠 <span>${g.alamat || '-'}</span></div>
                        <div class="detail-item">💌 <span>${g.pihakPengundang || '-'}</span></div>
                    </div>
                    <div class="guest-footer">
                        <div class="pax-badge">PLAN: ${g.rencanaHadir || '1'}</div>
                        <div class="guest-status-label" style="color:${isHadir?'var(--success)':'var(--text-muted)'}">${isHadir ? '✓ HADIR' : '● BELUM SCAN'}</div>
                    </div>
                </div>`;
        }).join('');
    };

    window.openScanner = function() {
        document.getElementById('scanner-overlay').style.display = 'block';
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
        
        // Gunakan integer sederhana untuk qrbox agar kompatibel di semua browser
        const qrBoxSize = 250;
        
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 25, qrbox: qrBoxSize, aspectRatio: 1.0 }, 
            (txt) => {
                console.log("QR Scanned:", txt);
                // Alert sementara untuk debug (Hapus setelah berhasil)
                // alert("QR Terbaca: " + txt); 
                
                let scCode = txt.trim();
                
                // Handle jika yang di-scan adalah URL (Personal Link)
                if (scCode.includes("id=")) {
                    scCode = scCode.split("id=")[1].split("&")[0];
                }
                
                const t = masterData.find(g => String(g.kode).trim().toUpperCase() === scCode.toUpperCase());
                
                if (t) {
                    if (String(t.statusHadir) === "1") {
                        alert("TAMU SUDAH HADIR:\n" + t.nama + " (" + t.kategori + ")");
                    } else {
                        // Tunggu scanner mati baru buka modal agar tidak rebutan kamera
                        closeScanner().then(() => {
                            openConfirm(t.kode, t.nama, t.alamat, t.kategori);
                        });
                    }
                } else {
                    alert("KODE TIDAK DIKENAL:\n" + scCode + "\n\nPastikan QR Code sesuai dengan data di spreadsheet.");
                }
            }
        ).catch(err => console.error(err));
    };

    window.closeScanner = async function() {
        if (html5QrCode) {
            try { await html5QrCode.stop(); } catch(e) {}
        }
        document.getElementById('scanner-overlay').style.display = 'none';
    };

    window.switchMode = function(m) {
        currentMode = m;
        document.getElementById('tab-scan').classList.toggle('active', m==='scan');
        document.getElementById('tab-onsite').classList.toggle('active', m==='onsite');
        document.getElementById('panel-scan').style.display = m==='scan'?'block':'none';
        document.getElementById('panel-onsite').style.display = m==='onsite'?'block':'none';
    };

    window.openConfirm = async function(kode, nama, alamat, kategori) {
        selectedGuest = { kode, nama, alamat, kategori };
        document.getElementById('m-nama').innerText = nama;
        document.getElementById('m-info').innerText = `${kategori} | ${alamat}`;
        document.getElementById('confirm-modal').style.display = 'flex';
        resetSnapshot();
        try {
            confirmStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('confirm-video').srcObject = confirmStream;
        } catch(e) { console.error("Camera Error:", e); }
    };

    window.closeConfirm = function() {
        if (confirmStream) { confirmStream.getTracks().forEach(t => t.stop()); confirmStream = null; }
        document.getElementById('confirm-modal').style.display = 'none';
    };

    window.openOnsiteSelfie = async function() {
        document.getElementById('onsite-selfie-modal').style.display = 'flex';
        resetOnsiteSnapshot();
        try {
            onsiteStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('onsite-video').srcObject = onsiteStream;
        } catch(e) { console.error("Camera Error:", e); }
    };

    window.closeOnsiteSelfie = function() {
        if (onsiteStream) { onsiteStream.getTracks().forEach(t => t.stop()); onsiteStream = null; }
        document.getElementById('onsite-selfie-modal').style.display = 'none';
    };

    window.updatePax = function(pfx, type, val) {
        const el = document.getElementById(`${pfx}-pax-${type}`);
        let cur = parseInt(el.innerText);
        cur = Math.max(0, cur + val);
        if (type === 'adult' && cur < 1 && pfx === 'm') cur = 1;
        el.innerText = cur;
    };

    window.toggleTag = function(btn) { 
        btn.classList.toggle('active'); 
        btn.style.background = btn.classList.contains('active') ? 'var(--gold)' : 'white'; 
        btn.style.color = btn.classList.contains('active') ? 'white' : 'var(--text-muted)'; 
    };

    window.takeSnapshot = function() {
        const v = document.getElementById('confirm-video'), c = document.getElementById('preview-canvas'), ctx = c.getContext('2d');
        if (v.style.display === 'none') { resetSnapshot(); return; }
        c.width = v.videoWidth; c.height = v.videoHeight;
        ctx.translate(c.width, 0); ctx.scale(-1, 1);
        ctx.drawImage(v, 0, 0, c.width, c.height);
        capturedPhoto = c.toDataURL('image/jpeg', 0.8);
        v.style.display = 'none'; c.style.display = 'block';
        document.getElementById('btn-snap').innerText = "ULANGI";
    };

    function resetSnapshot() { 
        document.getElementById('confirm-video').style.display = 'block'; 
        document.getElementById('preview-canvas').style.display = 'none'; 
        capturedPhoto = null; 
        document.getElementById('btn-snap').innerText = "AMBIL SELFIE"; 
    }

    window.executeCheckIn = async function() {
        document.getElementById('loading').style.display = 'flex';
        const adult = document.getElementById('m-pax-adult').innerText;
        const child = document.getElementById('m-pax-child').innerText;
        const paxString = `${parseInt(adult)+parseInt(child)} ( ${adult}D + ${child}A )`;
        const note = (document.getElementById('m-tag-angpao').classList.contains('active')?"ANGPAO ":"") + (document.getElementById('m-tag-kado').classList.contains('active')?"KADO":"");
        
        try {
            const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ action: "confirm_checkin", ssId: window.CURRENT_SS_ID, kodeUnik: selectedGuest.kode, realHadir: paxString, catatan: note||"-" }) });
            const json = await res.json();
            if (json.status === "success") {
                if (capturedPhoto) fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "uploadSelfie", image: capturedPhoto, nama: selectedGuest.nama, kode: selectedGuest.kode, ssId: window.CURRENT_SS_ID }) });
                confetti({ particleCount: 150, spread: 70 });
                closeConfirm();
                fetchMasterData();
            }
        } catch (e) { console.error(e); } finally { document.getElementById('loading').style.display = 'none'; }
    };

    window.takeOnsiteSnapshot = function() {
        const v = document.getElementById('onsite-video'), c = document.getElementById('capture-preview-onsite'), ctx = c.getContext('2d');
        if (v.style.display === 'none') { resetOnsiteSnapshot(); return; }
        c.width = v.videoWidth; c.height = v.videoHeight;
        ctx.translate(c.width, 0); ctx.scale(-1, 1);
        ctx.drawImage(v, 0, 0, c.width, c.height);
        capturedOnsitePhoto = c.toDataURL('image/jpeg', 0.8);
        v.style.display = 'none'; c.style.display = 'block';
        document.getElementById('btn-snap-onsite').innerText = "ULANGI SELFIE";
        document.getElementById('btn-trigger-onsite-selfie').innerText = "SELFIE DIAMBIL ✓";
        document.getElementById('btn-trigger-onsite-selfie').style.borderColor = 'var(--success)';
        document.getElementById('btn-trigger-onsite-selfie').style.color = 'var(--success)';
    };

    function resetOnsiteSnapshot() { 
        document.getElementById('onsite-video').style.display = 'block'; 
        document.getElementById('capture-preview-onsite').style.display = 'none'; 
        capturedOnsitePhoto = null; 
        document.getElementById('btn-snap-onsite').innerText = "AMBIL FOTO"; 
        document.getElementById('btn-trigger-onsite-selfie').innerText = "AMBIL SELFIE (OPSIONAL)";
        document.getElementById('btn-trigger-onsite-selfie').style.borderColor = 'var(--primary)';
        document.getElementById('btn-trigger-onsite-selfie').style.color = 'var(--primary)';
    }

    window.submitOnsite = async function() {
        if (!document.getElementById('reg-nama').value) { alert("Nama wajib diisi!"); return; }
        document.getElementById('loading').style.display = 'flex';
        const adult = document.getElementById('reg-pax-adult').innerText;
        const child = document.getElementById('reg-pax-child').innerText;
        const paxString = `${parseInt(adult)+parseInt(child)} ( ${adult}D + ${child}A )`;
        const payload = { action: "register_new_onsite", ssId: window.CURRENT_SS_ID, namaTamu: document.getElementById('reg-nama').value, alamat: document.getElementById('reg-alamat').value, whatsapp: document.getElementById('reg-wa').value, kategori: document.getElementById('reg-kategori').value, host: document.getElementById('reg-host').value, sesi: document.getElementById('reg-sesi').value, souvenir: document.getElementById('reg-souvenir').value, realHadir: paxString };

        try {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            const json = await res.json();
            if (json.status === "success") {
                if (capturedOnsitePhoto) fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "uploadSelfie", image: capturedOnsitePhoto, nama: payload.namaTamu, kode: json.kode, ssId: window.CURRENT_SS_ID }) });
                confetti({ particleCount: 100, spread: 50 });
                
                // Clear Form
                document.getElementById('reg-nama').value = "";
                document.getElementById('reg-wa').value = "";
                document.getElementById('reg-alamat').value = "";
                resetOnsiteSnapshot();
                
                switchMode('scan');
                fetchMasterData();
            }
        } catch (e) { console.error(e); } finally { document.getElementById('loading').style.display = 'none'; }
    };
</script>
</body>
</html>
